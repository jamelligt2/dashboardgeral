function resumo(k){const a=agg(segCamp(k)),v=vend(s=>s.seg===k);return Object.assign({},a,v,{roas:div(v.rec,a.spend),cpa:div(a.spend,v.ped),ticket:div(v.rec,v.ped)})}
function kpiCards(o){
  const it=[['Investimento',money(o.spend)],['Receita (Hotmart)',money(o.rec)],['Vendas (pedidos)',nf(o.ped)],['ROAS',o.roas==null?'—':nf(o.roas,2)+'x'],['CPA',money(o.cpa)],['Ticket médio',money(o.ticket)]];
  return '<div class="grid k6">'+it.map(x=>'<div class="card"><h3>'+x[0]+'</h3><div class="kv">'+x[1]+'</div></div>').join('')+'</div>';
}
function funnel(o,cor){
  const st=[['Impressões',o.imp],['Cliques no link',o.clk],['Visualiz. da página',o.lpv],['Vendas (Hotmart)',o.ped]];
  const mx=Math.max(1,st[0][1]);
  return '<div class="fun" style="--fc:'+cor+'">'+st.map((s,i)=>'<div style="width:'+Math.max(34,100-i*22)+'%"><span>'+s[0]+'</span><span>'+nf(s[1])+'</span></div>').join('')+'</div><div class="note">CTR '+pct(div(o.clk,o.imp))+' · Clique→Visualiz. '+pct(div(o.lpv,o.clk))+' · Visualiz.→Venda '+pct(div(o.ped,o.lpv))+' · Compras no pixel Meta: '+nf(o.pur)+'</div>';
}
function dates(){const s=new Set();DATA.daily.forEach(r=>{if(inR(r[0]))s.add(r[0])});DATA.sales.forEach(x=>{if(inR(x.d))s.add(x.d)});return [...s].sort()}
function chartDaily(id,segs){
  const ds=dates(),mk=(k)=>ds.map(d=>{let t=0;DATA.daily.forEach(r=>{if(r[0]===d&&CAMP[r[1]].seg===k)t+=r[2]});return +t.toFixed(2)});
  const rec=ds.map(d=>+DATA.sales.filter(s=>s.d===d&&segs.includes(s.seg)).reduce((a,s)=>a+s.brl,0).toFixed(2));
  const sets=segs.map(k=>({type:'bar',label:'Invest. '+SEG[k].n,data:mk(k),backgroundColor:SEG[k].cor+'cc',stack:'s',yAxisID:'y'}));
  sets.push({type:'line',label:'Receita atribuída',data:rec,borderColor:'#fff',backgroundColor:'#fff',tension:.25,yAxisID:'y'});
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(document.getElementById(id),{data:{labels:ds.map(dBR),datasets:sets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aaa',font:{family:'DM Sans'}}}},scales:{x:{stacked:true,ticks:{color:'#888'},grid:{color:'#1c1c1c'}},y:{stacked:true,ticks:{color:'#888',callback:v=>'R$ '+v},grid:{color:'#1c1c1c'}}}}});
}
function rowM(nome,a,v){const roas=div(v.rec,a.spend);return '<tr><td>'+nome+'</td><td>'+money(a.spend)+'</td><td>'+nf(a.imp)+'</td><td>'+nf(a.clk)+'</td><td>'+pct(div(a.clk,a.imp))+'</td><td>'+nf(a.lpv)+'</td><td>'+nf(a.pur)+'</td><td>'+nf(v.ped)+'</td><td>'+money(v.rec)+'</td><td>'+roasB(roas)+'</td><td>'+money(div(a.spend,v.ped))+'</td></tr>'}
const TH='<thead><tr><th>__</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>Visualiz.</th><th>Compras Meta</th><th>Vendas</th><th>Receita</th><th>ROAS</th><th>CPA</th></tr></thead>';
function tabela(rot,linhas,tot){return '<div class="tw"><table>'+TH.replace('__',rot)+'<tbody>'+linhas.join('')+(tot||'')+'</tbody></table></div>'}
function totRow(a,v){return rowM('Total',a,v).replace('<tr>','<tr class="tot">')}
function tabCamp(k){
  const cs=DATA.camps.filter(c=>c.seg===k);let L=[];
  cs.forEach(c=>{const a=agg(i=>i===c.id),v=vend(s=>s.camp===c.id);if(a.spend>0||v.ped>0)L.push(rowM(c.name,a,v))});
  const a=agg(segCamp(k)),v=vend(s=>s.seg===k);return tabela('Campanha',L,totRow(a,v));
}
function tabSub(k,lista,tipo){ // tipo adset|ad (acumulado do período completo)
  const m={};
  lista.filter(x=>CAMP[x.camp].seg===k).forEach(x=>{const key=tipo==='ad'?x.camp+'|'+x.name:x.id;
    const e=m[key]||(m[key]={nome:(tipo==='ad'?x.name+' · ':x.name+' · ')+CAMP[x.camp].name.replace('[JGT][VENDAS]',''),camp:x.camp,ids:[],name:x.name,spend:0,imp:0,clk:0,lpv:0,pur:0});
    e.ids.push(x.id);['spend','imp','clk','lpv','pur'].forEach(f=>e[f]+=x[f])});
  const L=Object.values(m).sort((a,b)=>b.spend-a.spend).map(e=>{
    const v=vend(s=>s.d<=SNAP&&(tipo==='ad'?(s.camp===e.camp&&s.ad===e.name):e.ids.includes(s.adset)));
    return rowM(e.nome,e,v)});
  return tabela(tipo==='ad'?'Criativo · Campanha':'Público (conjunto) · Campanha',L);
}
function tabVendas(f){
  const L=DATA.sales.filter(s=>inR(s.d)&&f(s)).sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)).map(s=>'<tr><td>'+dBR(s.d)+' '+s.t+'</td><td>'+s.pn+(s.root?'':' <span class="b n">bump</span>')+'</td><td>'+(s.m==='USD'?'US$ '+nf(s.v,2)+' → ':'')+money(s.brl)+'</td><td style="text-align:left">'+(s.camp?CAMP[s.camp].name.replace('[JGT][VENDAS]',''):(s.man?'<span class="b g">tráfego (manual)</span>':'<span class="b n">sem campanha</span>'))+'</td><td style="text-align:left">'+(s.ad||'—')+'</td><td>'+s.pais+'</td></tr>');
  return '<div class="tw"><table><thead><tr><th>Data</th><th>Produto</th><th>Valor</th><th style="text-align:left">Campanha</th><th style="text-align:left">Anúncio</th><th>País</th></tr></thead><tbody>'+(L.join('')||'<tr><td colspan="6" style="text-align:center;color:#888">Sem vendas no período</td></tr>')+'</tbody></table></div>';
}
function paneGeral(){
  const R={};SK.forEach(k=>R[k]=resumo(k));
  const tot={};['spend','imp','clk','lpv','pur','ped','rec'].forEach(f=>tot[f]=SK.reduce((a,k)=>a+R[k][f],0));
  tot.roas=div(tot.rec,tot.spend);tot.cpa=div(tot.spend,tot.ped);tot.ticket=div(tot.rec,tot.ped);
  const semC=vend(s=>s.seg==='N');
  let h=kpiCards(tot);
  h+='<div class="grid k3">'+SK.map(k=>{const o=R[k];return '<div class="card seg" style="--sc:'+SEG[k].cor+'"><div class="nm">'+SEG[k].ic+' '+SEG[k].n+' <span style="color:#888;font-weight:400;font-size:12px">'+SEG[k].sub+'</span></div>'+
   [['Investimento',money(o.spend)],['Receita',money(o.rec)],['Vendas',nf(o.ped)+(k==='C'?' ('+o.fis+' físico · '+o.dig+' digital)':'')],['ROAS',o.roas==null?'—':nf(o.roas,2)+'x'],['CPA',money(o.cpa)],['Compras no pixel Meta',nf(o.pur)]].map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'</div>'}).join('')+'</div>';
  h+='<div class="two"><div class="card"><h3>Investimento por dia × receita atribuída</h3><div class="chartbox"><canvas id="chG"></canvas></div></div><div class="card"><h3>Funil consolidado</h3>'+funnel(Object.assign({},tot),'#ff6b2b')+'</div></div>';
  h+='<h2>Comparativo entre as campanhas</h2><div class="tw"><table>'+TH.replace('__','Grupo')+'<tbody>'+SK.map(k=>rowM(SEG[k].ic+' '+SEG[k].n,R[k],R[k])).join('')+rowM('Total',tot,tot).replace('<tr>','<tr class="tot">')+'</tbody></table></div>';
  h+='<h2>Vendas sem campanha de anúncio identificada</h2><div class="card"><div class="row" style="display:flex;justify-content:space-between"><span>'+nf(semC.ped)+' pedido(s) · '+money(semC.rec)+' (orgânico, Instagram bio, WhatsApp, site, link direto — não entram no ROAS dos grupos acima)</span></div></div>'+tabVendas(s=>s.seg==='N');
  return h;
}
function paneSeg(k){
  const o=resumo(k);let h=kpiCards(o);
  if(k==='C')h+='<div class="grid k6"><div class="card"><h3>Combo físico</h3><div class="kv">'+nf(o.fis)+'</div><div class="ks">pedidos do produto físico</div></div><div class="card"><h3>Digital via combo</h3><div class="kv">'+nf(o.dig)+'</div><div class="ks">pedidos do livro digital</div></div><div class="card"><h3>Order bumps</h3><div class="kv">'+nf(o.bump)+'</div><div class="ks">'+money(o.recBump)+'</div></div></div>';
  else h+='<div class="grid k6"><div class="card"><h3>Order bumps</h3><div class="kv">'+nf(o.bump)+'</div><div class="ks">'+money(o.recBump)+'</div></div></div>';
  h+='<div class="two"><div class="card"><h3>Investimento por dia × receita</h3><div class="chartbox"><canvas id="ch_'+k+'"></canvas></div></div><div class="card"><h3>Funil</h3>'+funnel(o,SEG[k].cor)+'</div></div>';
  if(k==='X')h+='<div class="note">O Meta registrou 1 compra em 19/10 (Reino Unido – Duplicado). Na Hotmart há uma venda em US$ 7,00 (Portugal) no mesmo dia, mas ela chegou sem parâmetro de campanha (origem “instagram|story|livro|bio”), então fica em “sem campanha”.</div>';
  h+='<h2>Campanhas</h2>'+tabCamp(k);
  h+='<h2>Públicos (conjuntos) — acumulado 06/10 a 19/10 (leitura de 19/10)</h2>'+tabSub(k,DATA.adsets,'adset');
  h+='<h2>Criativos — acumulado 06/10 a 19/10 (leitura de 19/10)</h2>'+tabSub(k,DATA.ads,'ad');
  h+='<h2>Vendas</h2>'+tabVendas(s=>s.seg===k);
  return h;
}
function paneDiaria(){
  const ds=dates().reverse();
  const L=ds.map(d=>{let c='<td>'+dBR(d)+'</td>';let tg=0,tr=0,tv=0;
    SK.forEach(k=>{let g=0;DATA.daily.forEach(r=>{if(r[0]===d&&CAMP[r[1]].seg===k)g+=r[2]});const ss=DATA.sales.filter(s=>s.d===d&&s.seg===k);const rc=ss.reduce((a,s)=>a+s.brl,0),pd=ss.filter(s=>s.root).length;tg+=g;tr+=rc;tv+=pd;c+='<td>'+money(g)+'</td><td>'+nf(pd)+'</td>'});
    const sn=DATA.sales.filter(s=>s.d===d&&s.seg==='N'&&s.root).length;
    c+='<td>'+money(tg)+'</td><td>'+money(tr)+'</td><td>'+roasB(div(tr,tg))+'</td><td>'+nf(sn)+'</td>';return '<tr>'+c+'</tr>'});
  let hd='<th>Dia</th>'+SK.map(k=>'<th>'+SEG[k].n+' invest.</th><th>'+SEG[k].n+' vendas</th>').join('')+'<th>Invest. total</th><th>Receita atrib.</th><th>ROAS</th><th>Vendas s/ campanha</th>';
  return '<div class="tw"><table><thead><tr>'+hd+'</tr></thead><tbody>'+L.join('')+'</tbody></table></div><div class="note">Dia de hoje parcial: Meta até a leitura e Hotmart até '+DATA.hotmartAte.slice(8,10)+'/'+DATA.hotmartAte.slice(5,7)+' '+DATA.hotmartAte.slice(11,16)+'.</div>';
}
const TABS=[['geral','🌐 Visão Geral'],['C','📦 Combo'],['X','🌍 Exterior'],['D','📱 Livro Digital'],['dia','📅 Análise Diária']];
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>'<button class="tab '+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  const m=document.getElementById('main');
  m.innerHTML='<div class="pane on">'+(tab==='geral'?paneGeral():tab==='dia'?paneDiaria():paneSeg(tab))+'</div>';
  if(tab==='geral')chartDaily('chG',SK);else if(tab!=='dia')chartDaily('ch_'+tab,[tab]);
}
function go(t){tab=t;render()}
function aplicar(){const f=document.getElementById('dFrom').value,t=document.getElementById('dTo').value;if(f&&t&&f<=t){range={from:f,to:t};render()}}
document.getElementById('dFrom').value=range.from;document.getElementById('dTo').value=range.to;
document.getElementById('fx').textContent='R$ '+nf(DATA.fx,2);
document.getElementById('upd').textContent='Período 06/10 a 20/10 · Hotmart atualizado até '+DATA.hotmartAte.slice(8,10)+'/'+DATA.hotmartAte.slice(5,7)+' '+DATA.hotmartAte.slice(11,16);
render();
</script>
</body>
</html>
