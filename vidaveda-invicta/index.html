<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║           CONFIGURAÇÃO DO CLIENTE — EDITE APENAS AQUI           ║
// ╚══════════════════════════════════════════════════════════════════╝
const CONFIG = {
  CLIENTE:  'Vida Veda',
  PRODUTO:  'Invicta',
  ANO:      '2026',

  SHEET_ID:          '1TB-_hXgk_n1q8PqkFtpbf_ON0Aa4BTIq4-CtYxvFo4c',
  GERENCIADOR_SHEET: 'GERENCIADOR',
  WEBHOOK_SHEET:     'Webhook',
  LEADS_SHEET:       'Lead Gratuitos',     // inscrições gratuitas do lançamento (Tally)
  VENDAS_SHEET:      'Vendas até agora',   // export do Guru — vendas ANTES do corte
  DATA_MINIMA:       '2026-09-27',         // início da campanha [VENDAS][INVICTA][INSCRITOS]

  // ── REGRA DE FONTE DAS VENDAS ─────────────────────────────────────
  // venda com data/hora  <  CORTE  → aba "Vendas até agora"
  // venda com data/hora  >= CORTE  → aba "Webhook"

  // Produto principal: nome do produto contém (case-insensitive) → todas as ofertas Invicta

  PRODUTO_PRECO_MINIMO: 0,
  USA_TX_ROOT: false,          // Guru não agrupa order bump → cada linha = 1 venda

  // Venda da campanha (tráfego) = utm com este público. As demais entram no total (muitas vêm da captação do tráfego).
  PUBLICO_CAMPANHA: '00 - Inscritos e Compradores',

  STATUS_APROVADO: ['APROVADA','APPROVED','COMPLETE','CONFIRMED','PAGO'],

  // Colunas por NOME de cabeçalho (o export do Guru tem 83 colunas — nome é mais seguro que índice)
  VENDAS_COLS: {           // aba "Vendas até agora"
    id:'id transação', status:'status', produto:'nome produto', oferta:'nome oferta',
    nome:'nome contato', email:'email contato', valor:'valor venda',
    data:['data aprovacao','data pedido'],
    utmSource:['utm_source','rppc utm term'],      // no Guru o source de tracking mora em "rppc utm term"
    utmMedium:['rppc utm medium','utm_medium'],
    utmCampaign:['rppc utm campaign','utm_campaign'],
    utmContent:['rppc utm content','utm_content'],
  },
  WEBHOOK_COLS: {          // aba "Webhook" (Apps Script)
    id:'transacao_id', status:'status', produto:'produto', oferta:'oferta',
    nome:'nome', email:'email', valor:'valor',
    data:['data_venda','recebido_em'],
    utmSource:['utm_source'], utmMedium:['utm_medium'],
    utmCampaign:['utm_campaign'], utmContent:['utm_content'],
  },
  // Assinaturas: coluna que só aquela aba tem (gviz devolve OUTRA aba com status ok se o nome não existir)
  ASSINATURA: { vendas:'id transação', webhook:'transacao_id', ger:'Ad Name', leads:'Submission ID' },

  // ── Aba "Origem das Vendas" ──
  LEADS_COLS: { data:'Submitted at', email:'Qual o seu melhor e-mail?', utmSource:'utm_source', utmMedium:'utm_medium', utmCampaign:'utm_campaign', utmTerm:'utm_term', fbclid:'fbclid' },
  INGRESSO_NOME: 'semana do ayurveda',   // produto do ingresso (R$ 18) — mesma regra Guru/Webhook
  INGRESSO_DATA_MINIMA: '2026-08-01',

  G: { date:'Date', campaign:'Campaign Name', adset:'Adset Name', ad:'Ad Name', inv:'Spend (Cost, Amount Spent)',
       imp:'Impressions', reach:'Reach (Estimated)', cliques:'Action Link Clicks', pv:'Action Landing Page View',
       ck:'Action Omni Initiated Checkout', sAdset:'Adset Status', sCamp:'Campaign Status', sAd:'Ad Status',
       link:'Instagram Permalink URL' },

  IGNORAR_EMAIL: /@jamelligt\.com\.br$/i,
  IGNORAR_NOME:  /^teste|\(apagar\)/i,
  REFRESH_MS: 600000,
};

const SHEET_ID = CONFIG.SHEET_ID;
document.addEventListener('DOMContentLoaded', ()=>{
  document.title = CONFIG.PRODUTO + ' · ' + CONFIG.CLIENTE + ' — Jamelli GT';
  document.getElementById('brand-title').textContent = '📦 ' + CONFIG.PRODUTO + ' · ' + CONFIG.CLIENTE;
  document.getElementById('brand-subtitle').textContent = 'Dashboard de Performance — Jamelli GT · ' + CONFIG.ANO;

// ───────────────────────── Utilidades ─────────────────────────
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const num = v => { // aceita "1.296,00", "9,9", "14.21", "54"
  if (v==null) return 0; let s=String(v).trim().replace(/[R$\s]/g,''); if(!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isNaN(n)?0:n;
};
const fR  = n => (!n||!isFinite(n)) ? '—' : 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fN  = n => (!n||!isFinite(n)) ? '—' : Math.round(n).toLocaleString('pt-BR');
const fP  = n => (!n||!isFinite(n)) ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const fX  = n => (!n||!isFinite(n)) ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x';
const div = (a,b) => b ? a/b : 0;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fD  = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
const fDY = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : '';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
const isMetaAds = s => String(s||'').toLowerCase().replace(/[\s_-]/g,'') === 'metaads';
const isPaused = s => String(s||'').toUpperCase().includes('PAUSED');
const CORES = ['rgba(255,107,43,0.85)','rgba(255,183,55,0.85)','rgba(255,154,60,0.85)','rgba(220,80,30,0.85)'];

// ── datas ──
function parseDT(raw){
  const s = String(raw||'').trim(); if(!s) return null;
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return mk(m[3],m[2],m[1],m[4]||0,m[5]||0,m[6]||0);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?(\.\d+)?\s*(Z|[+-]\d{2}:?\d{2})?)?/);
  if (m){
    if (m[8]){ // tem fuso → converte para Brasília (UTC-3)
      let off = 0; if (m[8]!=='Z'){ const t=m[8].replace(':',''); off=(t[0]==='-'?-1:1)*(parseInt(t.slice(1,3))*60+parseInt(t.slice(3,5))); }
      const ms = Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)) - off*60000 - 3*3600000;
      const d = new Date(ms); return mk(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds());
    }
    return mk(m[1],m[2],m[3],m[4]||0,m[5]||0,m[6]||0);
  }
  return null;
}
function mk(y,mo,d,h,mi,s){ y=+y;mo=+mo;d=+d;h=+h;mi=+mi;s=+s;
  const dia=y+'-'+pad(mo)+'-'+pad(d), hora=pad(h)+':'+pad(mi);
  return {dia, hora, k: dia+' '+hora+':'+pad(s)};
}
const weekKey = d => { const t=new Date(d+'T00:00:00Z'); const wd=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-wd); return t.toISOString().slice(0,10); };
const addDays = (d,n) => { const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };

// ── CSV ──
function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function toObjs(rows){
  if(!rows.length) return {cols:[],objs:[]};
  const cols = rows[0].map(c=>c.trim());
  const objs = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r[i]==null?'':r[i]); return o; });
  return {cols,objs};
}

// ── Fetch (CSV; se o navegador bloquear, cai para JSONP) ──
async function fetchCSV(sheet){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(sheet)}`;
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 25000);
  try{
    const r = await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error(`Planilha "${sheet}": HTTP ${r.status}. Verifique se está pública.`);
    const t = await r.text();
    if(t.includes('Signin')||t.includes('accounts.google')) throw new Error(`Planilha "${sheet}" requer login. Defina como pública.`);
    return toObjs(parseCSV(t));
  }catch(e){ clearTimeout(to); if(e.name==='AbortError') throw new Error(`Timeout ao carregar "${sheet}".`); throw e; }
}
function fetchJSONP(sheet){
  return new Promise((res,rej)=>{
    const cb='__gv'+Math.random().toString(36).slice(2);
    const s=document.createElement('script'); let done=false;
    const t=setTimeout(()=>{ if(!done){done=true;cleanup();rej(new Error(`Timeout ao carregar "${sheet}".`));} },25000);
    function cleanup(){ delete window[cb]; s.remove(); clearTimeout(t); }
    window[cb]=resp=>{ if(done) return; done=true; cleanup();
      if(!resp||resp.status!=='ok'||!resp.table){ rej(new Error(`Planilha "${sheet}" não respondeu (privada?).`)); return; }
      let cols=resp.table.cols.map(c=>(c.label||'').trim());
      let rows=resp.table.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null&&c.f!==''?c.f:(c.v==null?'':String(c.v))):''));
      if(cols.every(c=>!c) && rows.length){ cols=rows[0].map(String); rows=rows.slice(1); }
      const objs=rows.filter(r=>r.some(c=>c!=='')).map(r=>{const o={}; cols.forEach((c,i)=>o[c]=r[i]==null?'':r[i]); return o;});
      res({cols,objs});
    };
    s.onerror=()=>{ if(!done){done=true;cleanup();rej(new Error(`Não foi possível ler "${sheet}".`));} };
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(sheet)}`;
    document.head.appendChild(s);
  });
}
async function fetchTab(sheet, assinatura, obrigatoria){
  let r;
  try{ r = await fetchCSV(sheet); }
  catch(e1){ try{ r = await fetchJSONP(sheet); }catch(e2){ if(obrigatoria) throw e1; return {ok:false,objs:[],motivo:e1.message}; } }
  // proteção: aba inexistente devolve a 1ª aba da planilha com status ok
  if(!r.cols.includes(assinatura)){
    if(obrigatoria) throw new Error(`Aba "${sheet}" não encontrada ou sem a coluna "${assinatura}".`);
    return {ok:false,objs:[],motivo:`aba "${sheet}" ausente`};
  }
  return {ok:true,objs:r.objs};
}

let GROWS=[], SALES=[], INGRESSOS=[], LEADS={}, LEADSTAT={}, TICKETS={}, DIAS=[], META={}, CHARTS={}, TIMER=null, CARREGANDO=false, LASTOK=0;
let criStatus='all', criSort='inv', pubStatus='all', pubSort='inv';
let RANGE={from:'',to:''};

const pick = (o, cols) => { for(const c of cols){ if(o[c]!=null && String(o[c]).trim()!=='') return String(o[c]).trim(); } return ''; };

function buildSales(vRows, wRows, prodNome, dataMin, doStat){
  prodNome = prodNome||CONFIG.PRODUTO_NOME; dataMin = dataMin||CONFIG.DATA_MINIMA; if(doStat===undefined) doStat=true;
  const out=[], ids=new Set(); const cV=CONFIG.VENDAS_COLS, cW=CONFIG.WEBHOOK_COLS;
  const st=new Set(CONFIG.STATUS_APROVADO.map(norm)); const prod=prodNome.toLowerCase();
  const stat={guruLinhas:0,guru:0,whLinhas:0,wh:0,whUltimo:'',ignoradas:0};
  const push=(fonte,r,c,dt)=>{
    const nome=r[c.nome]||'', email=(r[c.email]||'').trim();
    if(CONFIG.IGNORAR_EMAIL.test(email)||CONFIG.IGNORAR_NOME.test(nome.trim())){stat.ignoradas++;return;}
    let val=num(r[c.valor]); if(CONFIG.VALORES_EM_CENTAVOS) val/=100;
    if(val<CONFIG.PRODUTO_PRECO_MINIMO) return;
    let src=pick(r,c.utmSource); const alt=c.utmSource.map(k=>String(r[k]||'').trim()).find(isMetaAds); if(alt) src=alt;
    out.push({ id:(r[c.id]||'').trim(), fonte, data:dt.dia, hora:dt.hora, k:dt.k, nome, email,
      oferta:r[c.oferta]||'', fatTotal:val, fatPrincipal:val, fatOB:0,
      utmSource:src, utmMedium:pick(r,c.utmMedium), utmCampaign:pick(r,c.utmCampaign), utmContent:pick(r,c.utmContent) });
  };
  // 1) antes do corte → "Vendas até agora"
  for(const r of vRows){
    if(!st.has(norm(r[cV.status]))) continue;
    if(!String(r[cV.produto]||'').toLowerCase().includes(prod)) continue;
    const dt=parseDT(pick(r,cV.data)); if(!dt) continue;
    stat.guruLinhas++;
    if(dt.k>=CONFIG.CORTE) continue;          // depois do corte só vale o webhook
    if(dt.dia<dataMin) continue;
    const id=(r[cV.id]||'').trim(); if(id&&ids.has(id)) continue; if(id) ids.add(id);
    stat.guru++; push('guru',r,cV,dt);
  }
  // 2) a partir do corte → Webhook
  for(const r of wRows){
    if(!st.has(norm(r[cW.status]))) continue;
    if(!String(r[cW.produto]||'').toLowerCase().includes(prod)) continue;
    const dt=parseDT(pick(r,cW.data)); if(!dt) continue;
    stat.whLinhas++;
    if(dt.k<CONFIG.CORTE) continue;            // antes do corte já veio do Guru
    const id=(r[cW.id]||'').trim(); if(id&&ids.has(id)) continue; if(id) ids.add(id);
    stat.wh++; if(dt.k>stat.whUltimo) stat.whUltimo=dt.k; push('webhook',r,cW,dt);
  }
  if(doStat) META.stat=stat;
  return out.sort((a,b)=>b.k.localeCompare(a.k));
}

function buildGer(rows){
  const g=CONFIG.G;
  return rows.map(r=>({ data:(parseDT(r[g.date])||{}).dia||'', camp:r[g.campaign]||'', adset:r[g.adset]||'', ad:r[g.ad]||'',
    link:r[g.link]||'', inv:num(r[g.inv]), imp:num(r[g.imp]), reach:num(r[g.reach]), cliques:num(r[g.cliques]),
    pv:num(r[g.pv]), ck:num(r[g.ck]), sCamp:(r[g.sCamp]||'').toUpperCase(), sAdset:(r[g.sAdset]||'').toUpperCase(), sAd:(r[g.sAd]||'').toUpperCase()
  })).filter(x=>x.data && x.data>=CONFIG.DATA_MINIMA);
}

function classify(){
  const ads=new Set(GROWS.map(g=>g.ad.toLowerCase())), sets=new Set(GROWS.map(g=>g.adset.toLowerCase()));
  for(const s of SALES){
    s.cri = ads.has(s.utmContent.toLowerCase()) ? s.utmContent : '';
    const p=[s.utmCampaign,s.utmMedium].find(x=>x&&sets.has(x.toLowerCase())); s.pub=p||'';
    const alvo=CONFIG.PUBLICO_CAMPANHA.toLowerCase();
    s.pago=[s.utmCampaign,s.utmMedium,s.utmSource,s.utmContent].some(x=>String(x||'').trim().toLowerCase()===alvo);
  }
}

function buildDias(){
  const m={};
  for(const g of GROWS){ const d=m[g.data]||(m[g.data]={data:g.data,inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0}); d.inv+=g.inv;d.imp+=g.imp;d.reach+=g.reach;d.cliques+=g.cliques;d.pv+=g.pv;d.ck+=g.ck; }
  DIAS=Object.values(m).sort((a,b)=>a.data.localeCompare(b.data));
}

// ───────────────────────── Carga ─────────────────────────
async function loadData(){
  if(CARREGANDO) return; CARREGANDO=true;
  const first = !GROWS.length && !SALES.length;
  try{
    if(first) $('loading-msg').textContent='Lendo Gerenciador, Vendas e Webhook...';
    const [g,v,w,ld] = await Promise.all([
      fetchTab(CONFIG.GERENCIADOR_SHEET, CONFIG.ASSINATURA.ger, true),
      fetchTab(CONFIG.VENDAS_SHEET, CONFIG.ASSINATURA.vendas, true),
      fetchTab(CONFIG.WEBHOOK_SHEET, CONFIG.ASSINATURA.webhook, false),
      fetchTab(CONFIG.LEADS_SHEET, CONFIG.ASSINATURA.leads, false),
    ]);
    META.leadsOk = ld.ok; META.leadsMotivo = ld.motivo||'';
    META.webhookOk = w.ok; META.webhookMotivo = w.motivo||'';
    GROWS = buildGer(g.objs);
    SALES = buildSales(v.objs, w.objs);
    INGRESSOS = buildSales(v.objs, w.objs, CONFIG.INGRESSO_NOME, CONFIG.INGRESSO_DATA_MINIMA, false);
    buildLeads(ld.objs);
    classify(); buildDias(); classifyOrigem();
    LASTOK = Date.now(); $('errbox').innerHTML='';
    setLive('ok');
    initRange();
    renderAll();
  }catch(e){
    console.error(e);
    if(first){ $('errbox').innerHTML=`<div class="err"><b>Não consegui ler a planilha.</b><br>${esc(e.message)}<br><br>Confira se a planilha está compartilhada como "qualquer pessoa com o link" e clique em Atualizar.</div>`; }
    setLive(Date.now()-LASTOK>20*60000?'bad':'warn', e.message);
    scheduleRetry();
  }finally{
    $('loading-overlay').style.display='none'; CARREGANDO=false;
  }
}
let retryN=0;
function scheduleRetry(){ const w=[15000,30000,60000,120000][Math.min(retryN++,3)]; setTimeout(loadData,w); }
function setLive(st,msg){
  const d=$('live-dot'), t=$('live-txt'); const hh=new Date(); const hm=pad(hh.getHours())+':'+pad(hh.getMinutes());
  d.className='dot'+(st==='ok'?'':st==='warn'?' warn':' bad');
  if(st==='ok'){ t.textContent='atualizado '+hm; retryN=0; }
  else if(st==='warn') t.textContent='tentando reconectar…';
  else t.textContent='sem conexão há '+Math.round((Date.now()-LASTOK)/60000)+'min';
  t.title = msg||'';
}

function totals(from,to){
  const g=GROWS.filter(x=>(!from||x.data>=from)&&(!to||x.data<=to));
  const s=SALES.filter(x=>(!from||x.data>=from)&&(!to||x.data<=to));
  const t={inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0,fatT:0,fatO:0,vT:0,vO:0,obT:0,obO:0,nOBT:0,nOBO:0,ident:0,fatIdent:0};
  g.forEach(x=>{t.inv+=x.inv;t.imp+=x.imp;t.reach+=x.reach;t.cliques+=x.cliques;t.pv+=x.pv;t.ck+=x.ck;});
  s.forEach(x=>{
    if(x.pago){ t.fatT+=x.fatTotal; t.vT++; t.obT+=x.fatOB; if(x.fatOB>0)t.nOBT++; if(x.cri){t.ident++;t.fatIdent+=x.fatTotal;} }
    else { t.fatO+=x.fatTotal; t.vO++; t.obO+=x.fatOB; if(x.fatOB>0)t.nOBO++; }
  });
  t.fat=t.fatT+t.fatO; t.v=t.vT+t.vO; return {t,g,s};
}

// recalcula do zero a cada mudança de data (GROWS + SALES filtrados)
function buildCriPubMaps(from,to){
  const fg=GROWS.filter(x=>(!from||x.data>=from)&&(!to||x.data<=to));
  const fs=SALES.filter(x=>(!from||x.data>=from)&&(!to||x.data<=to));
  const cri={}, pub={};
  const latest={}; // último registro por anúncio/público para status
  for(const x of fg){
    const paused = isPaused(x.sAd)||isPaused(x.sAdset)||isPaused(x.sCamp);
    const ativo = !paused && (x.sAd||x.sAdset||x.sCamp);
    for(const [map,key] of [[cri,x.ad],[pub,x.adset]]){
      if(!key) continue; const m=map[key]||(map[key]={nome:key,inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0,vendas:0,fat:0,link:'',ativo:false,ult:'',camp:x.camp});
      m.inv+=x.inv;m.imp+=x.imp;m.reach+=x.reach;m.cliques+=x.cliques;m.pv+=x.pv;m.ck+=x.ck;
      if(x.link&&map===cri) m.link=x.link;
      if(x.data>m.ult){ m.ult=x.data; m.ativo=!!ativo; } else if(x.data===m.ult){ m.ativo=m.ativo||!!ativo; }
    }
  }
  let semCri={vendas:0,fat:0}, semPub={vendas:0,fat:0};
  for(const s of fs){ if(!s.pago) continue;
    if(s.cri){ const m=cri[Object.keys(cri).find(k=>k.toLowerCase()===s.cri.toLowerCase())]; if(m){m.vendas++;m.fat+=s.fatTotal;} } else {semCri.vendas++;semCri.fat+=s.fatTotal;}
    if(s.pub){ const m=pub[Object.keys(pub).find(k=>k.toLowerCase()===s.pub.toLowerCase())]; if(m){m.vendas++;m.fat+=s.fatTotal;} } else {semPub.vendas++;semPub.fat+=s.fatTotal;}
  }
  const fin=m=>{ m.ctr=div(m.cliques,m.imp)*100; m.cpc=div(m.inv,m.cliques); m.cpm=div(m.inv,m.imp)*1000; m.roas=div(m.fat,m.inv); m.cac=div(m.inv,m.vendas); return m; };
  return {cri:Object.values(cri).map(fin), pub:Object.values(pub).map(fin), semCri, semPub};
}

function agrupa(keyFn,labelFn){
  const m={};
  for(const d of DIAS){ if(!inR(d.data)) continue; const k=keyFn(d.data); const r=m[k]||(m[k]=zero(k)); r.inv+=d.inv;r.imp+=d.imp;r.cliques+=d.cliques;r.pv+=d.pv;r.ck+=d.ck; }
  for(const s of SALES){ if(!inR(s.data)) continue; const k=keyFn(s.data); const r=m[k]||(m[k]=zero(k)); r.fat+=s.fatTotal; r.v++; if(s.pago){r.fatT+=s.fatTotal;r.vT++;} }
  return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k)).map(r=>Object.assign(r,{label:labelFn(r.k)}));
}

const normEmail = e => String(e||'').toLowerCase().replace(/\s+/g,'').trim();
function buildLeads(rows){
  const c=CONFIG.LEADS_COLS; LEADS={}; const st={linhas:0,semEmail:0,meta:0,ultimo:''};
  for(const r of rows){
    const dt=parseDT(r[c.data]); const em=normEmail(r[c.email]); st.linhas++;
    if(!em||!/@/.test(em)){ st.semEmail++; continue; }
    const meta = isMetaAds(r[c.utmSource]) || isMetaAds(r[c.utmTerm]);
    const k = dt?dt.k:'9999';
    const o=LEADS[em]||(LEADS[em]={first:k,meta:false,n:0});
    o.n++; if(k<o.first) o.first=k; if(meta) o.meta=true;
    if(dt&&dt.k>st.ultimo) st.ultimo=dt.k;
  }
  st.unicos=Object.keys(LEADS).length; st.meta=Object.values(LEADS).filter(x=>x.meta).length;
  LEADSTAT=st;
  TICKETS={};
  for(const s of INGRESSOS){ const em=normEmail(s.email); if(!em) continue;
    const o=TICKETS[em]||(TICKETS[em]={first:s.k,meta:false,n:0,fat:0}); o.n++; o.fat+=s.fatTotal; if(s.k<o.first) o.first=s.k; if(isMetaAds(s.utmSource)) o.meta=true; }
}
// vínculo só vale se o lead / ingresso veio ANTES da compra do Invicta
function classifyOrigem(){
  for(const s of SALES){
    const em=normEmail(s.email); const L=LEADS[em], T=TICKETS[em];
    s.lead = !!(L && L.first.slice(0,16) <= s.k.slice(0,16));
    s.tick = !!(T && T.first.slice(0,16) <= s.k.slice(0,16));
    s.leadMeta = s.lead && L.meta; s.tickMeta = s.tick && T.meta;
    s.infl = s.pago || s.leadMeta || s.tickMeta;
    s.seg = s.lead&&s.tick ? 'ambos' : s.lead ? 'lead' : s.tick ? 'ingresso' : 'nenhum';
  }
}

   `</tbody><tfoot><tr><td>Total</td><td>${fN(n)}</td><td>${n?'100,00%':'—'}</td><td>${fR(fat)}</td><td>${fR(div(fat,n))}</td></tr></tfoot></table></div>`;

  const r1=G(x=>x.pago), r2=G(x=>x.leadMeta), r3=G(x=>x.tickMeta), r4=G(x=>!x.pago&&isMetaAds(x.utmSource));
  h+=`<div class="sec-title">Influência do tráfego — de onde vem</div><div class="tbl-wrap"><table><thead><tr><th>Sinal de tráfego (uma venda pode ter mais de um)</th><th>Vendas</th><th>% vendas</th><th>Faturamento</th></tr></thead><tbody>
   <tr><td>Venda direta da campanha (público “${esc(CONFIG.PUBLICO_CAMPANHA)}”)</td><td>${fN(r1.n)}</td><td>${pc(r1.n)}</td><td>${fR(r1.f)}</td></tr>
   <tr><td>Lead que se inscreveu por anúncio (utm meta_ads)</td><td>${fN(r2.n)}</td><td>${pc(r2.n)}</td><td>${fR(r2.f)}</td></tr>
   <tr><td>Ingresso comprado por anúncio (utm meta_ads)</td><td>${fN(r3.n)}</td><td>${pc(r3.n)}</td><td>${fR(r3.f)}</td></tr>
   </tbody><tfoot><tr><td>Com influência do tráfego (união, sem contar duas vezes)</td><td>${fN(infl.n)}</td><td>${pc(infl.n)}</td><td>${fR(infl.f)}</td></tr></tfoot></table></div>
   <div class="b-meta" style="font-size:11px;color:rgba(255,255,255,.4);margin-top:6px">Informativo, fora da união: ${fN(r4.n)} venda(s) Invicta trazem utm meta_ads em outra campanha (${fR(r4.f)}).</div>`;

  // conversão da base
  const leadsQueCompraram=new Set(s.filter(x=>x.lead).map(x=>normEmail(x.email))).size, tickQueCompraram=new Set(s.filter(x=>x.tick).map(x=>normEmail(x.email))).size;
  const leadsTick=Object.keys(LEADS).filter(e=>TICKETS[e]).length;
  h+=`<div class="sec-title">Conversão da base</div><div class="tbl-wrap"><table><thead><tr><th>Base</th><th>Pessoas</th><th>Compraram ${esc(CONFIG.PRODUTO)}</th><th>Conversão</th></tr></thead><tbody>
   <tr><td>Leads gratuitos do lançamento (e-mails únicos)</td><td>${fN(LEADSTAT.unicos)}</td><td>${fN(leadsQueCompraram)}</td><td>${fP(div(leadsQueCompraram,LEADSTAT.unicos)*100)}</td></tr>
   <tr><td>Leads que também compraram o ingresso</td><td>${fN(leadsTick)}</td><td>—</td><td>${fP(div(leadsTick,LEADSTAT.unicos)*100)} dos leads</td></tr>
   <tr><td>Compradores do ingresso Semana do Ayurveda</td><td>${fN(Object.keys(TICKETS).length)}</td><td>${fN(tickQueCompraram)}</td><td>${fP(div(tickQueCompraram,Object.keys(TICKETS).length)*100)}</td></tr>
   </tbody></table></div>`;

  // por dia
  h+='<div class="chart-grid-2x2"><div class="chart-card"><h4>Vendas por dia — por grupo</h4><canvas id="o-dia"></canvas></div><div class="chart-card"><h4>Vendas por dia — influência do tráfego</h4><canvas id="o-infl"></canvas></div></div>';

  // auditoria
  const lim=150;
  h+=`<div class="sec-title">Vendas (${n}) — vínculos por comprador</div><div class="tbl-wrap"><table><thead><tr><th>Comprador</th><th>Data</th><th>Oferta</th><th>Valor</th><th>Lead gratuito</th><th>Ingresso</th><th>Tráfego</th></tr></thead><tbody>`+
   s.slice(0,lim).map(x=>`<tr><td>${esc(x.nome||'—')}</td><td>${fD(x.data)} ${x.hora}</td><td>${esc(x.oferta||'')}</td><td>${fR(x.fatTotal)}</td><td>${x.lead?(x.leadMeta?'✅ via anúncio':'✅'):'—'}</td><td>${x.tick?(x.tickMeta?'✅ via anúncio':'✅'):'—'}</td><td>${x.infl?'✅':'—'}</td></tr>`).join('')+
   `</tbody></table></div>`+(n>lim?`<div class="b-meta" style="font-size:11px;color:rgba(255,255,255,.35);margin-top:6px">Mostrando as ${lim} mais recentes de ${n}.</div>`:'');
  $('tab-origem').innerHTML=h;

  const dias=daysList(), lab=dias.map(fD); const cnt=(d,f)=>s.filter(x=>x.data===d&&f(x)).length;
  mkChart('o-dia',{type:'bar',data:{labels:lab,datasets:[
    {label:'Lead + ingresso',data:dias.map(d=>cnt(d,x=>x.seg==='ambos')),backgroundColor:CORES[0]},
    {label:'Só lead',data:dias.map(d=>cnt(d,x=>x.seg==='lead')),backgroundColor:CORES[1]},
    {label:'Só ingresso',data:dias.map(d=>cnt(d,x=>x.seg==='ingresso')),backgroundColor:CORES[2]},
    {label:'Sem vínculo',data:dias.map(d=>cnt(d,x=>x.seg==='nenhum')),backgroundColor:CORES[3]}]},
    options:chartOpts({scales:{x:Object.assign({stacked:true},axis),y:Object.assign({stacked:true},axis)}})});
  mkChart('o-infl',{type:'bar',data:{labels:lab,datasets:[
    {label:'Com influência do tráfego',data:dias.map(d=>cnt(d,x=>x.infl)),backgroundColor:CORES[0]},
    {label:'Sem',data:dias.map(d=>cnt(d,x=>!x.infl)),backgroundColor:CORES[1]}]},
    options:chartOpts({scales:{x:Object.assign({stacked:true},axis),y:Object.assign({stacked:true},axis)}})});
}

// ───────────────────────── Render geral ─────────────────────────
function renderAll(){
  $('range-info').textContent = RANGE.from ? fD(RANGE.from)+' → '+fD(RANGE.to) : '';
  const t=activeTab();
  ({trafego:renderTrafego,visao:renderVisao,criativos:renderCriativos,publicos:renderPublicos,semanal:renderSemanal,mensal:renderMensal,origem:renderOrigem})[t]();
}

loadData();
setInterval(loadData, CONFIG.REFRESH_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()-LASTOK>120000) loadData(); });
</script>
</body>
</html>
