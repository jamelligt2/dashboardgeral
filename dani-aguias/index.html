 st.forEach((s,i)=>{

   <div class="row3"><div><span>Investimento</span><b>${R(0)}</b></div><div><span>CPL</span><b>—</b></div><div><span>Leads</span><b>0</b></div></div>
   <div class="sub" style="margin:0">Nenhum conjunto de público quente nestas campanhas: todos os conjuntos são abertos (${prod==='lisboa'?'Lisboa':'Londres'} / Advantage+).</div>
  </div>
  <div class="tcard f"><h3 style="color:#42a5f5">PÚBLICO FRIO</h3><div class="sub">Públicos abertos / Advantage+</div>
   <div class="row3"><div><span>Investimento</span><b>${R(t.spend)}</b></div><div><span>CPL</span><b>${fR(m.cpl)}</b></div><div><span>Leads</span><b>${t.lead}</b></div></div>
   <table><tr><th>Conjunto</th><th>Invest.</th><th>CPL</th><th>Leads</th></tr>${rowsAdset}</table>
  </div>
  <div class="cmp"><h3>COMPARATIVO</h3>
   <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:#ff1744">Quente 0%</span><span style="color:#42a5f5">Frio 100%</span></div>
   <div class="bar"><i style="width:100%"></i></div>
   <p>% de leads por temperatura: <b>0%</b> quente · <b>100%</b> frio.</p>
   <p>Diferença de CPL quente × frio: <b>n/d</b> (sem investimento em público quente).</p>
  </div>
 </div>
 <h2 class="sec">Funil de Conversão</h2>
 <div class="funnel">
  <div class="funnel-svg-wrap">${funnelSVG(t)}</div>
  <div class="funnel-metrics-row">
   <div class="mcard" style="--c:#ff6b35"><div class="l">CPC — Custo por clique no link</div><div class="v" style="color:#ff6b35">${fR(m.cpc)}</div><div class="s">${nf(t.link)} cliques</div></div>
   <div class="mcard" style="--c:#ffd600"><div class="l">TX Entrada — cliques que chegam à página</div><div class="v" style="color:#ffd600">${fP(m.tx_ent)}</div><div class="s">${nf(t.lpv)} page views${m.tx_ent<70?' · abaixo de 70%':''}</div></div>
   <div class="mcard" style="--c:#00c853"><div class="l">TX Cadastro — page views que viram lead</div><div class="v" style="color:#00c853">${fP(m.tx_cad)}</div><div class="s">${nf(t.lead)} leads</div></div>
  </div>
 </div>
 <h2 class="sec">Evolução Diária</h2>
 <div class="tw"><table class="t"><thead><tr><th>Dia</th><th>Investimento</th><th>Impressões</th><th>Cliques</th><th>PV</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th><th>TX Cadastro</th></tr></thead><tbody>`;
 const dates=Object.keys(dias).sort();
 dates.forEach(d=>{const s=sum(daily.filter(x=>x.date===d));const mm=mets(s);
  h+=`<tr><td>${dl(d)}</td><td>${R(s.spend)}</td><td>${nf(s.impr)}</td><td>${nf(s.link)}</td><td>${nf(s.lpv)}</td><td>${s.lead}</td><td>${fP(mm.ctr)}</td><td>${fR(mm.cpc)}</td><td>${fR(mm.cpl)}</td><td>${fP(s.lpv>0?mm.tx_cad:null)}</td></tr>`});
 h+=`<tr class="tot"><td>TOTAL</td><td>${R(t.spend)}</td><td>${nf(t.impr)}</td><td>${nf(t.link)}</td><td>${nf(t.lpv)}</td><td>${t.lead}</td><td>${P(m.ctr)}</td><td>${R(m.cpc)}</td><td>${fR(m.cpl)}</td><td>${P(m.tx_cad)}</td></tr></tbody></table></div>
 <div class="chartbox"><canvas id="cd"></canvas></div>
 <p class="note">Cliques = cliques no link. Leads = evento Lead do pixel. Dados Meta Ads, conta 1149990590072002.</p>`;
 $('#p-geral').innerHTML=h;
 const ld=dates.map(d=>sum(daily.filter(x=>x.date===d)));
 charts.push(new Chart($('#cd'),{data:{labels:dates.map(dl),datasets:[
  {type:'bar',label:'Leads',data:ld.map(x=>x.lead),backgroundColor:'#00c853',yAxisID:'y',order:2},
  {type:'line',label:'CPL (R$)',data:ld.map(x=>x.lead>0?+(x.spend/x.lead).toFixed(2):null),borderColor:'#ff6b35',backgroundColor:'#ff6b35',yAxisID:'y1',order:1,spanGaps:true,tension:.25}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#ccc'}}},scales:{x:{ticks:{color:'#777'},grid:{color:'#262640'}},y:{ticks:{color:'#00c853'},grid:{color:'#262640'},title:{display:true,text:'Leads',color:'#777'}},y1:{position:'right',ticks:{color:'#ff6b35'},grid:{display:false},title:{display:true,text:'CPL',color:'#777'}}}}}))
}

// ===== ABA 2 =====
function renderCriativos(){
 const {ads}=data();const t=sum(ads);const avg=mets(t).cpl;
 const rows=ads.map(a=>({a,m:mets(a),st:null}));
 rows.sort((x,y)=>{if(x.a.lead===0&&y.a.lead===0)return y.a.spend-x.a.spend;if(x.a.lead===0)return 1;if(y.a.lead===0)return -1;return x.m.cpl-y.m.cpl});
 let h=`<div class="tw"><table class="t"><thead><tr><th>#</th><th class="nm">Criativo</th><th>Invest.</th><th>Imp.</th><th>Cliques</th><th>PV</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th><th>TX Entrada</th><th>TX Cadastro</th><th>Hook Rate</th><th>Link</th><th>Status</th></tr></thead><tbody>`;
 rows.forEach((r,i)=>{const a=r.a,m=r.m;const s=status(m.cpl,a.lead,a.spend,avg);
  h+=`<tr><td>${i+1}</td><td class="nm"><b>${a.name}</b><br><span class="mut">${campName(ADSETS[a.adset].camp)} · ${ADSETS[a.adset].name}</span></td><td>${R(a.spend)}</td><td>${nf(a.impr)}</td><td>${nf(a.link)}</td><td>${nf(a.lpv)}</td><td>${a.lead}</td><td>${fP(m.ctr)}</td><td>${fR(m.cpc)}</td><td>${fR(m.cpl)}</td><td class="${m.tx_ent<70?'warn':''}">${fP(m.tx_ent)}</td><td>${a.lpv>0?P(m.tx_cad):'<span class="mut">—</span>'}</td><td class="mut">—</td><td class="mut">—</td><td>${badge(s)}</td></tr>`});
 const m=mets(t);
 h+=`<tr class="tot"><td></td><td class="nm">TOTAL</td><td>${R(t.spend)}</td><td>${nf(t.impr)}</td><td>${nf(t.link)}</td><td>${nf(t.lpv)}</td><td>${t.lead}</td><td>${P(m.ctr)}</td><td>${R(m.cpc)}</td><td>${fR(m.cpl)}</td><td>${P(m.tx_ent)}</td><td>${P(m.tx_cad)}</td><td>—</td><td>—</td><td></td></tr></tbody></table></div>
 <p class="note">Status relativo ao CPL médio do produto (${fR(avg).replace(/<[^>]+>/g,'')}): ESCALAR ≤ 80% com 3+ leads · MANTER ≤ 120% · AVALIAR ≤ 160% ou sem leads com menos de R$ 50 · PAUSAR acima disso ou sem leads com R$ 50+. Hook Rate e link do anúncio não vieram da API.</p>`;
 $('#p-criativos').innerHTML=h}

// ===== ABA 3 =====
function renderPublicos(){
 const {ads,adsets}=data();const t=sum(ads);const avg=mets(t).cpl;
 const rows=adsets.map(k=>{const s=sum(ads.filter(a=>a.adset===k));return {k,s,m:mets(s)}});
 rows.sort((x,y)=>{if(x.s.lead===0&&y.s.lead===0)return y.s.spend-x.s.spend;if(x.s.lead===0)return 1;if(y.s.lead===0)return -1;return x.m.cpl-y.m.cpl});
 let h=`<div class="tw"><table class="t"><thead><tr><th>#</th><th class="nm">Conjunto</th><th>Invest.</th><th>Imp.</th><th>Cliques</th><th>PV</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPM</th><th>CPL</th><th>TX Entrada</th><th>TX Cadastro</th><th>Status</th></tr></thead><tbody>`;
 rows.forEach((r,i)=>{const s=r.s,m=r.m;
  h+=`<tr><td>${i+1}</td><td class="nm"><b>${ADSETS[r.k].name}</b><br><span class="mut">${campName(ADSETS[r.k].camp)}</span></td><td>${R(s.spend)}</td><td>${nf(s.impr)}</td><td>${nf(s.link)}</td><td>${nf(s.lpv)}</td><td>${s.lead}</td><td>${fP(m.ctr)}</td><td>${fR(m.cpc)}</td><td>${fR(m.cpm)}</td><td>${fR(m.cpl)}</td><td class="${m.tx_ent<70?'warn':''}">${fP(m.tx_ent)}</td><td>${s.lpv>0?P(m.tx_cad):'<span class="mut">—</span>'}</td><td>${badge(status(m.cpl,s.lead,s.spend,avg))}</td></tr>`});
 h+=`</tbody></table></div>
 <h2 class="sec">Feed vs Stories por conjunto</h2>
 <div class="tw"><table class="t"><thead><tr><th class="nm">Conjunto / Posicionamento</th><th>Invest.</th><th>% Invest.</th><th>Imp.</th><th>Cliques</th><th>PV</th><th>Leads</th><th>CPL</th><th>Status</th></tr></thead><tbody>`;
 const pos=['Feed','Stories','Reels','Outros'];
 const tot={Feed:[0,0,0,0,0],Stories:[0,0,0,0,0],Reels:[0,0,0,0,0],Outros:[0,0,0,0,0]};
 const line=(lb,v,sp,cls)=>{const cpl=dv(v[0],v[4]);return `<tr class="${cls||''}"><td class="nm">${lb}</td><td>${R(v[0])}</td><td>${sp?P(v[0]/sp*100):''}</td><td>${nf(v[1])}</td><td>${nf(v[2])}</td><td>${nf(v[3])}</td><td>${v[4]}</td><td>${fR(cpl)}</td><td>${cls==='tot'?'':badge(status(cpl,v[4],v[0],avg))}</td></tr>`};
 adsets.forEach(k=>{
  const sp=pos.reduce((a,p)=>a+PL[k][p][0],0);
  h+=`<tr class="grp"><td colspan="9">${ADSETS[k].name} — ${campName(ADSETS[k].camp)}</td></tr>`;
  pos.forEach(p=>{h+=line(p,PL[k][p],sp);PL[k][p].forEach((x,i)=>tot[p][i]+=x)})});
 const spT=pos.reduce((a,p)=>a+tot[p][0],0);
 h+=`<tr class="grp"><td colspan="9">TOTAL ${prod==='lisboa'?'LISBOA':'LONDRES'}</td></tr>`;
 pos.forEach(p=>h+=line(p,tot[p],spT,'tot'));
 h+=`</tbody></table></div><p class="note">Feed = Facebook/Instagram Feed, perfil, Threads, Marketplace · Stories = Facebook e Instagram Stories · Reels = Reels e overlay · Outros = Audience Network, Instream, notificações.</p>`;
 $('#p-publicos').innerHTML=h}

// ===== ABA 4 =====
function renderDiaria(){
 const {daily}=data();
 const dates=[...new Set(daily.map(d=>d.date))].sort();
 let h=`<h2 class="sec" style="margin-top:0">Comparativo dia a dia</h2><div class="tw"><table class="t"><thead><tr><th>Dia</th><th>Invest.</th><th>Δ Invest.</th><th>Leads</th><th>Δ Leads</th><th>CPL</th><th>Δ CPL</th><th>CTR</th><th>CPC</th><th>TX Entrada</th><th>TX Cadastro</th></tr></thead><tbody>`;
 let prev=null;
 const dlt=(a,b,inv)=>{if(b==null||a==null||b===0)return '<span class="mut">—</span>';const p=(a-b)/b*100;const good=inv?p<0:p>0;return `<span class="${Math.abs(p)<0.5?'mut':good?'pos':'neg'}">${p>0?'+':''}${nf(p,1)}%</span>`};
 dates.forEach(d=>{const s=sum(daily.filter(x=>x.date===d));const m=mets(s);
  h+=`<tr><td>${dl(d)}</td><td>${R(s.spend)}</td><td>${prev?dlt(s.spend,prev.s.spend,false):'<span class="mut">—</span>'}</td><td>${s.lead}</td><td>${prev?dlt(s.lead,prev.s.lead,false):'<span class="mut">—</span>'}</td><td>${fR(m.cpl)}</td><td>${prev?dlt(m.cpl,prev.m.cpl,true):'<span class="mut">—</span>'}</td><td>${fP(m.ctr)}</td><td>${fR(m.cpc)}</td><td class="${m.tx_ent<70?'warn':''}">${fP(m.tx_ent)}</td><td>${s.lpv>0?P(m.tx_cad):'<span class="mut">—</span>'}</td></tr>`;prev={s,m}});
 h+=`</tbody></table></div>
 <h2 class="sec">Detalhe por dia e criativo</h2>
 <select id="fd"><option value="">Todos os dias</option>${[...dates].reverse().map(d=>`<option value="${d}">${dl(d)}</option>`).join('')}</select>
 <div class="tw"><table class="t"><thead><tr><th>Dia</th><th class="nm">Conjunto / Criativo</th><th>Invest.</th><th>Imp.</th><th>Cliques</th><th>PV</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th><th>TX Cadastro</th></tr></thead><tbody id="dbody"></tbody></table></div>`;
 $('#p-diaria').innerHTML=h;
 const draw=()=>{const f=$('#fd').value;let b='';
  [...daily].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.spend-a.spend).filter(r=>!f||r.date===f).forEach(r=>{const m=mets(r);const a=ADMAP[r.k];
   b+=`<tr><td>${dl(r.date)}</td><td class="nm"><b>${a.name}</b> <span class="mut">· ${ADSETS[a.adset].name} · ${campName(ADSETS[a.adset].camp)}</span></td><td>${R(r.spend)}</td><td>${nf(r.impr)}</td><td>${nf(r.link)}</td><td>${nf(r.lpv)}</td><td>${r.lead}</td><td>${fP(m.ctr)}</td><td>${fR(m.cpc)}</td><td>${fR(m.cpl)}</td><td>${r.lpv>0?P(m.tx_cad):'<span class="mut">—</span>'}</td></tr>`});
  $('#dbody').innerHTML=b};
 $('#fd').onchange=draw;draw()}

// ===== CONTROLE =====
function render(){
 charts.forEach(c=>c.destroy());charts=[];
 const {daily}=data();const ds=[...new Set(daily.map(d=>d.date))].sort();
 const nome=prod==='lisboa'?'LISBOA':'LONDRES';
 $('#h1').textContent='DASHBOARD CAPTACAO — ÁGUIAS '+nome;
 $('#hsub').textContent=(prod==='lisboa'?'[JGT][LEAD][AGUIAS][LISBOA]':'[JGT][LEAD][AGUIAS][LONDRES] · 4 campanhas')+' · '+dl(ds[0])+' a '+dl(ds[ds.length-1])+'/2026';
 document.querySelectorAll('.prodbtn').forEach(b=>b.classList.toggle('active',b.dataset.p===prod));
 renderGeral();renderCriativos();renderPublicos();renderDiaria()}
document.querySelectorAll('.prodbtn').forEach(b=>b.onclick=()=>{prod=b.dataset.p;render()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
 document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='p-'+t.dataset.t))});
render();
</script>
</body>
</html>
