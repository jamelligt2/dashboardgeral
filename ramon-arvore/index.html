<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e8e6f0;font-family:'DM Sans',sans-serif;min-height:100vh}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}

</style>

<body>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║           CONFIGURAÇÃO DO CLIENTE — EDITE APENAS AQUI           ║
// ╚══════════════════════════════════════════════════════════════════╝
const CONFIG = {
  CLIENTE:          'Ramom · Faz a Festa',
  PRODUTO:          'Árvore de Natal',
  ANO:              '2026',

  SHEET_ID:         '1-URSi5otp4wZzO-BvPqx6-WlXHz7FOyOOsYEMgzij-8',
  GERENCIADOR_SHEET:'Gerenciador',
  WEBHOOK_SHEET:    'Vendas',          // export Kiwify com as vendas reais
  DATA_MINIMA:      '2026-10-03',

  PRODUTO_NOME:         'arvore de natal',  // normalizado (sem acento, minúsculo)
  PRODUTO_PRECO_MINIMO: 0,
  PRODUTO_PRECO_BASE:   67,                 // fatOB = max(0, valor - 67)

  USA_TX_ROOT: false,
  VALORES_EM_CENTAVOS: false,

  // Colunas da aba de vendas (Kiwify) — localizadas por nome de cabeçalho
  W: {
    id:          'ID da venda',
    status:      'Status',
    produto:     'Produto',
    cliente:     'Cliente',
    email:       'Email',
    data:        'Data de Criação',
    fatTotal:    'Preço base do produto',   // valor do produto, sem acréscimo de parcelamento
    fatAcresc:   'Total com acréscimo',
    pagamento:   'Pagamento',
    utmSource:   'Tracking utm_source',
    utmMedium:   'Tracking utm_medium',
    utmCampaign: 'Tracking utm_campaign',
    utmContent:  'Tracking utm_content',
  },

  // Colunas do Gerenciador — localizadas por nome de cabeçalho (ordem difere do padrão Stract)
  G: {
    date:           'Date',
    campaign:       'Campaign Name',
    adset:          'Adset Name',
    inv:            'Spend',
    imp:            'Impressions',
    reach:          'Reach',
    cliques:        'Action Link Clicks',
    pv:             'Action Landing Page View',
    ck:             'Action Omni Initiated Checkout',
    compras:        'Action Omni Purchase',
    link:           'Instagram Permalink URL',
    ad:             'Ad Name',
    statusAd:       'Ad Status',
    statusCampaign: 'Campaign Status',
  },

  STATUS_APROVADO: ['paid','approved','complete','confirmed','pago','aprovado'],
  STATUS_NEGATIVO: /refund|reembols|cancel|chargeback|estorn|disput|recus|refused|waiting_payment|pending|abandon/,
};

const SHEET_ID=CONFIG.SHEET_ID, GERENCIADOR_SHEET=CONFIG.GERENCIADOR_SHEET, WEBHOOK_SHEET=CONFIG.WEBHOOK_SHEET, DATA_MINIMA=CONFIG.DATA_MINIMA;

document.addEventListener('DOMContentLoaded',()=>{
  document.title=CONFIG.PRODUTO+' · '+CONFIG.CLIENTE+' — Jamelli GT';
  const b=document.getElementById('brand-title'); if(b) b.textContent='📦 '+CONFIG.PRODUTO+' · '+CONFIG.CLIENTE;
  const s=document.getElementById('brand-subtitle'); if(s) s.textContent='Dashboard de Performance — Perpétuo · Jamelli GT · '+CONFIG.ANO;
  loadData();
});

// ─────────────────────────── Utilitários ───────────────────────────
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(v){
  let s=String(v==null?'':v).replace(/R\$/gi,'').replace(/\s/g,'').replace(/[^0-9.,\-]/g,'');
  if(!s||s==='-') return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function money(v){ let n=parseNum(v); return CONFIG.VALORES_EM_CENTAVOS?n/100:n; }
function parseDate(v){
  const s=String(v==null?'':v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
const brl=v=>v?'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const pct=v=>v?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'—';
const int=v=>v?Math.round(v).toLocaleString('pt-BR'):'—';
const roasf=v=>v?v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x':'—';
const fdate=iso=>iso?iso.split('-').reverse().join('/'):'';
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function weekStart(iso){const d=new Date(iso+'T00:00:00Z');return addDays(iso,-((d.getUTCDay()+6)%7));}
const isPaused=s=>String(s||'').toUpperCase().includes('PAUSED');

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function findCol(hdr,name){
  const n=norm(name);
  let i=hdr.findIndex(h=>norm(h)===n);
  if(i>=0) return i;
  return hdr.findIndex(h=>norm(h).includes(n));
}
async function fetchSheetCSV(sheetName){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    const resp=await fetch(url,{signal:controller.signal});
    clearTimeout(timeout);
    if(!resp.ok) throw new Error(`Planilha "${sheetName}": HTTP ${resp.status}. Verifique se está pública.`);
    const text=await resp.text();
    if(text.includes('Signin')||text.includes('accounts.google')) throw new Error(`Planilha "${sheetName}" requer login. Defina como pública (qualquer pessoa com o link).`);
    return text;
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError') throw new Error(`Timeout ao carregar "${sheetName}".`);
    throw e;
  }
}

// ─────────────────────────── Processamento ───────────────────────────
let GROWS=[], SALES=[], FROM='', TO='';

function processGerenciador(rows){
  if(rows.length<2) return [];
  const hdr=rows[0], C={};
  for(const [k,n] of Object.entries(CONFIG.G)) C[k]=findCol(hdr,n);
  if(C.date<0||C.inv<0) throw new Error(`Aba "${GERENCIADOR_SHEET}": não encontrei as colunas Date/Spend.`);
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const g=k=>C[k]>=0?String(r[C[k]]==null?'':r[C[k]]).trim():'';
    const date=parseDate(g('date')); if(!date) continue;
    if(CONFIG.DATA_MINIMA&&date<CONFIG.DATA_MINIMA) continue;
    out.push({date,campaign:g('campaign'),adset:g('adset'),ad:g('ad'),link:g('link'),
      inv:parseNum(g('inv')),imp:parseNum(g('imp')),reach:parseNum(g('reach')),cliques:parseNum(g('cliques')),
      pv:parseNum(g('pv')),ck:parseNum(g('ck')),compras:parseNum(g('compras')),
      sAd:g('statusAd'),sCamp:g('statusCampaign')});
  }
  return out;
}

const isTrafego=s=>norm(s.utmSource).replace(/[\s_\-]/g,'')==='metaads';

function processSales(rows){
  if(rows.length<2) return [];
  const hdr=rows[0], W={};
  for(const [k,n] of Object.entries(CONFIG.W)) W[k]=findCol(hdr,n);
  if(W.data<0||W.status<0) throw new Error(`Aba "${WEBHOOK_SHEET}": não encontrei as colunas de status/data. Confira o nome da aba.`);
  const seen=new Set(), sales=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r.some(x=>String(x).trim())) continue;
    const g=k=>W[k]>=0?String(r[W[k]]==null?'':r[W[k]]).trim():'';
    const st=norm(g('status'));
    if(CONFIG.STATUS_NEGATIVO.test(st)) continue;
    if(!CONFIG.STATUS_APROVADO.includes(st)) continue;
    const data=parseDate(g('data')); if(!data) continue;
    if(CONFIG.DATA_MINIMA&&data<CONFIG.DATA_MINIMA) continue;
    const prod=norm(g('produto'));
    if(prod&&CONFIG.PRODUTO_NOME&&!prod.includes(CONFIG.PRODUTO_NOME)) continue;
    const id=g('id')||(norm(g('email'))+'|'+data);
    if(seen.has(id)) continue; seen.add(id);
    let total=money(g('fatTotal')); if(!total) total=money(g('fatAcresc'));
    if(total<=0||total<CONFIG.PRODUTO_PRECO_MINIMO) continue;
    const fatOB=Math.max(0,total-CONFIG.PRODUTO_PRECO_BASE);
    const s={data,nome:g('cliente'),email:g('email'),id,pagamento:g('pagamento'),
      fatTotal:total,fatPrincipal:total-fatOB,fatOB,temOB:fatOB>0.01,
      utmSource:g('utmSource'),utmMedium:g('utmMedium'),utmCampaign:g('utmCampaign'),utmContent:g('utmContent')};
    s.trafego=isTrafego(s);
    sales.push(s);
  }
  return sales.sort((a,b)=>b.data.localeCompare(a.data));
}

async function loadData(){
  const ov=document.getElementById('loading-overlay');
  ov.style.display='flex'; document.getElementById('spinner').style.display='block';
  const msg=document.getElementById('loading-msg'); msg.textContent='Conectando com a planilha...';
  try{

    msg.textContent='Carregando vendas...';
    const wCsv=await fetchSheetCSV(WEBHOOK_SHEET);
    GROWS=processGerenciador(parseCSV(gCsv));

}

function setPreset(days,btn){
  document.querySelectorAll('.preset-btn[data-p]').forEach(b=>b.classList.remove('active'));

  else{TO=last;FROM=addDays(last,-(days-1)); if(FROM<first) FROM=first;}

// ─────────────────────────── Agregação ───────────────────────────
const sumBy=(a,k)=>a.reduce((x,s)=>x+(s[k]||0),0);
function aggregate(rows,sales){
  const o={inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0,compras:0};
  rows.forEach(r=>{for(const k in o) o[k]+=r[k];});
  o.tr=sales.filter(s=>s.trafego); o.org=sales.filter(s=>!s.trafego); o.sales=sales;
  o.fatTr=sumBy(o.tr,'fatTotal'); o.fatOrg=sumBy(o.org,'fatTotal'); o.fatTotal=o.fatTr+o.fatOrg;
  o.obTr=sumBy(o.tr,'fatOB'); o.obOrg=sumBy(o.org,'fatOB');
  o.nObTr=o.tr.filter(s=>s.temOB).length; o.nObOrg=o.org.filter(s=>s.temOB).length;
  o.nTr=o.tr.length; o.nOrg=o.org.length; o.nTotal=sales.length;
  o.roasTr=o.inv?o.fatTr/o.inv:0; o.roasTot=o.inv?o.fatTotal/o.inv:0;
  o.cac=o.nTr?o.inv/o.nTr:0; o.cacTot=o.nTotal?o.inv/o.nTotal:0;
  o.ticket=o.nTotal?o.fatTotal/o.nTotal:0;
  o.cpc=o.cliques?o.inv/o.cliques:0; o.cpm=o.imp?o.inv/o.imp*1000:0; o.ctr=o.imp?o.cliques/o.imp:0;
  return o;
}

// ─────────────────────────── Criativos / Públicos ───────────────────────────
function buildCriPubMaps(from,to){
  const cri={},pub={};
  const rows=GROWS.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>a.date.localeCompare(b.date));
  const add=(map,key,r)=>{
    const nk=norm(key); if(!nk) return;
    const m=map[nk]||(map[nk]={name:key,inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0,compras:0,link:'',sAd:'',sCamp:'',vendas:0,fat:0});
    ['inv','imp','reach','cliques','pv','ck','compras'].forEach(f=>m[f]+=r[f]);
    if(r.link) m.link=r.link; m.sAd=r.sAd; m.sCamp=r.sCamp;   // último status (linhas ordenadas por data)
  };
  rows.forEach(r=>{add(cri,r.ad,r);add(pub,r.adset,r);});
  SALES.filter(s=>s.trafego&&(!from||s.data>=from)&&(!to||s.data<=to)).forEach(s=>{
    const c=cri[norm(s.utmContent)]; if(c){c.vendas++;c.fat+=s.fatTotal;}
    const p=pub[norm(s.utmMedium)]; if(p){p.vendas++;p.fat+=s.fatTotal;}
  });
  const fin=m=>{Object.values(m).forEach(x=>{
    x.ativo=!isPaused(x.sAd)&&!isPaused(x.sCamp)&&(x.sAd!==''||x.sCamp!=='');
    x.ctr=x.imp?x.cliques/x.imp:0; x.cpc=x.cliques?x.inv/x.cliques:0; x.cpm=x.imp?x.inv/x.imp*1000:0;
    x.roas=x.inv?x.fat/x.inv:0; x.cac=x.vendas?x.inv/x.vendas:0;});};
  fin(cri);fin(pub);
  return {cri,pub};
}

// ─────────────────────────── Semana a Semana / Mês a Mês ───────────────────────────
function renderPeriodo(tabId,titulo,keyFn,labelFn){
  const rows=rowsInRange(), sales=salesInRange();
  const keys=[...new Set([...rows.map(r=>keyFn(r.date)),...sales.map(s=>keyFn(s.data))])].sort();
  const grp=keys.map(k=>{const x=aggregate(rows.filter(r=>keyFn(r.date)===k),sales.filter(s=>keyFn(s.data)===k));x.key=k;x.label=labelFn(k);return x;});
  const body=[...grp].reverse().map(x=>`<tr><td>${x.label}</td><td>${brl(x.inv)}</td><td>${int(x.imp)}</td><td>${int(x.cliques)}</td><td>${pct(x.ctr)}</td><td>${brl(x.cpc)}</td><td>${int(x.pv)}</td><td>${int(x.ck)}</td><td>${int(x.nTotal)}</td><td>${int(x.nTr)}</td><td>${brl(x.fatTotal)}</td><td>${roasf(x.roasTot)}</td><td>${brl(x.cac)}</td></tr>`).join('');
  document.getElementById('c-'+tabId).innerHTML=
    `<div class="chart-grid-2x2">
       <div class="chart-card"><h4>Investimento por ${titulo.toLowerCase()}</h4><canvas id="ch-${tabId}-1"></canvas></div>
       <div class="chart-card"><h4>CTR por ${titulo.toLowerCase()}</h4><canvas id="ch-${tabId}-2"></canvas></div>
     </div>
     <div class="sec-title">${titulo} a ${titulo.toLowerCase()}</div>
     ${grp.length?table([titulo,'Invest.','Impr.','Cliques','CTR','CPC','PV','Checkout','Vendas','Tráfego','Fat. Total','ROAS','CAC'],body):'<div class="empty">Sem dados no período.</div>'}`;
  const labels=grp.map(x=>x.label);
  mkChart(`ch-${tabId}-1`,{type:'bar',data:{labels,datasets:[{label:'Investimento',data:grp.map(x=>+x.inv.toFixed(2)),backgroundColor:WARM1}]}});
  mkChart(`ch-${tabId}-2`,{type:'line',data:{labels,datasets:[{label:'CTR (%)',data:grp.map(x=>+(x.ctr*100).toFixed(2)),borderColor:WARM2,backgroundColor:'rgba(255,183,55,0.25)',fill:true,tension:.3,pointBackgroundColor:WARM1}]}});
}
</script>
</body>
</html>
