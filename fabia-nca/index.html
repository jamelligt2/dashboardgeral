<style>

@media(max-width:900px){.cri-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cri-grid{grid-template-columns:1fr}.chart-grid-2x2{grid-template-columns:1fr}.funil-section{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:12px 16px}.tabs{padding:0 12px}}

.kpi-card.hero .kpi-value{font-size:24px}

<body>

<div id="loading-overlay" style="position:fixed;inset:0;background:#1a1a2e;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div style="width:40px;height:40px;border:3px solid rgba(255,107,43,.2);border-top-color:#ff6b2b;border-radius:50%;animation:spin 1s linear infinite"></div>
  <div style="color:rgba(255,255,255,.5);font-size:13px" id="loading-msg">Conectando com a planilha...</div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<div class="topbar">
  <div class="logo-jgt">
    <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="8" fill="#ff6b2b" fill-opacity="0.9"/>
      <text x="18" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="white">JGT</text>
    </svg>
    <div class="logo-text"><strong>Jamelli GT</strong><span>Tráfego Pago</span></div>
  </div>
  <div class="period-bar">
    <label>De</label>
    <input type="date" id="dateFrom" class="date-input" onchange="onDateChange()">

    <button class="preset-btn" onclick="setPreset(1,this)">Hoje</button>

    <button class="preset-btn" onclick="loadData()" style="margin-left:4px">🔄 Atualizar</button>
  </div>
  <div>
    <div class="brand" id="brand-title">🥗 NCA · Fabia</div>
    <div class="subtitle" id="brand-subtitle">Nutrição e Culinária Ayurvédica — Vendas · Jamelli GT · 2026</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('visao',this)">🌐 Visão Geral</div>
  <div class="tab" onclick="showTab('trafego',this)">📊 Tráfego (Gerenciador)</div>

</div>

<div id="err-slot"></div>

<div class="content" id="tab-trafego"></div>
<div class="content" id="tab-vendas"></div>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║           CONFIGURAÇÃO DO CLIENTE — EDITE APENAS AQUI           ║
// ╚══════════════════════════════════════════════════════════════════╝
const CONFIG = {
  CLIENTE: 'Fabia',
  PRODUTO: 'NCA — Nutrição e Culinária Ayurvédica',
  ANO:     '2026',

  // ── Planilha "JGTCL0051 - Fabia - NCA" ────────────────────────────
  SHEET_ID:          '1iH7FK0YPCjqTa5EJV2CjAj7gtubqamsWnodhq3LSmlI',
  GERENCIADOR_SHEET: 'Gerenciador',
  VENDAS_SHEET:      'Vendas até 16/11 16h',  // vendas da plataforma ATÉ o corte
  WEBHOOK_SHEET:     'Webhook',               // vendas DEPOIS do corte
  DATA_MINIMA:       '2026-11-01',

  // ── REGRA DE CORTE (horário de Brasília) ──────────────────────────
  // aprovação <= CORTE → aba "Vendas até 16/11 16h"; aprovação > CORTE → aba "Webhook"
  CORTE_VENDAS: '2026-11-16 16:00:00',
  // Se os horários do webhook vierem com fuso diferente de Brasília, ajuste aqui (em horas).
  WEBHOOK_AJUSTE_HORAS: 0,
  // Uma venda do webhook que já está na aba de vendas (mesmo e-mail + produto, até 8h de diferença) é ignorada.
  DEDUP_JANELA_H: 8,

  // ── Produto ───────────────────────────────────────────────────────
  // Conta como venda do NCA todo produto cujo nome contém isto
  // (inclui o combo "Nutrição e Culinária Ayurvédica + Beleza Longeva").
  PRODUTO_NOME:    'Nutrição e Culinária Ayurvédica',
  STATUS_APROVADO: ['APROVADA', 'APPROVED', 'COMPLETE', 'COMPLETED', 'CONFIRMED', 'PAGO', 'PAID'],
  VALORES_EM_CENTAVOS: false,

  // ── Colunas da aba de vendas (cabeçalho) ──────────────────────────
  V: {
    status:'status', moeda:'moeda', valor:'valor venda', produto:'nome produto', oferta:'nome oferta',
    pagamento:'pagamento', nome:'nome contato', email:'email contato', pedido:'data pedido', aprov:'data aprovacao',
    utmSrc:null, utmTerm:'rppc utm term', utmCamp:'rppc utm campaign', utmMed:'rppc utm medium', utmCont:'rppc utm content',
  },
  // ── Colunas da aba Webhook (cabeçalho; as que não existirem são ignoradas) ──
  W: {
    status:'status', moeda:'moeda', valor:'valor', produto:'produto', oferta:'oferta',
    pagamento:'pagamento', nome:'nome', email:'email', pedido:'data_venda', aprov:'data_venda',
    utmSrc:'utm_source', utmTerm:'utm_term', utmCamp:'utm_campaign', utmMed:'utm_medium', utmCont:'utm_content',
  },
  // ── Colunas do Gerenciador (export Meta) ──────────────────────────
  G: {
    date:'Date', campaign:'Campaign Name', adset:'Adset Name', ad:'Ad Name',
    inv:'Spend (Cost, Amount Spent)',           // opcional — se a coluna entrar, investimento/CAC aparecem
    imp:'Impressions', reach:'Reach (Estimated)', cliques:'Action Link Clicks', pv:'Action Landing Page View',
    ck:'Action Omni Initiated Checkout', compras:'Action Omni Purchase',
    statusCampaign:'Campaign Status', statusAdset:'Adset Status', statusAd:'Ad Status', link:'Instagram Permalink URL',
  },
};
const SHEET_ID = CONFIG.SHEET_ID;

// ───────────── utilitários ─────────────
const clean = s => String(s==null?'':s).replace(/\[merged\]/gi,'').trim();
const norm  = s => clean(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseBR(s){
  s=clean(s); if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
// aceita 'DD/MM/YYYY HH:MM:SS' e 'YYYY-MM-DD HH:MM:SS' (ou ISO)
function parseDT(s){
  s=clean(s); let m;
  if((m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){
    const d=`${m[3]}-${m[2]}-${m[1]}`; return {d, ts:`${d} ${String(m[4]||'0').padStart(2,'0')}:${m[5]||'00'}:${m[6]||'00'}`};
  }
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){
    const d=`${m[1]}-${m[2]}-${m[3]}`; return {d, ts:`${d} ${String(m[4]||'0').padStart(2,'0')}:${m[5]||'00'}:${m[6]||'00'}`};
  }
  return null;
}
function parseDay(s){ const p=parseDT(s); return p?p.d:''; }
const tsMs = ts => Date.parse(ts.replace(' ','T')+'Z');
function shiftDT(dt,h){ if(!dt||!h) return dt; const iso=new Date(tsMs(dt.ts)+h*3600000).toISOString(); return {d:iso.slice(0,10), ts:iso.slice(0,10)+' '+iso.slice(11,19)}; }
function hmap(hdr){ const m={}; hdr.forEach((h,i)=>{ const k=norm(h); if(k && !(k in m)) m[k]=i; }); return m; }
function colIx(m,name,required){ if(name==null) return -1; const k=norm(name); if(k in m) return m[k]; if(required) throw new Error('Coluna não encontrada: "'+name+'"'); return -1; }

// ───────────── Gerenciador ─────────────
function processGerenciador(rows){
  if(!rows.length) return [];
  const m=hmap(rows[0]), ix={};
  Object.keys(CONFIG.G).forEach(k=>{ ix[k]=colIx(m,CONFIG.G[k],['date','ad','imp','cliques'].includes(k)); });
  const val=(r,k)=>ix[k]>=0?r[ix[k]]:'';
  const out=[];
  rows.slice(1).forEach(r=>{
    const date=parseDay(val(r,'date'));
    if(!date || date<CONFIG.DATA_MINIMA) return;
    out.push({ date, campaign:clean(val(r,'campaign')), adset:clean(val(r,'adset')), ad:clean(val(r,'ad')),
      inv:parseBR(val(r,'inv')), imp:parseBR(val(r,'imp')), reach:parseBR(val(r,'reach')), cliques:parseBR(val(r,'cliques')),
      pv:parseBR(val(r,'pv')), ck:parseBR(val(r,'ck')), compras:parseBR(val(r,'compras')),
      sCamp:clean(val(r,'statusCampaign')).toUpperCase(), sAdset:clean(val(r,'statusAdset')).toUpperCase(),
      sAd:clean(val(r,'statusAd')).toUpperCase(), link:clean(val(r,'link')) });
  });
  return out;
}

// ───────────── Vendas ─────────────
const ORIGEM_LABEL={whatsapp:'WhatsApp',instagram:'Instagram',youtube:'YouTube',brevo:'E-mail (Brevo)',email:'E-mail',manychat:'ManyChat',facebook:'Facebook',google:'Google',metaads:'Meta Ads'};
function labelOrigem(s){ const n=norm(s); return ORIGEM_LABEL[n] || (s? s.charAt(0).toUpperCase()+s.slice(1) : ''); }
function resolveUtm(u, ent){
  const fields=[u.src,u.term,u.camp,u.med,u.cont].map(clean).filter(Boolean);
  const isTrafego=fields.some(f=>{ const n=norm(f); return n==='metaads'||n==='meta'||n==='fb'||n==='facebookads'; });
  let cri='', pub='';
  fields.forEach(f=>{ const n=norm(f); if(!cri&&ent.ads[n]) cri=ent.ads[n]; if(!pub&&ent.sets[n]) pub=ent.sets[n]; });
  if(!cri){ const f=fields.map(x=>x.match(/nca-?ad[a-z]?\d+/i)).find(Boolean); if(f) cri=f[0].toUpperCase(); }
  // UTM da plataforma: medium = campanha, campaign = conjunto, content = anúncio
  const campanha = cri && ent.adCamp[norm(cri)] ? ent.adCamp[norm(cri)] : (isTrafego ? clean(u.med) : '');
  if(isTrafego && !pub) pub=clean(u.camp);
  const ncaCamp = isTrafego && /nca/i.test(campanha);
  const origem = isTrafego ? 'Meta Ads' : (labelOrigem(clean(u.term)||clean(u.src)) || 'Direto / sem UTM');
  const canal  = isTrafego ? '' : clean(u.med);
  return {isTrafego, criativo:cri||(isTrafego?'(sem criativo)':''), publico:pub||(isTrafego?'(sem público)':''), campanha, ncaCamp, origem, canal};
}
// UTMs às vezes chegam com acentos corrompidos (ex.: "Intera-§-£o 30D")
function fixMoji(s){
  return String(s==null?'':s)
    .replace(/-§/g,'ç').replace(/-£/g,'ã').replace(/-¡/g,'á')
    .replace(/-©/g,'é').replace(/-ª/g,'ê').replace(/-\u00ad/g,'í')
    .replace(/-³/g,'ó').replace(/-µ/g,'õ').replace(/-º/g,'ú')
    .replace(/-¢/g,'â').replace(/-´/g,'ô');
}
function readSheetRows(rows, MAP, fonte){
  if(!rows.length) return [];
  const m=hmap(rows[0]), ix={};
  Object.keys(MAP).forEach(k=>{ ix[k]=colIx(m,MAP[k],['status','valor','produto','pedido'].includes(k)); });
  const val=(r,k)=>ix[k]>=0?r[ix[k]]:'';
  const aj=fonte==='webhook'?(CONFIG.WEBHOOK_AJUSTE_HORAS||0):0;
  const out=[];
  rows.slice(1).forEach(r=>{
    if(!r||r.every(c=>clean(c)==='')) return;
    const pedido=shiftDT(parseDT(val(r,'pedido')),aj);
    const aprov=shiftDT(parseDT(val(r,'aprov')),aj)||pedido;
    let valor=parseBR(val(r,'valor')); if(CONFIG.VALORES_EM_CENTAVOS) valor/=100;
    out.push({ fonte, status:clean(val(r,'status')), moeda:clean(val(r,'moeda')).toUpperCase(), valor,
      produto:clean(val(r,'produto')), oferta:clean(val(r,'oferta')), pagamento:clean(val(r,'pagamento')),
      nome:clean(val(r,'nome')), email:clean(val(r,'email')).toLowerCase(), pedido, aprov,
      utm:{src:fixMoji(clean(val(r,'utmSrc'))),term:fixMoji(clean(val(r,'utmTerm'))),camp:fixMoji(clean(val(r,'utmCamp'))),med:fixMoji(clean(val(r,'utmMed'))),cont:fixMoji(clean(val(r,'utmCont')))} });
  });
  return out;
}
function processSales(vRowsRaw, wRowsRaw, GROWS){
  const ent={ads:{},sets:{},adCamp:{}};
  GROWS.forEach(r=>{ if(r.ad){ ent.ads[norm(r.ad)]=r.ad; ent.adCamp[norm(r.ad)]=r.campaign; } if(r.adset) ent.sets[norm(r.adset)]=r.adset; });
  const stats={webhookLinhas:0, webhookErro:'', dupIgnoradas:0};
  const vRows=readSheetRows(vRowsRaw, CONFIG.V, 'planilha');
  let wRows=[];
  try{ wRows=wRowsRaw&&wRowsRaw.length?readSheetRows(wRowsRaw, CONFIG.W, 'webhook'):[]; }
  catch(e){ stats.webhookErro=e.message; }
  stats.webhookLinhas=wRows.length;
  const aprov=new Set(CONFIG.STATUS_APROVADO), pN=norm(CONFIG.PRODUTO_NOME);
  const ok=r=>aprov.has(r.status.toUpperCase()) && (!r.moeda||r.moeda==='BRL') && r.aprov && norm(r.produto).includes(pN) && r.aprov.d>=CONFIG.DATA_MINIMA;
  const pl=vRows.filter(r=>ok(r) && r.aprov.ts<=CONFIG.CORTE_VENDAS);
  const key=r=>(r.email||r.nome.toLowerCase())+'|'+norm(r.produto);
  const seen={}; pl.forEach(r=>{ (seen[key(r)]=seen[key(r)]||[]).push(tsMs(r.aprov.ts)); });
  const wb=[];
  wRows.filter(ok).sort((a,b)=>a.aprov.ts.localeCompare(b.aprov.ts)).forEach(r=>{
    const k=key(r), t=tsMs(r.aprov.ts), arr=seen[k]||[];
    if(arr.some(x=>Math.abs(x-t)<=CONFIG.DEDUP_JANELA_H*3600000)){ stats.dupIgnoradas++; return; }
    if(r.aprov.ts<=CONFIG.CORTE_VENDAS) return;
    (seen[k]=arr).push(t); wb.push(r);
  });
  const sales=[...pl,...wb].map(r=>{
    const u=resolveUtm(r.utm, ent);
    const combo=/beleza\s*longeva/i.test(r.produto);
    return { data:r.aprov.d, hora:r.aprov.ts.slice(11,16), ts:r.aprov.ts, nome:r.nome, email:r.email, valor:r.valor,
      produto:r.produto, tipo:combo?'NCA + Beleza Longeva':'NCA', oferta:r.oferta, pagamento:r.pagamento, fonte:r.fonte, ...u };
  }).sort((a,b)=>b.ts.localeCompare(a.ts));
  return {SALES:sales, STATS:stats};
}

// ───────────── agregação ─────────────
function agg(grows, sales){
  const a={inv:0,imp:0,reach:0,cliques:0,pv:0,ck:0,infl:0,vT:0,vO:0,fatT:0,fatO:0};
  grows.forEach(r=>{ a.inv+=r.inv; a.imp+=r.imp; a.reach+=r.reach; a.cliques+=r.cliques; a.pv+=r.pv; a.ck+=r.ck; a.infl+=r.compras; });
  sales.forEach(s=>{ if(s.isTrafego){ a.vT++; a.fatT+=s.valor; } else { a.vO++; a.fatO+=s.valor; } });
  a.vendas=a.vT+a.vO; a.fat=a.fatT+a.fatO; a.ticket=a.vendas?a.fat/a.vendas:0;
  a.ctr=a.imp?a.cliques/a.imp*100:0; a.cpc=a.cliques?a.inv/a.cliques:0; a.cpm=a.imp?a.inv/a.imp*1000:0;
  a.cacInfl=a.infl?a.inv/a.infl:0;
  return a;
}

const nf=(v,d=0)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=v=>(!v||!isFinite(v))?'—':'R$ '+nf(v,2);
const pct=v=>(!v||!isFinite(v))?'—':nf(v,2)+'%';
const int=v=>(!v||!isFinite(v))?'0':nf(v,0);
const fdate=d=>d?d.split('-').reverse().join('/'):'';
const fshort=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isPaused=s=>/PAUSED|ARCHIVED|DELETED/.test(String(s||''));
const corteTxt=()=>CONFIG.CORTE_VENDAS.slice(8,10)+'/'+CONFIG.CORTE_VENDAS.slice(5,7)+' às '+CONFIG.CORTE_VENDAS.slice(11,16);

// ───────────── fetch (gviz JSONP) ─────────────
function gvizToRows(t){
  let hdr=t.cols.map(c=>c.label||''); let body=t.rows||[];
  if(hdr.every(x=>x==='') && body.length){ hdr=body[0].c.map(c=>c&&c.v!=null?String(c.v):''); body=body.slice(1); }
  const rows=[hdr];
  body.forEach(r=>{
    rows.push((r.c||[]).map(c=>{
      if(!c||c.v==null) return '';
      if(typeof c.v==='string') return (c.v.indexOf('Date(')===0 && c.f!=null) ? c.f : c.v;
      if(typeof c.v==='number') return String(c.v);
      return c.f!=null?c.f:String(c.v);
    }));
    while(rows[rows.length-1].length<hdr.length) rows[rows.length-1].push('');
  });
  return rows;
}
// Datas do gviz chegam como "Date(2026,10,15,...)" quando a célula é data; convertemos para ISO.
function fixGvizDates(t){
  (t.rows||[]).forEach(r=>(r.c||[]).forEach(c=>{
    if(c && typeof c.v==='string'){ const m=c.v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?\)$/);
      if(m){ const p=n=>String(n).padStart(2,'0'); c.f=`${m[1]}-${p(+m[2]+1)}-${p(m[3])} ${p(m[4]||0)}:${p(m[5]||0)}:${p(m[6]||0)}`; } }
  }));
  return t;
}
function fetchSheetRows(sheetName, optional=false){
  return new Promise((resolve,reject)=>{
    const cb='__gv'+Math.random().toString(36).slice(2), s=document.createElement('script'); let done=false;
    const finish=(fn,v)=>{ if(done) return; done=true; clearTimeout(timer); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); fn(v); };
    const fail=msg=>finish(optional?resolve:reject, optional?[]:new Error(msg));
    const timer=setTimeout(()=>fail(`Timeout ao carregar "${sheetName}".`),20000);
    window[cb]=resp=>{
      if(!resp||resp.status!=='ok') return fail(`Planilha "${sheetName}": ${(resp&&resp.errors&&resp.errors[0]&&resp.errors[0].detailed_message)||'resposta inválida'}. Verifique se a aba existe e se a planilha está pública (qualquer pessoa com o link).`);
      finish(resolve,gvizToRows(fixGvizDates(resp.table)));
    };
    s.onerror=()=>fail(`Não foi possível carregar "${sheetName}". Verifique a internet e se a planilha está pública.`);
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(sheetName)}&headers=1&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
async function loadData(silent){
  const ov=document.getElementById('loading-overlay'), msg=document.getElementById('loading-msg');
  if(!silent) ov.style.display='flex';
  try{
    document.getElementById('err-slot').innerHTML='';
    msg.textContent='Carregando Gerenciador...';
    const g=await fetchSheetRows(CONFIG.GERENCIADOR_SHEET);
    msg.textContent='Carregando vendas (até o corte)...';
    const v=await fetchSheetRows(CONFIG.VENDAS_SHEET);
    msg.textContent='Carregando Webhook (após o corte)...';
    const w=await fetchSheetRows(CONFIG.WEBHOOK_SHEET, true);
    GROWS=processGerenciador(g);
    const r=processSales(v,w,GROWS); SALES=r.SALES; STATS=r.STATS;
    const set=new Set(GROWS.map(x=>x.date)); SALES.forEach(s=>set.add(s.data)); DIAS=[...set].sort();
    initDates(); renderAll();
  }catch(e){
    console.error(e);
    document.getElementById('err-slot').innerHTML=`<div class="err-box"><b>Erro ao carregar os dados.</b><br>${esc(e.message)}</div>`;
  }finally{ ov.style.display='none'; }
}

function initDates(){

  if(FIRST_LOAD||presetMode==='all'){ fi.value=DIAS[0]||''; ti.value=DIAS[DIAS.length-1]||''; }

function applyPreset(days){
  const first=DIAS[0], last=DIAS[DIAS.length-1]; if(!last) return;
  const d=new Date(last+'T12:00:00'); d.setDate(d.getDate()-(days-1));
  const from=d.toISOString().slice(0,10);
  document.getElementById('dateFrom').value=from<first?first:from; document.getElementById('dateTo').value=last;
}
function setPreset(days,btn){

function groupBy(gr, ss, keyG, keyS){
  const m={};
  const blank=n=>({name:n,inv:0,imp:0,cliques:0,pv:0,ck:0,infl:0,vUtm:0,fat:0,last:'',sCamp:'',sAdset:'',sAd:'',link:''});
  gr.forEach(r=>{ const k=keyG(r); const o=m[k]||(m[k]=blank(k));
    o.inv+=r.inv; o.imp+=r.imp; o.cliques+=r.cliques; o.pv+=r.pv; o.ck+=r.ck; o.infl+=r.compras;
    if(r.date>=o.last){ o.last=r.date; o.sCamp=r.sCamp; o.sAdset=r.sAdset; o.sAd=r.sAd; if(r.link) o.link=r.link; } });
  ss.forEach(s=>{ const k=keyS(s); if(!k) return; const o=m[k]||(m[k]=blank(k)); o.vUtm++; o.fat+=s.valor; });
  return Object.values(m).map(o=>{ o.ativo=o.last!==''&&!isPaused(o.sAd)&&!isPaused(o.sAdset)&&!isPaused(o.sCamp); o.ctr=o.imp?o.cliques/o.imp*100:0; return o; })
    .sort((a,b)=>(b.infl+b.vUtm)-(a.infl+a.vUtm)||b.ck-a.ck||b.cliques-a.cliques);
}

function renderTrafego(from,to){
  const gr=GROWS.filter(g=>inR(g.date,from,to)), ss=SALES.filter(s=>inR(s.data,from,to));
  const a=agg(gr,ss), temInv=a.inv>0;
  const kpis=`<div class="kpi-grid">
    ${temInv?kpi('Investimento',brl(a.inv),'orange'):''}
    ${kpi('Impressões',int(a.imp))}${kpi('Alcance',int(a.reach))}${kpi('Cliques no link',int(a.cliques))}
    ${kpi('CTR',pct(a.ctr))}${kpi('Page views',int(a.pv))}${kpi('Checkouts iniciados',int(a.ck))}
    ${kpi('Compras influenciadas',int(a.infl),'green')}${kpi('Vendas com UTM meta_ads',int(a.vT),'orange',brl(a.fatT))}
    ${temInv?kpi('CPC',brl(a.cpc))+kpi('Custo por compra infl.',brl(a.cacInfl)):''}
  </div>`;
  const steps=[['Cliques no link',a.cliques],['Page views',a.pv],['Checkouts iniciados',a.ck],['Compras influenciadas',a.infl]];
  const top=Math.max(...steps.map(s=>s[1]),1);
  const bars=steps.map(([l,v])=>`<div class="funil-bar-wrap"><div class="funil-label"><span>${l}</span><span style="font-family:'DM Mono',monospace">${nf(v)}</span></div><div class="funil-bar-bg"><div class="funil-bar-fill" style="width:${Math.max(v/top*100,v?2:0)}%"></div></div></div>`).join('');
  const rate=(n,d)=>d?nf(n/d*100,1)+'%':'—';
  const taxas=[['Clique → Page view',rate(a.pv,a.cliques)],['Page view → Checkout',rate(a.ck,a.pv)],['Checkout → Compra',rate(a.infl,a.ck)],['Clique → Compra',rate(a.infl,a.cliques)]]
    .map(([l,v])=>`<div class="taxa-item"><span>${l}</span><span class="taxa-val">${v}</span></div>`).join('');
  const funil=`<div class="sec-title">Funil — Meta Ads (Gerenciador)</div><div class="funil-section"><div>${bars}</div><div class="taxa-grid">${taxas}</div></div>`;
  const tS=ss.filter(s=>s.isTrafego);
  const cri=groupTable('Criativos',groupBy(gr,tS,r=>r.ad,s=>s.criativo),true);
  const pub=groupTable('Públicos (conjuntos)',groupBy(gr,tS,r=>r.adset,s=>s.publico),false);
  const camp=groupTable('Campanhas',groupBy(gr,tS,r=>r.campaign,s=>s.campanha||'(sem campanha)'),false);
  const nota=tS.some(s=>!s.ncaCamp)?`<div class="ob-info">ℹ️ ${tS.filter(s=>!s.ncaCamp).length} venda(s) de tráfego chegaram por anúncios de <b>outras campanhas</b> (ex.: Detox/SOS) — aparecem em "Vendas UTM" com o nome da campanha de origem.</div>`:'';
  document.getElementById('tab-trafego').innerHTML=kpis+funil+nota+camp+pub+cri;
}

function renderVendas(from,to){
  const ss=SALES.filter(s=>inR(s.data,from,to));
  const tbl=(title,keyFn)=>{
    const m={}; ss.forEach(s=>{ const k=keyFn(s)||'—'; const o=m[k]||(m[k]={n:0,t:0,o:0,fat:0}); o.n++; o.fat+=s.valor; s.isTrafego?o.t++:o.o++; });
    const list=Object.entries(m).sort((x,y)=>y[1].n-x[1].n);
    const tot=ss.length||1;
    return `<div class="sec-title">${title}</div><div class="tbl-wrap"><table><thead><tr><th>${title.replace('Por ','')}</th><th>Vendas</th><th>%</th><th>Tráfego</th><th>Orgânico</th><th>Faturamento</th><th>Ticket médio</th></tr></thead><tbody>${list.map(([k,o])=>`<tr><td>${esc(k)}</td><td>${int(o.n)}</td><td>${nf(o.n/tot*100,1)}%</td><td>${int(o.t)}</td><td>${int(o.o)}</td><td>${brl(o.fat)}</td><td>${brl(o.fat/o.n)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem vendas.</td></tr>'}</tbody></table></div>`;
  };
  const cards=ss.length?ss.map(s=>`<div class="sale-card ${s.isTrafego?'trafego':'organico'}">
      <div class="sale-top"><div class="sale-name">${s.isTrafego?'✅':'⭐'} ${esc(s.nome||s.email||'—')}</div><div class="sale-val">${brl(s.valor)}</div></div>
      <div class="sale-meta">${fdate(s.data)} ${s.hora}<span class="src-badge ${s.fonte==='webhook'?'web':''}">${s.fonte}</span><br>
        <b>${esc(s.tipo)}</b>${s.pagamento?` · ${esc(s.pagamento)}`:''}<br>
        ${s.isTrafego?`Campanha: <b>${esc(s.campanha||'—')}</b><br>Público: <b>${esc(s.publico)}</b><br>Criativo: <b>${esc(s.criativo)}</b>`:`Origem: <b>${esc(s.origem)}</b>${s.canal?` · ${esc(s.canal)}`:''}`}
      </div></div>`).join(''):'<div class="empty">Nenhuma venda no período.</div>';
  document.getElementById('tab-vendas').innerHTML=fonteInfo()
    +`<div class="sec-title">Vendas (${ss.length}) — ✅ tráfego · ⭐ orgânico</div><div class="sales-scroll">${cards}</div>`
    +tbl('Por produto',s=>s.tipo)+tbl('Por origem',s=>s.origem)+tbl('Por oferta',s=>s.oferta)+tbl('Por forma de pagamento',s=>s.pagamento);
}

document.addEventListener('DOMContentLoaded',()=>{ document.title='NCA · '+CONFIG.CLIENTE+' — Jamelli GT'; loadData(); });
setInterval(()=>loadData(true),120000);
</script>
