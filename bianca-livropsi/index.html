 <div class="sec-title">Últimas vendas</div><div class="buyers">${buyers||'<span style="color:#888">Sem vendas no período</span>'}</div>
 <div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento × Fat. Tráfego</h4><canvas id="c1"></canvas></div><div class="chart-card"><h4>Vendas por dia</h4><canvas id="c2"></canvas></div></div>`;
 const lb=ds.map(d=>dbr(d.data).slice(0,5));
 chart('c1','bar',lb,[{label:'Investimento',data:ds.map(d=>d.inv),backgroundColor:OR},{label:'Fat. Tráfego',data:ds.map(d=>d.fT),backgroundColor:YE}]);
 chart('c2','bar',lb,[{label:'Tráfego',data:ds.map(d=>d.nT),backgroundColor:OR},{label:'Orgânico',data:ds.map(d=>d.nO),backgroundColor:YE}]);
 // VISÃO GERAL
 document.getElementById('visao').innerHTML=`<div class="kpi-grid">${kpi('Investimento',R(t.inv),'orange')}${kpi('Fat. Total',R(fat),'green',fatSub)}${kpi('Fat. Líquido',R(t.liq))}${kpi('ROAS Total',X(fat/t.inv),fat/t.inv>=1?'green':'red')}${kpi('Vendas Total',nV)}${kpi('Tráfego',t.nT)}${kpi('Orgânicas',t.nO)}${kpi('Order Bumps',t.obT+t.obO)}${kpi('Ticket Médio',R(fat/nV))}${kpi('CAC Total',R(t.inv/nV))}${kpi('Resultado (líq − inv)',R(t.liq-t.inv),t.liq-t.inv>=0?'green':'red')}</div>
 <div class="tbl-wrap"><table><tr><th>Data</th><th>Invest.</th><th>Fat. Total</th><th>ROAS</th><th>Compras Total</th><th>Tráfego</th><th>Orgânicas</th><th>Ticket Médio</th><th>CAC</th></tr>${ds.slice().reverse().map(d=>{const f=d.fT+d.fO,n=d.nT+d.nO;return `<tr><td>${dbr(d.data)}</td><td>${R(d.inv)}</td><td>${R(f)}</td><td>${X(f/d.inv)}</td><td>${n||'—'}</td><td>${d.nT||'—'}</td><td>${d.nO||'—'}</td><td>${R(f/n)}</td><td>${R(d.inv/n)}</td></tr>`}).join('')}</table></div>`;
 renderCri();renderPub();
 const per=(key)=>{const m={};ds.forEach(d=>{const k=key(d.data);(m[k]=m[k]||[]).push(d)});return Object.entries(m).sort().map(([k,v])=>[k,sum(v)])};
 const tbl=(rows,fmt)=>`<div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento × Faturamento</h4><canvas id="${fmt}1"></canvas></div><div class="chart-card"><h4>Vendas</h4><canvas id="${fmt}2"></canvas></div></div><div class="tbl-wrap"><table><tr><th>Período</th><th>Invest.</th><th>Fat. Total</th><th>ROAS</th><th>Vendas</th><th>Tráfego</th><th>Orgânicas</th><th>CAC</th><th>Cliques</th><th>CTR</th></tr>${rows.slice().reverse().map(([k,v])=>{const f=v.fT+v.fO,n=v.nT+v.nO;return `<tr><td>${k}</td><td>${R(v.inv)}</td><td>${R(f)}</td><td>${X(f/v.inv)}</td><td>${n||'—'}</td><td>${v.nT||'—'}</td><td>${v.nO||'—'}</td><td>${R(v.inv/n)}</td><td>${I(v.cliques)}</td><td>${P(v.cliques/v.imp*100)}</td></tr>`}).join('')}</table></div>`;
 const wk=per(d=>{const x=new Date(d+'T00:00:00'),dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x.toISOString().slice(0,10)}).map(([k,v])=>['Sem. '+dbr(k).slice(0,5),v]);
 const mo=per(d=>d.slice(0,7)).map(([k,v])=>[k.split('-').reverse().join('/'),v]);
 document.getElementById('semanal').innerHTML=tbl(wk,'w');document.getElementById('mensal').innerHTML=tbl(mo,'m');
 [['w',wk],['m',mo]].forEach(([p,r])=>{chart(p+'1','bar',r.map(x=>x[0]),[{label:'Investimento',data:r.map(x=>x[1].inv),backgroundColor:OR},{label:'Faturamento',data:r.map(x=>x[1].fT+x[1].fO),backgroundColor:YE}]);chart(p+'2','bar',r.map(x=>x[0]),[{label:'Tráfego',data:r.map(x=>x[1].nT),backgroundColor:OR},{label:'Orgânico',data:r.map(x=>x[1].nO),backgroundColor:YE}])})}
// ── Criativos / Públicos (recalculam do zero a cada filtro) ──
function buildCriPubMaps(from,to){
 const build=(gk,sk)=>{const m={};GROWS.concat(adRows()).filter(g=>(!from||g.data>=from)&&(!to||g.data<=to)&&inS(g.seg)).forEach(r=>{const k=r[gk]||'(sem nome)';const o=m[k]||(m[k]={nome:k,inv:0,imp:0,cliques:0,pv:0,ck:0,ativo:false,link:'',fat:0,n:0,ob:0});o.inv+=r.inv;o.imp+=r.imp;o.cliques+=r.cliques;o.pv+=r.pv;o.ck+=r.ck;if(r.ativo)o.ativo=true;if(r.link)o.link=r.link});
  SALES.filter(s=>(!from||s.data>=from)&&(!to||s.data<=to)&&inS(s.seg)&&s.trafego).forEach(s=>{const k=s[sk];if(!k)return;const o=m[k]||(m[k]={nome:k,inv:0,imp:0,cliques:0,pv:0,ck:0,ativo:false,link:'',fat:0,n:0,ob:0});o.fat+=brl(s.fatTotal,s.cur);o.n++;o.ob+=s.nOB});
  return Object.values(m)};
 return {cri:build('ad','utmContent'),pub:build('adset','utmMedium')}}
const sorter=k=>({inv:(a,b)=>b.inv-a.inv,ctr:(a,b)=>b.cliques/(b.imp||1)-a.cliques/(a.imp||1),cpc:(a,b)=>(a.cliques?a.inv/a.cliques:1e9)-(b.cliques?b.inv/b.cliques:1e9),roas:(a,b)=>(b.inv?b.fat/b.inv:0)-(a.inv?a.fat/a.inv:0),vendas:(a,b)=>b.n-a.n})[k];
function setCri(k,v){if(k==='f')CRI_F=v;else CRI_S=v;renderCri()}function setPub(k,v){if(k==='f')PUB_F=v;else PUB_S=v;renderPub()}
function bar(prefix,fn,F,S,opts){return `<div class="cri-filterbar">${['all:Todos','on:Ativos','off:Inativos'].map(x=>{const[a,b]=x.split(':');return `<button class="cri-filter-btn ${F===a?'active':''}" onclick="${fn}('f','${a}')">${b}</button>`}).join('')}<span class="cri-sort-label">Ordenar:</span>${opts.map(x=>{const[a,b]=x.split(':');return `<button class="cri-sort-btn ${S===a?'active':''}" onclick="${fn}('s','${a}')">${b}</button>`}).join('')}</div>`}
function listView(id,items,F,S,fn,title,opts){
 let l=items.filter(x=>F==='all'||(F==='on')===x.ativo).sort(sorter(S));
 document.getElementById(id).innerHTML=bar(id,fn,F,S,opts)+`<div class="sec-title">${title}</div><div class="cri-grid">${l.slice(0,30).map(c=>`<div class="cri-card ${c.ativo?'ativo':''}"><div class="cri-card-header"><div class="cri-name">${c.nome}</div><span class="cri-badge ${c.ativo?'ativo':'inativo'}">${c.ativo?'Ativo':'Inativo'}</span></div><div class="cri-metrics"><div class="cri-metric"><span class="cri-metric-label">Invest.</span><span class="cri-metric-val hl">${R(c.inv)}</span></div><div class="cri-metric"><span class="cri-metric-label">ROAS</span><span class="cri-metric-val hl">${X(c.fat/c.inv)}</span></div><div class="cri-metric"><span class="cri-metric-label">Vendas</span><span class="cri-metric-val">${c.n||'—'}${c.ob?' +'+c.ob+' OB':''}</span></div><div class="cri-metric"><span class="cri-metric-label">CAC</span><span class="cri-metric-val">${R(c.inv/c.n)}</span></div><div class="cri-metric"><span class="cri-metric-label">CTR</span><span class="cri-metric-val">${P(c.cliques/c.imp*100)}</span></div><div class="cri-metric"><span class="cri-metric-label">CPC</span><span class="cri-metric-val">${R(c.inv/c.cliques)}</span></div></div>${c.link?`<a class="cri-link" href="${c.link}" target="_blank">${c.link}</a>`:''}</div>`).join('')||'<span style="color:#888">Sem dados</span>'}</div>
 <div class="tbl-wrap"><table><tr><th>Nome</th><th>Invest.</th><th>Fat. Tráfego</th><th>ROAS</th><th>Vendas</th><th>CAC</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Impr.</th></tr>${l.map(c=>`<tr><td>${c.nome}</td><td>${R(c.inv)}</td><td>${R(c.fat)}</td><td>${X(c.fat/c.inv)}</td><td>${c.n||'—'}</td><td>${R(c.inv/c.n)}</td><td>${I(c.cliques)}</td><td>${P(c.cliques/c.imp*100)}</td><td>${R(c.inv/c.cliques)}</td><td>${I(c.imp)}</td></tr>`).join('')}</table></div>`}
function renderCri(){if(!GROWS.length)return;listView('criativos',buildCriPubMaps(FROM,TO).cri,CRI_F,CRI_S,'setCri','Criativos (anúncios)',['inv:Investimento','ctr:CTR','cpc:CPC','roas:ROAS','vendas:Vendas'])}
function renderPub(){if(!GROWS.length)return;listView('publicos',buildCriPubMaps(FROM,TO).pub,PUB_F,PUB_S,'setPub','Públicos (conjuntos)',['inv:Investimento','ctr:CTR','cpc:CPC','roas:ROAS','vendas:Vendas'])}
loadData();
</script></body></html>
