 try{const resp=await fetch(url,{signal:ctl.signal});clearTimeout(to);
  if(!resp.ok)throw new Error(`Planilha "${sheetName}": HTTP ${resp.status}. Verifique se está pública.`);
  const text=await resp.text();
  if(text.includes('Signin')||text.includes('accounts.google'))throw new Error(`Planilha "${sheetName}" requer login. Defina como pública.`);
  return text}catch(e){clearTimeout(to);if(e.name==='AbortError')throw new Error(`Timeout ao carregar "${sheetName}".`);throw e}}
// ── processamento ──
const isTrafego=s=>(s.utmSource||'').toLowerCase().replace(/[\s_-]/g,'')==='metaads';
const isPaused=s=>String(s).includes('PAUSED');
function segCamp(n){for(const [s,rx] of CONFIG.SEG_CAMP)if(rx.test(n))return s;return 'd'}
function processGerenciador(rows){
 return rows.slice(1).filter(r=>r[G.date]&&pdate(r[G.date])).map(r=>({data:pdate(r[G.date]),campanha:r[G.campaign],adset:r[G.adset],ad:r[G.ad],link:r[G.link],inv:num(r[G.inv]),reach:num(r[G.reach]),imp:num(r[G.imp]),cliques:num(r[G.cliques]),pv:num(r[G.pv]),ck:num(r[G.ck]),
  ativo:!isPaused(r[G.statusAd])&&!isPaused(r[G.statusAdset])&&!isPaused(r[G.statusCampaign])&&(r[G.statusAd]||r[G.statusAdset]||r[G.statusCampaign])!=='',seg:segCamp(r[G.campaign])}))
 .filter(g=>!CONFIG.IGNORAR_CAMP.test(g.campanha))}
function processSales(rows){
 const seen=new Set(),all=[];
 rows.slice(1).forEach(r=>{const t=(r[W.tx]||'').trim();if(!t||seen.has(t))return;seen.add(t);all.push(r)});
 const ok=r=>CONFIG.STATUS_APROVADO.includes(norm(r[W.status]));
 const isRoot=r=>{const v=(r[W.root]||'').trim();return !v||v==='(none)'};
 const roots=new Map();
 all.forEach(r=>{if(!ok(r)||!isRoot(r))return;const cod=String(r[W.produtoCod]).trim(),data=pdate(r[W.data]);
  const fis=CONFIG.PRODUTO_FISICO.includes(cod),dig=CONFIG.PRODUTO_DIGITAL.includes(cod);if(!fis&&!dig)return;if(data<CONFIG.DATA_MINIMA)return;
  const sck=(r[W.sck]||'').trim(),p=sck.split('|');
  const seg=fis?'f':(CONFIG.EXTERIOR_SCK.some(x=>sck.includes(x))?'e':'d');
  const cur=(r[W.moeda]||'BRL').trim().toUpperCase()==='BRL'?'BRL':'USD';
  roots.set(String(r[W.tx]).trim(),{data,seg,cur,nome:r[W.cliente],email:r[W.email],pais:r[W.pais],fatPrincipal:num(r[W.fatBruto]),fatOB:0,nOB:0,liq:num(r[W.fatLiq]),
   utmSource:(p[0]&&p[0]!=='(none)')?p[0]:'',utmMedium:p[1]||'',utmCampaign:p[2]||'',utmContent:p[3]||''})});
 all.forEach(r=>{if(!ok(r)||isRoot(r))return;const rt=roots.get((r[W.root]||'').trim());if(!rt)return;rt.fatOB+=num(r[W.fatBruto]);rt.liq+=num(r[W.fatLiq]);rt.nOB++});
 return [...roots.values()].map(s=>(s.fatTotal=s.fatPrincipal+s.fatOB,s.temOB=s.nOB>0,s.trafego=isTrafego(s),s)).sort((a,b)=>b.data.localeCompare(a.data))}
async function loadData(){
 const ov=document.getElementById('loading-overlay');ov.style.display='flex';
 try{document.getElementById('loading-msg').textContent='Carregando Gerenciador...';
  GROWS=processGerenciador(csv(await fetchSheetCSV(CONFIG.GERENCIADOR_SHEET)));
  document.getElementById('loading-msg').textContent='Carregando vendas...';
  SALES=processSales(csv(await fetchSheetCSV(CONFIG.WEBHOOK_SHEET)));
  initDates();render();ov.style.display='none'}
 catch(e){document.getElementById('loading-msg').innerHTML='<span style="color:#e74c3c">'+e.message+'</span>'}}
// ── filtros ──
function allDates(){return [...GROWS.map(g=>g.data),...SALES.map(s=>s.data),...Object.values(CONFIG.INV_META).flatMap(o=>Object.keys(o))].filter(Boolean).sort()}
function initDates(){const a=allDates();document.getElementById('dateFrom').value=FROM=a[0]||'';document.getElementById('dateTo').value=TO=a[a.length-1]||''}
function setPreset(days,btn){document.querySelectorAll('.period-bar .preset-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');
 const a=allDates(),first=a[0],last=a[a.length-1];let f=first;
 if(days!=='all'){const d=new Date(last+'T00:00:00');d.setDate(d.getDate()-days+1);f=d.toISOString().slice(0,10);if(f<first)f=first}
 document.getElementById('dateFrom').value=FROM=f;document.getElementById('dateTo').value=TO=last;render()}
function onDateChange(){FROM=document.getElementById('dateFrom').value;TO=document.getElementById('dateTo').value;document.querySelectorAll('.period-bar .preset-btn').forEach(b=>b.classList.remove('active'));render()}
function setSeg(s,btn){SEG=s;document.querySelectorAll('.segbar [data-seg]').forEach(b=>b.classList.toggle('active',b===btn));render()}
function onFx(){FX=+document.getElementById('fx').value||CONFIG.FX_USD;render()}
function showTab(id,el){document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
const inR=d=>(!FROM||d>=FROM)&&(!TO||d<=TO),inS=s=>SEG==='all'||s===SEG;
const fSales=()=>SALES.filter(s=>inR(s.data)&&inS(s.seg));
const fG=()=>GROWS.filter(g=>inR(g.data)&&inS(g.seg));
function spendMap(){const m={};(SEG==='all'?['d','f','e']:[SEG]).forEach(sg=>{const rows=GROWS.filter(g=>g.seg===sg),have=new Set(rows.map(g=>g.data));
 rows.forEach(g=>m[g.data]=(m[g.data]||0)+g.inv);Object.entries(CONFIG.INV_META[sg]||{}).forEach(([d,v])=>{if(!have.has(d))m[d]=(m[d]||0)+v})});
 Object.keys(m).forEach(d=>{if(!inR(d))delete m[d]});return m}
function agg(ss){const a={nT:0,nO:0,obT:0,obO:0,fT:0,fO:0,fobT:0,fobO:0,liq:0,gU:0};
 ss.forEach(s=>{const f=brl(s.fatTotal,s.cur),fo=brl(s.fatOB,s.cur);a.liq+=brl(s.liq,s.cur);if(s.cur!=='BRL')a.gU+=s.fatTotal;
  if(s.trafego){a.nT++;a.obT+=s.nOB;a.fT+=f;a.fobT+=fo}else{a.nO++;a.obO+=s.nOB;a.fO+=f;a.fobO+=fo}});return a}
function days(){const sm=spendMap(),ss=fSales(),ds=new Set([...Object.keys(sm),...ss.map(s=>s.data)]);
 return [...ds].sort().map(d=>{const a=agg(ss.filter(s=>s.data===d));a.data=d;a.inv=sm[d]||0;const gg=fG().filter(g=>g.data===d);a.cliques=gg.reduce((x,g)=>x+g.cliques,0);a.imp=gg.reduce((x,g)=>x+g.imp,0);a.invG=gg.reduce((x,g)=>x+g.inv,0);return a})}
function sum(ds){const t={inv:0,nT:0,nO:0,obT:0,obO:0,fT:0,fO:0,fobT:0,fobO:0,liq:0,gU:0,cliques:0,imp:0,invG:0};ds.forEach(d=>{for(const k in t)t[k]+=d[k]||0});return t}
const kpi=(l,v,c,sub)=>`<div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-value ${c||''}">${v}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
function chart(id,type,labels,sets){const el=document.getElementById(id);if(!el)return;if(CH[id])CH[id].destroy();
 CH[id]=new Chart(el,{type,data:{labels,datasets:sets},options:{responsive:true,plugins:{legend:{labels:{color:'rgba(255,255,255,.6)',font:{size:10}}}},scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}}}}})}
const OR='rgba(255,107,43,0.85)',YE='rgba(255,183,55,0.85)';
// ── render ──
function render(){
 if(!SALES.length&&!GROWS.length)return;
 const ds=days(),t=sum(ds),ss=fSales();
 document.getElementById('range-info').textContent=dbr(FROM)+' → '+dbr(TO)+' · '+ds.length+' dias';
 const fat=t.fT+t.fO,nV=t.nT+t.nO,fobT=t.fobT+t.fobO;
 const fatSub=t.gU?`inclui ${U(t.gU)} (×${FX.toFixed(2)})`:'';
 // TRÁFEGO
 const g=fG(),cl=t.cliques,imp=t.imp,pv=g.reduce((x,r)=>x+r.pv,0),ck=g.reduce((x,r)=>x+r.ck,0);
 const buyers=ss.slice(0,60).map(s=>`<div class="buyer"><b>${s.trafego?'✅':'⭐'} ${s.nome||'—'}</b> <span style="float:right">${SEGN[s.seg]}</span><br><span class="v">${s.cur==='BRL'?R(s.fatTotal):U(s.fatTotal)}</span> · ${dbr(s.data)}${s.temOB?`<br>🛒 OB: ${s.cur==='BRL'?R(s.fatOB):U(s.fatOB)}`:''}<br>Criativo: ${s.utmContent||'—'}<br>Público: ${s.utmMedium||'—'}<br>Origem: ${s.utmSource||'orgânico'}</div>`).join('');
 document.getElementById('trafego').innerHTML=`<div class="kpi-grid">
 ${kpi('Investimento',R(t.inv),'orange')}${kpi('Fat. Tráfego',R(t.fT),'green',fatSub)}${kpi('Fat. Orgânico',R(t.fO))}${kpi('ROAS Tráfego',X(t.fT/t.inv),t.fT/t.inv>=1?'green':'red')}
 ${kpi('Vendas Tráfego',t.nT+(t.obT?` <span style="font-size:12px;color:#ff6b2b">+${t.obT} OB</span>`:''))}${kpi('Vendas Orgânico',t.nO+(t.obO?` <span style="font-size:12px;color:#ff6b2b">+${t.obO} OB</span>`:''))}
 ${kpi('Fat. OB Tráfego',R(t.fobT))}${kpi('Fat. OB Orgânico',R(t.fobO))}${kpi('CAC',R(t.inv/t.nT))}${kpi('Ticket Médio',R(fat/nV))}
 ${kpi('Cliques',I(cl))}${kpi('Impressões',I(imp))}${kpi('CPC',R(t.invG/cl))}${kpi('CPM',R(t.invG/imp*1000))}</div>
 <div class="ob-info">✅ tráfego pago (meta_ads) · ⭐ orgânico · Faturamento bruto sem impostos; vendas em US$ convertidas pelo câmbio do topo. Cliques/Impressões/Funil vêm do Gerenciador (aba atualizada até ${dbr(GROWS.map(x=>x.data).sort().pop())}).</div>
 <div class="sec-title">Funil</div><div class="funil-section"><div>${[['Cliques',cl],['Page Views',pv],['Checkouts',ck],['Compras (tráfego)',t.nT]].map(([n,v])=>`<div class="funil-bar-wrap"><div class="funil-label"><span>${n}</span><span>${I(v)}</span></div><div class="funil-bar-bg"><div class="funil-bar-fill" style="width:${cl?Math.min(100,v/cl*100):0}%"></div></div></div>`).join('')}</div>
 <div class="taxa-grid"><div class="taxa-item">Clique → PV<span class="taxa-val">${P(pv/cl*100)}</span></div><div class="taxa-item">PV → Checkout<span class="taxa-val">${P(ck/pv*100)}</span></div><div class="taxa-item">Checkout → Compra<span class="taxa-val">${P(t.nT/ck*100)}</span></div><div class="taxa-item">CTR<span class="taxa-val">${P(cl/imp*100)}</span></div></div></div>
 <div class="sec-title">Últimas vendas</div><div class="buyers">${buyers||'<span style="color:#888">Sem vendas no período</span>'}</div>
 <div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento × Fat. Tráfego</h4><canvas id="c1"></canvas></div><div class="chart-card"><h4>Vendas por dia</h4><canvas id="c2"></canvas></div></div>`;
 const lb=ds.map(d=>dbr(d.data).slice(0,5));
 chart('c1','bar',lb,[{label:'Investimento',data:ds.map(d=>d.inv),backgroundColor:OR},{label:'Fat. Tráfego',data:ds.map(d=>d.fT),backgroundColor:YE}]);
 chart('c2','bar',lb,[{label:'Tráfego',data:ds.map(d=>d.nT),backgroundColor:OR},{label:'Orgânico',data:ds.map(d=>d.nO),backgroundColor:YE}]);
 // VISÃO GERAL
 document.getElementById('visao').innerHTML=`<div class="kpi-grid">${kpi('Investimento',R(t.inv),'orange')}${kpi('Fat. Total',R(fat),'green',fatSub)}${kpi('Fat. Líquido',R(t.liq))}${kpi('ROAS Total',X(fat/t.inv),fat/t.inv>=1?'green':'red')}${kpi('Vendas Total',nV)}${kpi('Tráfego',t.nT)}${kpi('Orgânicas',t.nO)}${kpi('Order Bumps',t.obT+t.obO)}${kpi('Ticket Médio',R(fat/nV))}${kpi('CAC Total',R(t.inv/nV))}${kpi('Resultado (líq − inv)',R(t.liq-t.inv),t.liq-t.inv>=0?'green':'red')}</div>
 <div class="tbl-wrap"><table><tr><th>Data</th><th>Invest.</th><th>Fat. Total</th><th>ROAS</th><th>Compras Total</th><th>Tráfego</th><th>Orgânicas</th><th>Ticket Médio</th><th>CAC</th></tr>${ds.slice().reverse().map(d=>{const f=d.fT+d.fO,n=d.nT+d.nO;return `<tr><td>${dbr(d.data)}</td><td>${R(d.inv)}</td><td>${R(f)}</td><td>${X(f/d.inv)}</td><td>${n||'—'}</td><td>${d.nT||'—'}</td><td>${d.nO||'—'}</td><td>${R(f/n)}</td><td>${R(d.inv/n)}</td></tr>`}).join('')}</table></div>`;
 renderCri();renderPub();
 const per=(key)=>{const m={};ds.forEach(d=>{const k=key(d.data);(m[k]=m[k]||[]).push(d)});return Object.entries(m).sort().map(([k,v])=>[k,sum(v)])};
 const tbl=(rows,fmt)=>`<div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento × Faturamento</h4><canvas id="${fmt}1"></canvas></div><div class="chart-card"><h4>Vendas</h4><canvas id="${fmt}2"></canvas></div></div><div class="tbl-wrap"><table><tr><th>Período</th><th>Invest.</th><th>Fat. Total</th><th>ROAS</th><th>Vendas</th><th>Tráfego</th><th>Orgânicas</th><th>CAC</th><th>Cliques</th><th>CTR</th></tr>${rows.slice().reverse().map(([k,v])=>{const f=v.fT+v.fO,n=v.nT+v.nO;return `<tr><td>${k}</td><td>${R(v.inv)}</td><td>${R(f)}</td><td>${X(f/v.inv)}</td><td>${n||'—'}</td><td>${v.nT||'—'}</td><td>${v.nO||'—'}</td><td>${R(v.inv/n)}</td><td>${I(v.cliques)}</td><td>${P(v.cliques/v.imp*100)}</td></tr>`}).join('')}</table></div>`;
 const wk=per(d=>{const x=new Date(d+'T00:00:00'),dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x.toISOString().slice(0,10)}).map(([k,v])=>['Sem. '+dbr(k).slice(0,5),v]);
 const mo=per(d=>d.slice(0,7)).map(([k,v])=>[k.split('-').reverse().join('/'),v]);
 document.getElementById('semanal').innerHTML=tbl(wk,'w');document.getElementById('mensal').innerHTML=tbl(mo,'m');
 [['w',wk],['m',mo]].forEach(([p,r])=>{chart(p+'1','bar',r.map(x=>x[0]),[{label:'Investimento',data:r.map(x=>x[1].inv),backgroundColor:OR},{label:'Faturamento',data:r.map(x=>x[1].fT+x[1].fO),backgroundColor:YE}]);chart(p+'2','bar',r.map(x=>x[0]),[{label:'Tráfego',data:r.map(x=>x[1].nT),backgroundColor:OR},{label:'Orgânico',data:r.map(x=>x[1].nO),backgroundColor:YE}])})}
// ── Criativos / Públicos (recalculam do zero a cada filtro) ──
function buildCriPubMaps(from,to){
 const build=(gk,sk)=>{const m={};GROWS.filter(g=>(!from||g.data>=from)&&(!to||g.data<=to)&&inS(g.seg)).forEach(r=>{const k=r[gk]||'(sem nome)';const o=m[k]||(m[k]={nome:k,inv:0,imp:0,cliques:0,pv:0,ck:0,ativo:false,link:'',fat:0,n:0,ob:0});o.inv+=r.inv;o.imp+=r.imp;o.cliques+=r.cliques;o.pv+=r.pv;o.ck+=r.ck;if(r.ativo)o.ativo=true;if(r.link)o.link=r.link});
  SALES.filter(s=>(!from||s.data>=from)&&(!to||s.data<=to)&&inS(s.seg)&&s.trafego).forEach(s=>{const k=s[sk];if(!k)return;const o=m[k]||(m[k]={nome:k,inv:0,imp:0,cliques:0,pv:0,ck:0,ativo:false,link:'',fat:0,n:0,ob:0});o.fat+=brl(s.fatTotal,s.cur);o.n++;o.ob+=s.nOB});
  return Object.values(m)};
 return {cri:build('ad','utmContent'),pub:build('adset','utmMedium')}}
const sorter=k=>({inv:(a,b)=>b.inv-a.inv,ctr:(a,b)=>b.cliques/(b.imp||1)-a.cliques/(a.imp||1),cpc:(a,b)=>(a.cliques?a.inv/a.cliques:1e9)-(b.cliques?b.inv/b.cliques:1e9),roas:(a,b)=>(b.inv?b.fat/b.inv:0)-(a.inv?a.fat/a.inv:0),vendas:(a,b)=>b.n-a.n})[k];
function setCri(k,v){if(k==='f')CRI_F=v;else CRI_S=v;renderCri()}function setPub(k,v){if(k==='f')PUB_F=v;else PUB_S=v;renderPub()}
function bar(prefix,fn,F,S,opts){return `<div class="cri-filterbar">${['all:Todos','on:Ativos','off:Inativos'].map(x=>{const[a,b]=x.split(':');return `<button class="cri-filter-btn ${F===a?'active':''}" onclick="${fn}('f','${a}')">${b}</button>`}).join('')}<span class="cri-sort-label">Ordenar:</span>${opts.map(x=>{const[a,b]=x.split(':');return `<button class="cri-sort-btn ${S===a?'active':''}" onclick="${fn}('s','${a}')">${b}</button>`}).join('')}</div>`}
function listView(id,items,F,S,fn,title,opts){
 let l=items.filter(x=>F==='all'||(F==='on')===x.ativo).sort(sorter(S));
 document.getElementById(id).innerHTML=bar(id,fn,F,S,opts)+`<div class="sec-title">${title}</div><div class="cri-grid">${l.slice(0,30).map(c=>`<div class="cri-card ${c.ativo?'ativo':''}"><div class="cri-card-header"><div class="cri-name">${c.nome}</div><span class="cri-badge ${c.ativo?'ativo':'inativo'}">${c.ativo?'Ativo':'Inativo'}</span></div><div class="cri-metrics"><div class="cri-metric"><span class="cri-metric-label">Invest.</span><span class="cri-metric-val hl">${R(c.inv)}</span></div><div class="cri-metric"><span class="cri-metric-label">ROAS</span><span class="cri-metric-val hl">${X(c.fat/c.inv)}</span></div><div class="cri-metric"><span class="cri-metric-label">Vendas</span><span class="cri-metric-val">${c.n||'—'}${c.ob?' +'+c.ob+' OB':''}</span></div><div class="cri-metric"><span class="cri-metric-label">CAC</span><span class="cri-metric-val">${R(c.inv/c.n)}</span></div><div class="cri-metric"><span class="cri-metric-label">CTR</span><span class="cri-metric-val">${P(c.cliques/c.imp*100)}</span></div><div class="cri-metric"><span class="cri-metric-label">CPC</span><span class="cri-metric-val">${R(c.inv/c.cliques)}</span></div></div>${c.link?`<a class="cri-link" href="${c.link}" target="_blank">${c.link}</a>`:''}</div>`).join('')||'<span style="color:#888">Sem dados</span>'}</div>
 <div class="tbl-wrap"><table><tr><th>Nome</th><th>Invest.</th><th>Fat. Tráfego</th><th>ROAS</th><th>Vendas</th><th>CAC</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Impr.</th></tr>${l.map(c=>`<tr><td>${c.nome}</td><td>${R(c.inv)}</td><td>${R(c.fat)}</td><td>${X(c.fat/c.inv)}</td><td>${c.n||'—'}</td><td>${R(c.inv/c.n)}</td><td>${I(c.cliques)}</td><td>${P(c.cliques/c.imp*100)}</td><td>${R(c.inv/c.cliques)}</td><td>${I(c.imp)}</td></tr>`).join('')}</table></div>`}
function renderCri(){if(!GROWS.length)return;listView('criativos',buildCriPubMaps(FROM,TO).cri,CRI_F,CRI_S,'setCri','Criativos (anúncios)',['inv:Investimento','ctr:CTR','cpc:CPC','roas:ROAS','vendas:Vendas'])}
function renderPub(){if(!GROWS.length)return;listView('publicos',buildCriPubMaps(FROM,TO).pub,PUB_F,PUB_S,'setPub','Públicos (conjuntos)',['inv:Investimento','ctr:CTR','cpc:CPC','roas:ROAS','vendas:Vendas'])}
loadData();
</script></body></html>
