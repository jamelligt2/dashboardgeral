<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Captação — Luciana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a2e'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='22' font-weight='bold' fill='%23ff6b35' text-anchor='middle'%3EJGT%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1e1e35;
    --border: #262640;
    --laranja: #ff6b35;
    --laranja-dark: #e04e1c;
    --verde: #00c853;
    --vermelho: #ff1744;
    --amarelo: #ffd600;
    --azul: #42a5f5;
    --texto: #ffffff;
    --apagado: #8888a0;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 60px; }

  .header {
    background: #16213e;
    border-bottom: 2px solid var(--laranja);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .logo-badge {
    background: linear-gradient(135deg, var(--laranja), var(--laranja-dark));
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    padding: 10px 14px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .header-divider { width: 1px; height: 40px; background: var(--border); flex-shrink: 0; }
  .header-text { flex: 1; min-width: 220px; }
  .header-text h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .header-text p { margin: 0; color: var(--apagado); font-size: 13px; }

  .live-box { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--apagado); }
  .live-row { display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 6px var(--verde); flex-shrink: 0; }
  .live-dot.loading { background: var(--amarelo); box-shadow: 0 0 6px var(--amarelo); animation: pulse 1s infinite; }
  .live-dot.err { background: var(--vermelho); box-shadow: 0 0 6px var(--vermelho); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .btn-refresh {
    background: var(--card); border: 1px solid var(--border); color: var(--texto);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .btn-refresh:hover { border-color: var(--laranja); color: var(--laranja); }
  .btn-refresh:disabled { opacity: .5; cursor: default; }

  .filter-bar {
    background: #16213e;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-bar label { font-size: 11px; color: var(--apagado); text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; }
  .filter-bar input[type=date] {
    background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: 7px 10px; border-radius: 7px; font-size: 13px; color-scheme: dark;
  }
  .filter-bar input[type=date]:focus { outline: none; border-color: var(--laranja); }
  .preset-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--apagado);
    padding: 7px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .preset-btn:hover { color: #fff; }
  .preset-btn.active { color: #fff; background: var(--laranja); border-color: var(--laranja); }
  .filter-range-label { font-size: 12px; color: var(--apagado); margin-left: auto; }

  .tabs {
    display: flex;
    gap: 4px;
    background: #16213e;
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--apagado);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    border-radius: 6px;
    transition: all .15s;
  }
  .tab-btn:hover { color: #fff; }
  .tab-btn.active { color: var(--laranja); border-bottom: 3px solid var(--laranja); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .section-title {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--apagado);
    margin: 32px 0 14px;
    font-weight: 700;
  }
  .section-title:first-child { margin-top: 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .kpi-label { color: var(--apagado); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 800; }
  .kpi-sub { color: var(--apagado); font-size: 12px; margin-top: 6px; }

  .temp-grid { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 14px; align-items: stretch; }
  .temp-card {
    border-radius: 14px;
    padding: 20px;
    border: 2px solid;
  }
  .temp-card.quente { border-color: #ff1744; background: #2a0a0a; }
  .temp-card.frio { border-color: #42a5f5; background: #061428; }
  .temp-card h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: .5px; }
  .temp-card .sub { color: var(--apagado); font-size: 12px; margin-bottom: 14px; }
  .temp-metrics { display: flex; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .temp-metric .val { font-size: 22px; font-weight: 800; }
  .temp-metric .lbl { font-size: 11px; color: var(--apagado); text-transform: uppercase; }
  .temp-detail { font-size: 12.5px; color: #cfcfe0; border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; }
  .temp-detail div { display: flex; justify-content: space-between; padding: 3px 0; gap: 10px; }

  .compare-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }
  .compare-card h3 { margin: 0; font-size: 13px; color: var(--apagado); text-transform: uppercase; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .bar-track { flex: 1; height: 10px; background: #262640; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .compare-stat { font-size: 13px; color: #cfcfe0; }
  .compare-stat b { color: var(--laranja); }

  .funnel-section { display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap; }
  .funnel-svg-wrap { flex: 0 0 52%; max-width: 52%; }
  .funnel-metrics-row { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 12px; }
  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .metric-card .lbl { font-size: 12px; color: var(--apagado); text-transform: uppercase; margin-bottom: 8px; }
  .metric-card .val { font-size: 26px; font-weight: 800; }
  .metric-card .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; border-radius: 0 0 12px 12px; }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-top: 16px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; }
  th { text-align: left; background: #16213e; color: var(--apagado); text-transform: uppercase; font-size: 11px; letter-spacing: .5px; padding: 10px 12px; white-space: nowrap; }
  td { padding: 9px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .total-row td { background: rgba(255,107,53,.12); font-weight: 800; color: var(--laranja); }
  a { color: var(--azul); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .temp-tag { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .temp-tag.quente { background: rgba(255,23,68,.18); color: #ff5c7a; }
  .temp-tag.frio { background: rgba(66,165,245,.18); color: var(--azul); }

  .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .profile-card h4 { margin: 0 0 12px; font-size: 12.5px; color: var(--apagado); text-transform: uppercase; letter-spacing: .5px; }
  .profile-item { margin-bottom: 10px; }
  .profile-item .top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
  .profile-item .top b { color: #fff; }
  .profile-bar { height: 7px; background: #262640; border-radius: 4px; overflow: hidden; }
  .profile-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--laranja-dark), var(--laranja)); }
  .info-note { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--laranja); border-radius: 8px; padding: 12px 16px; font-size: 12.5px; color: #cfcfe0; margin-top: 14px; }
  .info-note.err { border-left-color: var(--vermelho); color: #ffb3bd; }

  .search-box { margin-bottom: 14px; }
  .search-box input {
    width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border);
    color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px;
  }
  .search-box input::placeholder { color: var(--apagado); }
  .search-box input:focus { outline: none; border-color: var(--laranja); }

  .skeleton { color: var(--apagado); font-size: 13px; padding: 30px; text-align: center; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .temp-grid { grid-template-columns: 1fr; }
    .funnel-svg-wrap { flex: 0 0 100%; max-width: 100%; }
    .profile-grid { grid-template-columns: 1fr; }
    .live-box { align-items: flex-start; }
    .filter-range-label { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo-badge">JGT</div>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1>DASHBOARD CAPTAÇÃO — LUCIANA · FORMULÁRIO ENFERMEIRAS</h1>
    <p>FORM001 · dados ao vivo da planilha · atualização automática a cada hora</p>
  </div>
  <div class="live-box">
    <div class="live-row">
      <span class="live-dot" id="liveDot"></span>
      <span id="liveStatus">carregando…</span>
      <button class="btn-refresh" id="btnRefresh">Atualizar agora</button>
    </div>
    <div id="liveUpdated"></div>
  </div>
</div>

<div class="wrap">
  <div class="filter-bar">
    <label>De</label>
    <input type="date" id="dateFrom">
    <label>Até</label>
    <input type="date" id="dateTo">
    <button class="preset-btn" data-preset="7">7 dias</button>
    <button class="preset-btn" data-preset="30">30 dias</button>
    <button class="preset-btn" data-preset="all">Todo período</button>
    <span class="filter-range-label" id="filterRangeLabel"></span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="visao-geral">Visão Geral</button>
    <button class="tab-btn" data-tab="criativos">Criativos</button>
    <button class="tab-btn" data-tab="publicos">Públicos</button>
    <button class="tab-btn" data-tab="analise-diaria">Análise Diária</button>
    <button class="tab-btn" data-tab="leads">Leads</button>
  </div>

  <div id="appRoot">
    <div class="skeleton">Carregando dados da planilha…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================= CONFIG =============================
  var SHEET_ID = '17zfdmip3LQ7PT_t-yhpBFq8Vbw-YmTQk93vGlySGp8Y';
  var REFRESH_MS = 60 * 60 * 1000; // 1 hora

  var P1_ORDER = [
    { v: '8_anos_ou_mais', label: '8 anos ou mais' },
    { v: '3_a_7_anos', label: '3 a 7 anos' },
    { v: 'menos_de_3_anos', label: 'Menos de 3 anos' }
  ];
  var P2_ORDER = [
    { v: 'só_por_plantão/clt', label: 'Só plantão / CLT' },
    { v: 'atendo_avulso,_mas_sem_estrutura_de_negócio', label: 'Atende avulso, sem estrutura' },
    { v: 'já_tenho_algo_estruturado,_mas_quero_crescer', label: 'Já estruturado, quer crescer' }
  ];
  var P3_ORDER = [
    { v: 'tenho_disponível_e_pronta_pra_decidir_agora', label: 'Pronta pra decidir agora' },
    { v: 'estou_me_organizando,_mas_é_questão_de_tempo_curto', label: 'Se organizando (curto prazo)' },
    { v: 'ainda_não_tenho_previsão', label: 'Ainda sem previsão' }
  ];

  // ============================= STATE =============================
  var state = {
    metaRows: [],
    leadRows: [],
    minDate: null,
    maxDate: null,
    filterFrom: null,
    filterTo: null,
    dailyChart: null,
    loading: false
  };

  // ============================= HELPERS =============================
  function fmtBRL(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    var neg = v < 0; v = Math.abs(v);
    var fixed = v.toFixed(2);
    var parts = fixed.split('.');
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + 'R$ ' + intPart + ',' + parts[1];
  }
  function fmtInt(v) {
    return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function fmtPct(v, dec) {
    if (dec === undefined) dec = 2;
    if (v === null || v === undefined || isNaN(v)) return '—';
    return v.toFixed(dec).replace('.', ',') + '%';
  }
  function fmtCPL(leads, cpl) { return leads > 0 ? fmtBRL(cpl) : '—'; }
  function fmtCPC(clicks, cpc) { return clicks > 0 ? fmtBRL(cpc) : '—'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ============================= GVIZ TABLE -> STRING ROWS =============================
  // Each cell becomes the same kind of plain string our parsers already expect
  // (the sheet's own formatted display, e.g. "R$ 1.435,81", "13/07/2026", "31").
  function cellStr(cell) {
    if (!cell) return '';
    if (cell.f !== undefined && cell.f !== null) return cell.f;
    if (cell.v === undefined || cell.v === null) return '';
    return String(cell.v);
  }
  function tableToRows(json) {
    var rows = (json && json.table && json.table.rows) || [];
    return rows.map(function (row) {
      var cells = (row && row.c) || [];
      var out = [];
      for (var i = 0; i < cells.length; i++) out.push(cellStr(cells[i]));
      return out;
    });
  }

  function parseCurrencyBR(s) {
    if (!s) return 0;
    var t = String(s).replace('R$', '').trim();
    if (t === '') return 0;
    t = t.replace(/\./g, '').replace(',', '.');
    var v = parseFloat(t);
    return isNaN(v) ? 0 : v;
  }
  function parseIntSafe(s) {
    if (!s) return 0;
    var v = parseInt(String(s).trim(), 10);
    return isNaN(v) ? 0 : v;
  }
  function brDateToISO(s) {
    var m = String(s).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    return m[3] + '-' + m[2] + '-' + m[1];
  }
  function isoToBR(iso) {
    var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
  }
  function isoToDM(iso) {
    var p = iso.split('-'); return p[2] + '/' + p[1];
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function localISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayLocalISO() { return localISO(new Date()); }
  function isoAddDays(iso, days) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + days);
    return localISO(d);
  }

  function parseMetaRows(csvRows) {
    var out = [];
    for (var i = 0; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (!r || !r[0]) continue;
      var dateISO = brDateToISO(r[0]);
      if (!dateISO) continue;
      out.push({
        dateISO: dateISO,
        adset: (r[2] || '').trim(),
        ad: (r[3] || '').trim(),
        link: r[4] || '',
        spend: parseCurrencyBR(r[5]),
        clicks: parseIntSafe(r[6]),
        impr: parseIntSafe(r[8]),
        leads: parseIntSafe(r[9])
      });
    }
    return out;
  }
  function classifyTemp(adsetName) { return /engajamento/i.test(adsetName) ? 'quente' : 'frio'; }

  function parseLeadRows(csvRows) {
    var out = [];
    for (var i = 0; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (!r || !r[0]) continue;
      var nome = (r[1] || '').trim();
      if (nome.toLowerCase().indexOf('<test lead') === 0) continue;
      var dataISO = r[0];
      var dateOnly = dataISO.slice(0, 10);
      var hhmm = dataISO.length >= 16 ? dataISO.slice(11, 16) : '';
      out.push({
        dataISO: dataISO, dateOnly: dateOnly, hhmm: hhmm, nome: nome,
        telefone: (r[2] || '').trim(),
        p1: (r[3] || '').trim(), p2: (r[4] || '').trim(), p3: (r[5] || '').trim()
      });
    }
    return out;
  }
  function fmtPhone(telRaw) {
    var t = String(telRaw || '').replace(/\D/g, '');
    if (t.length === 13 && t.indexOf('55') === 0) return '+55 (' + t.slice(2,4) + ') ' + t.slice(4,9) + '-' + t.slice(9,13);
    if (t.length === 12 && t.indexOf('55') === 0) return '+55 (' + t.slice(2,4) + ') ' + t.slice(4,8) + '-' + t.slice(8,12);
    if (t.length === 11) return '+55 (' + t.slice(0,2) + ') ' + t.slice(2,7) + '-' + t.slice(7,11);
    if (t.length === 10) return '+55 (' + t.slice(0,2) + ') ' + t.slice(2,6) + '-' + t.slice(6,10);
    return telRaw || '—';
  }

  // ============================= AGGREGATION =============================
  function agg(rows) {
    var inv = 0, clk = 0, imp = 0, lds = 0;
    for (var i = 0; i < rows.length; i++) { inv += rows[i].spend; clk += rows[i].clicks; imp += rows[i].impr; lds += rows[i].leads; }
    var ctr = imp ? (clk / imp * 100) : 0;
    var cpc = clk ? (inv / clk) : 0;
    var cpm = imp ? (inv / imp * 1000) : 0;
    var cpl = lds ? (inv / lds) : 0;
    var txconv = clk ? (lds / clk * 100) : 0;
    return { invest: inv, clicks: clk, impr: imp, leads: lds, ctr: ctr, cpc: cpc, cpm: cpm, cpl: cpl, txconv: txconv };
  }
  function groupBy(rows, keyFn) {
    var m = {}, order = [];
    for (var i = 0; i < rows.length; i++) {
      var k = keyFn(rows[i]);
      if (!m[k]) { m[k] = []; order.push(k); }
      m[k].push(rows[i]);
    }
    return { map: m, keys: order };
  }
  function cplSortAsc(a, b) {
    var av = a.leads > 0 ? a.cpl : Infinity;
    var bv = b.leads > 0 ? b.cpl : Infinity;
    return av - bv;
  }

  // ============================= DATA FETCH (JSONP — não sofre bloqueio de CORS) =============================
  var jsonpSeq = 0;
  function fetchJSONP(url) {
    return new Promise(function (resolve, reject) {
      jsonpSeq++;
      var cbName = '__gvizCb_' + Date.now() + '_' + jsonpSeq;
      var script = document.createElement('script');
      var done = false;
      var timeoutId = setTimeout(function () {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('tempo esgotado ao carregar a planilha'));
      }, 20000);
      function cleanup() {
        clearTimeout(timeoutId);
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function (data) {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };
      script.onerror = function () {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('falha de rede ao carregar a planilha'));
      };
      var full = url + (url.indexOf('?') === -1 ? '?' : '&') + 'tqx=out:json;responseHandler:' + cbName + '&_=' + Date.now();
      script.src = full;
      document.head.appendChild(script);
    });
  }
  function loadTable(sheetName) {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(sheetName);
    return fetchJSONP(url).then(function (json) {
      if (!json || json.status === 'error') {
        var msg = (json && json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || 'erro ao ler a aba ' + sheetName;
        throw new Error(msg);
      }
      return tableToRows(json);
    });
  }

  function loadData() {
    setLive('loading', 'atualizando…');
    document.getElementById('btnRefresh').disabled = true;
    return Promise.all([loadTable('Meta_Ads'), loadTable('LD COMPLETO')]).then(function (r) {
      var metaRows = parseMetaRows(r[0]);
      var leadRows = parseLeadRows(r[1]);
      if (metaRows.length === 0) throw new Error('planilha vazia');
      state.metaRows = metaRows;
      state.leadRows = leadRows;
      var dates = metaRows.map(function (r) { return r.dateISO; }).sort();
      state.minDate = dates[0];
      state.maxDate = dates[dates.length - 1];
      if (!state.filterFrom || !state.filterTo || state.presetAll) {
        state.filterFrom = state.minDate;
        state.filterTo = state.maxDate;
      } else {
        if (state.filterTo > state.maxDate) state.filterTo = state.maxDate;
      }
      document.getElementById('dateFrom').min = state.minDate;
      document.getElementById('dateFrom').max = state.maxDate;
      document.getElementById('dateTo').min = state.minDate;
      document.getElementById('dateTo').max = state.maxDate;
      document.getElementById('dateFrom').value = state.filterFrom;
      document.getElementById('dateTo').value = state.filterTo;
      setLive('ok', 'ao vivo');
      var now = new Date();
      document.getElementById('liveUpdated').textContent = 'Última atualização: ' + now.toLocaleTimeString('pt-BR');
      render();
    }).catch(function (err) {
      console.error(err);
      var reason = (err && err.message) ? err.message : 'erro desconhecido';
      var hasData = state.metaRows.length > 0;
      setLive('err', 'falha ao atualizar: ' + reason + (hasData ? ' (dados anteriores mantidos)' : ''));
    }).finally(function () {
      document.getElementById('btnRefresh').disabled = false;
    });
  }

  function setLive(kind, text) {
    var dot = document.getElementById('liveDot');
    dot.className = 'live-dot' + (kind === 'loading' ? ' loading' : kind === 'err' ? ' err' : '');
    document.getElementById('liveStatus').textContent = text;
  }

  // ============================= RENDER =============================
  function getFiltered() {
    var f = state.filterFrom, t = state.filterTo;
    var meta = state.metaRows.filter(function (r) { return r.dateISO >= f && r.dateISO <= t; });
    var leads = state.leadRows.filter(function (r) { return r.dateOnly >= f && r.dateOnly <= t; });
    return { meta: meta, leads: leads };
  }

  function render() {
    var filt = getFiltered();
    var meta = filt.meta, leadsF = filt.leads;

    document.getElementById('filterRangeLabel').textContent =
      'Exibindo ' + isoToBR(state.filterFrom) + ' a ' + isoToBR(state.filterTo) +
      ' · ' + meta.length + ' linhas de mídia · ' + leadsF.length + ' leads';

    var root = document.getElementById('appRoot');
    if (!root.querySelector('.tab-content')) {
      root.innerHTML = buildSkeleton();
      bindTabs();
      document.getElementById('leadSearch').addEventListener('input', applyLeadSearch);
    }

    renderVisaoGeral(meta, leadsF);
    renderCriativos(meta);
    renderPublicos(meta);
    renderAnaliseDiaria(meta);
    renderLeads(leadsF);
  }

  function buildSkeleton() {
    return '' +
    '<div class="tab-content active" id="visao-geral"></div>' +
    '<div class="tab-content" id="criativos"></div>' +
    '<div class="tab-content" id="publicos"></div>' +
    '<div class="tab-content" id="analise-diaria"></div>' +
    '<div class="tab-content" id="leads">' +
    '  <div class="section-title">Leads do Formulário — Nome e Telefone</div>' +
    '  <div class="info-note" id="leadsInfoNote"></div>' +
    '  <div class="search-box" style="margin-top:14px"><input type="text" id="leadSearch" placeholder="Buscar por nome ou telefone..."></div>' +
    '  <div class="table-wrap"><table id="leadsTable"><thead><tr><th>Data</th><th>Nome</th><th>Telefone</th></tr></thead><tbody></tbody></table></div>' +
    '</div>';
  }

  function bindTabs() {
    var btns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) {
        var btn = e.currentTarget;
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    }
  }

  // ---------- VISAO GERAL ----------
  function renderVisaoGeral(meta, leadsF) {
    var total = agg(meta);
    var quenteRows = meta.filter(function (r) { return classifyTemp(r.adset) === 'quente'; });
    var frioRows = meta.filter(function (r) { return classifyTemp(r.adset) === 'frio'; });
    var quente = agg(quenteRows), frio = agg(frioRows);

    var qDetail = detailBreakdown(quenteRows, function (r) { return r.ad; });
    var fDetail = detailBreakdown(frioRows, function (r) { return r.adset; });

    var totalLeadsQF = quente.leads + frio.leads;
    var pctQ = totalLeadsQF ? (quente.leads / totalLeadsQF * 100) : 0;
    var pctF = totalLeadsQF ? (frio.leads / totalLeadsQF * 100) : 0;
    var cplDiff = (quente.leads > 0 && frio.leads > 0 && quente.cpl > 0) ? ((quente.cpl - frio.cpl) / quente.cpl * 100) : null;

    // Leads reais (formulário instantâneo) — a aba LD COMPLETO é a contagem verdadeira de
    // envios, já que essa campanha não tem captação orgânica. Usada no KPI geral, no CPL
    // Médio e no Funil. Os rankings por criativo/público/quente-frio continuam usando a
    // coluna "Leads" do Meta_Ads, por ser a única fonte com atribuição por anúncio.
    var realLeads = leadsF.length;
    var realCpl = realLeads ? (total.invest / realLeads) : 0;
    var realTxconv = total.clicks ? (realLeads / total.clicks * 100) : 0;

    var html = '';
    html += '<div class="kpi-grid">' +
      kpiCard('Investimento Total', fmtBRL(total.invest)) +
      kpiCard('CTR Médio', fmtPct(total.ctr)) +
      kpiCard('CPM Médio', fmtBRL(total.cpm)) +
      kpiCard('CPL Médio', fmtCPL(realLeads, realCpl), realLeads + ' leads no período') +
      '</div>';

    html += '<div class="section-title">Público Quente vs Público Frio</div>';
    html += '<div class="temp-grid">';
    html += '<div class="temp-card quente"><h3>🔥 PÚBLICO QUENTE</h3><div class="sub">Engajamento 365D</div>' +
      '<div class="temp-metrics">' +
      tempMetric(fmtBRL(quente.invest), 'Investimento') +
      tempMetric(fmtCPL(quente.leads, quente.cpl), 'CPL') +
      tempMetric(fmtInt(quente.leads), 'Leads') +
      '</div><div class="temp-detail">' + qDetail.map(function (d) {
        return '<div><span>' + esc(d.key) + '</span><span>' + fmtBRL(d.a.invest) + ' · CPL ' + fmtCPL(d.a.leads, d.a.cpl) + ' · ' + d.a.leads + (d.a.leads === 1 ? ' lead' : ' leads') + '</span></div>';
      }).join('') + '</div></div>';

    html += '<div class="temp-card frio"><h3>❄️ PÚBLICO FRIO</h3><div class="sub">Nurse + Profissionais de Saúde + Profissões</div>' +
      '<div class="temp-metrics">' +
      tempMetric(fmtBRL(frio.invest), 'Investimento') +
      tempMetric(fmtCPL(frio.leads, frio.cpl), 'CPL') +
      tempMetric(fmtInt(frio.leads), 'Leads') +
      '</div><div class="temp-detail">' + fDetail.map(function (d) {
        return '<div><span>' + esc(d.key) + '</span><span>' + fmtBRL(d.a.invest) + ' · CPL ' + fmtCPL(d.a.leads, d.a.cpl) + ' · ' + d.a.leads + (d.a.leads === 1 ? ' lead' : ' leads') + '</span></div>';
      }).join('') + '</div></div>';

    html += '<div class="compare-card"><h3>Comparativo</h3><div>' +
      '<div class="bar-row"><span style="width:46px">Quente</span><div class="bar-track"><div class="bar-fill" style="width:' + pctQ.toFixed(2) + '%; background:#ff1744"></div></div><span>' + fmtPct(pctQ) + '</span></div>' +
      '<div class="bar-row" style="margin-top:8px"><span style="width:46px">Frio</span><div class="bar-track"><div class="bar-fill" style="width:' + pctF.toFixed(2) + '%; background:#42a5f5"></div></div><span>' + fmtPct(pctF) + '</span></div>' +
      '</div><div class="compare-stat">' + compareStatText(quente, frio, cplDiff) + '</div></div>';
    html += '</div>';

    var funnelTotal = { impr: total.impr, clicks: total.clicks, ctr: total.ctr, leads: realLeads, txconv: realTxconv };
    html += '<div class="section-title">Funil de Conversão</div>';
    html += '<div class="funnel-section"><div class="funnel-svg-wrap">' + funnelSVG(funnelTotal) + '</div>' +
      '<div class="funnel-metrics-row">' +
      metricCard('CPC — Custo por Clique', fmtCPC(total.clicks, total.cpc), '#ff6b35') +
      metricCard('TX Conversão (Cliques → Leads)', fmtPct(realTxconv), '#ffd600') +
      metricCard('CPL — Custo por Lead', fmtCPL(realLeads, realCpl), '#00c853') +
      '</div></div>';
    html += '<div class="info-note">Investimento, CTR, CPM e o funil acima usam o leads real do formulário (' + realLeads + ' no período, aba de respostas) — a fonte confiável aqui, já que a campanha é 100% formulário instantâneo, sem captação orgânica. Os rankings de Criativos, Públicos e a comparação Quente/Frio abaixo usam a contagem de leads do próprio Meta Ads por anúncio (que pode diferir por alguns leads devido à forma como o Meta atribui a data do evento), pois é a única fonte com esse nível de detalhe.</div>';

    html += '<div class="section-title">Perfil dos Leads (Formulário)</div>';
    html += '<div class="info-note">' + leadsF.length + ' respostas completas registradas no formulário no período selecionado.</div>';
    html += '<div class="profile-grid" style="margin-top:14px">' +
      profileCard('Tempo de Atuação', leadsF, 'p1', P1_ORDER) +
      profileCard('Situação Atual de Trabalho', leadsF, 'p2', P2_ORDER) +
      profileCard('Prontidão para Investir', leadsF, 'p3', P3_ORDER) +
      '</div>';

    var daily = buildDaily(meta);
    html += '<div class="section-title">Evolução Diária</div>';
    html += '<div class="table-wrap"><table><thead><tr><th>Dia</th><th>Investimento</th><th>Impressões</th><th>Cliques</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th></tr></thead><tbody>' +
      daily.map(function (d) {
        return '<tr><td>' + isoToDM(d.dateISO) + '</td><td>' + fmtBRL(d.a.invest) + '</td><td>' + fmtInt(d.a.impr) + '</td><td>' + fmtInt(d.a.clicks) + '</td><td>' + fmtInt(d.a.leads) + '</td><td>' + fmtPct(d.a.ctr) + '</td><td>' + fmtCPC(d.a.clicks, d.a.cpc) + '</td><td>' + fmtCPL(d.a.leads, d.a.cpl) + '</td></tr>';
      }).join('') +
      "<tr class='total-row'><td>TOTAL</td><td>" + fmtBRL(total.invest) + '</td><td>' + fmtInt(total.impr) + '</td><td>' + fmtInt(total.clicks) + '</td><td>' + fmtInt(total.leads) + '</td><td>' + fmtPct(total.ctr) + '</td><td>' + fmtCPC(total.clicks, total.cpc) + '</td><td>' + fmtCPL(total.leads, total.cpl) + '</td></tr>' +
      '</tbody></table></div>';
    html += '<div class="chart-card"><canvas id="dailyChart" height="90"></canvas></div>';

    document.getElementById('visao-geral').innerHTML = html;
    renderDailyChart(daily);
  }

  function detailBreakdown(rows, keyFn) {
    var g = groupBy(rows, keyFn);
    var out = [];
    for (var i = 0; i < g.keys.length; i++) {
      var k = g.keys[i], a = agg(g.map[k]);
      if (a.leads > 0) out.push({ key: k, a: a });
    }
    out.sort(function (a, b) { return b.a.leads - a.a.leads; });
    return out;
  }
  function compareStatText(quente, frio, cplDiff) {
    var winner = null, diffTxt = '';
    if (cplDiff !== null) {
      if (cplDiff > 0) { winner = 'Frio'; diffTxt = fmtPct(Math.abs(cplDiff)) + ' menor'; }
      else if (cplDiff < 0) { winner = 'Quente'; diffTxt = fmtPct(Math.abs(cplDiff)) + ' menor'; }
    }
    var totalLeads = quente.leads + frio.leads;
    var pctF = totalLeads ? (frio.leads / totalLeads * 100) : 0;
    if (!winner) return 'Dados insuficientes para comparar CPL no período selecionado.';
    return 'O público <b>' + winner + '</b> converte a um CPL <b>' + diffTxt + '</b> que o outro grupo, e o Frio responde por <b>' + fmtPct(pctF) + '</b> dos leads do período.';
  }
  function kpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="kpi-label">' + esc(label) + '</div><div class="kpi-value">' + value + '</div>' + (sub ? '<div class="kpi-sub">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function tempMetric(val, lbl) {
    return '<div class="temp-metric"><div class="val">' + val + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
  }
  function metricCard(lbl, val, color) {
    return '<div class="metric-card"><div class="lbl">' + esc(lbl) + '</div><div class="val" style="color:' + color + '">' + val + '</div><div class="bar" style="background:' + color + '"></div></div>';
  }
  function profileCard(title, leadsF, field, order) {
    var total = leadsF.length;
    var counts = {};
    for (var i = 0; i < leadsF.length; i++) {
      var v = leadsF[i][field];
      if (!v) continue;
      counts[v] = (counts[v] || 0) + 1;
    }
    var items = order.map(function (o) {
      var c = counts[o.v] || 0;
      var pct = total ? (c / total * 100) : 0;
      return '<div class="profile-item"><div class="top"><span>' + esc(o.label) + '</span><b>' + fmtPct(pct, 1) + '</b></div><div class="profile-bar"><span style="width:' + pct.toFixed(2) + '%"></span></div></div>';
    }).join('');
    return '<div class="profile-card"><h4>' + esc(title) + '</h4>' + items + '</div>';
  }
  function buildDaily(meta) {
    var g = groupBy(meta, function (r) { return r.dateISO; });
    var keys = g.keys.slice().sort();
    return keys.map(function (k) { return { dateISO: k, a: agg(g.map[k]) }; });
  }
  function funnelSVG(total) {
    return '<svg viewBox="0 0 1200 540" width="100%" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
      '<linearGradient id="gradImpr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0d3a66"/><stop offset="50%" stop-color="#1e5f9e"/><stop offset="100%" stop-color="#0d3a66"/></linearGradient>' +
      '<linearGradient id="gradClicks" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e5f9e"/><stop offset="50%" stop-color="#42a5f5"/><stop offset="100%" stop-color="#1e5f9e"/></linearGradient>' +
      '<linearGradient id="gradLeads" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00753a"/><stop offset="50%" stop-color="#00c853"/><stop offset="100%" stop-color="#00753a"/></linearGradient>' +
      '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '</defs>' +
      '<polygon points="80,20 1120,20 1000,180 200,180" fill="url(#gradImpr)" stroke="#16213e" stroke-width="2"/>' +
      '<text x="600" y="90" text-anchor="middle" fill="#fff" font-size="56" font-weight="800">' + fmtInt(total.impr) + '</text>' +
      '<text x="600" y="120" text-anchor="middle" fill="#cfe3ff" font-size="16" letter-spacing="2">IMPRESSÕES</text>' +
      '<text x="600" y="210" text-anchor="middle" fill="#ffd600" font-size="18" font-weight="700">CTR ' + fmtPct(total.ctr) + '</text>' +
      '<line x1="600" y1="180" x2="600" y2="230" stroke="#444" stroke-width="2" stroke-dasharray="4,4"/>' +
      '<polygon points="200,230 1000,230 880,360 320,360" fill="url(#gradClicks)" stroke="#16213e" stroke-width="2"/>' +
      '<text x="600" y="300" text-anchor="middle" fill="#fff" font-size="56" font-weight="800">' + fmtInt(total.clicks) + '</text>' +
      '<text x="600" y="330" text-anchor="middle" fill="#e3f2ff" font-size="16" letter-spacing="2">CLIQUES</text>' +
      '<text x="600" y="392" text-anchor="middle" fill="#ffd600" font-size="18" font-weight="700">TX Conversão ' + fmtPct(total.txconv) + '</text>' +
      '<line x1="600" y1="360" x2="600" y2="412" stroke="#444" stroke-width="2" stroke-dasharray="4,4"/>' +
      '<polygon points="320,412 880,412 800,520 400,520" fill="url(#gradLeads)" stroke="#16213e" stroke-width="2" filter="url(#glow)"/>' +
      '<text x="600" y="480" text-anchor="middle" fill="#fff" font-size="68" font-weight="800">' + fmtInt(total.leads) + '</text>' +
      '<text x="600" y="508" text-anchor="middle" fill="#d7ffe9" font-size="16" letter-spacing="2">LEADS</text>' +
      '</svg>';
  }
  function renderDailyChart(daily) {
    var ctxEl = document.getElementById('dailyChart');
    if (!ctxEl) return;
    if (state.dailyChart) { state.dailyChart.destroy(); state.dailyChart = null; }
    var labels = daily.map(function (d) { return isoToDM(d.dateISO); });
    var leadsArr = daily.map(function (d) { return d.a.leads; });
    var cplArr = daily.map(function (d) { return d.a.leads > 0 ? Math.round(d.a.cpl * 100) / 100 : null; });
    var ctx = ctxEl.getContext('2d');
    state.dailyChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { type: 'bar', label: 'Leads', data: leadsArr, backgroundColor: 'rgba(0,200,83,0.55)', borderRadius: 3, yAxisID: 'y' },
          { type: 'line', label: 'CPL (R$)', data: cplArr, borderColor: '#ff6b35', backgroundColor: '#ff6b35', spanGaps: true, tension: 0.3, yAxisID: 'y1', pointRadius: 2 }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#cfcfe0' } } },
        scales: {
          x: { ticks: { color: '#8888a0', maxRotation: 90, minRotation: 90, autoSkip: true, maxTicksLimit: 32 }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { position: 'left', ticks: { color: '#8888a0' }, grid: { color: 'rgba(255,255,255,0.04)' }, title: { display: true, text: 'Leads', color: '#8888a0' } },
          y1: { position: 'right', ticks: { color: '#8888a0' }, grid: { display: false }, title: { display: true, text: 'CPL (R$)', color: '#8888a0' } }
        }
      }
    });
  }

  // ---------- CRIATIVOS ----------
  function renderCriativos(meta) {
    var g = groupBy(meta, function (r) { return r.ad; });
    var creatives = g.keys.map(function (k) {
      var rows = g.map[k], a = agg(rows);
      // link: use the one from the most recent dated row for this creative
      var latest = rows.reduce(function (best, r) { return (!best || r.dateISO > best.dateISO) ? r : best; }, null);
      return { ad: k, link: latest ? latest.link : '', a: a };
    });
    creatives.sort(function (x, y) { return cplSortAsc(x.a, y.a); });
    var html = '<div class="section-title">Ranking de Criativos (melhor → pior CPL)</div>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>Criativo</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th><th>Link</th></tr></thead><tbody>' +
      creatives.map(function (c, i) {
        var a = c.a;
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(c.ad) + '</td><td>' + fmtBRL(a.invest) + '</td><td>' + fmtInt(a.impr) + '</td><td>' + fmtInt(a.clicks) + '</td><td>' + fmtInt(a.leads) + '</td><td>' + fmtPct(a.ctr) + '</td><td>' + fmtCPC(a.clicks, a.cpc) + '</td><td>' + fmtCPL(a.leads, a.cpl) + '</td><td>' + (c.link ? "<a href='" + esc(c.link) + "' target='_blank' rel='noopener'>ver anúncio</a>" : '—') + '</td></tr>';
      }).join('') +
      '</tbody></table></div>';
    document.getElementById('criativos').innerHTML = html;
  }

  // ---------- PUBLICOS ----------
  function renderPublicos(meta) {
    var g = groupBy(meta, function (r) { return r.adset; });
    var publicos = g.keys.map(function (k) {
      var rows = g.map[k], a = agg(rows);
      return { adset: k, temp: classifyTemp(k), a: a };
    });
    publicos.sort(function (x, y) { return cplSortAsc(x.a, y.a); });
    var html = '<div class="section-title">Ranking de Públicos (melhor → pior CPL)</div>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>Conjunto</th><th>Temp.</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th></tr></thead><tbody>' +
      publicos.map(function (p, i) {
        var a = p.a;
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.adset) + "</td><td><span class='temp-tag " + p.temp + "'>" + (p.temp === 'quente' ? 'Quente' : 'Frio') + '</span></td><td>' + fmtBRL(a.invest) + '</td><td>' + fmtInt(a.impr) + '</td><td>' + fmtInt(a.clicks) + '</td><td>' + fmtInt(a.leads) + '</td><td>' + fmtPct(a.ctr) + '</td><td>' + fmtCPC(a.clicks, a.cpc) + '</td><td>' + fmtCPL(a.leads, a.cpl) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div class="info-note">Detalhamento por posição (Feed vs Stories) não está disponível nos dados desta planilha.</div>';
    document.getElementById('publicos').innerHTML = html;
  }

  // ---------- ANALISE DIARIA ----------
  function renderAnaliseDiaria(meta) {
    var g = groupBy(meta, function (r) { return r.dateISO; });
    var keys = g.keys.slice().sort();
    var totQ = agg([]), totF = agg([]);
    var qAccRows = [], fAccRows = [];
    var rowsHtml = keys.map(function (k) {
      var rows = g.map[k];
      var qRows = rows.filter(function (r) { return classifyTemp(r.adset) === 'quente'; });
      var fRows = rows.filter(function (r) { return classifyTemp(r.adset) === 'frio'; });
      qAccRows = qAccRows.concat(qRows); fAccRows = fAccRows.concat(fRows);
      var q = agg(qRows), f = agg(fRows);
      return '<tr><td>' + isoToDM(k) + '</td><td>' + fmtBRL(q.invest) + '</td><td>' + fmtInt(q.leads) + '</td><td>' + fmtCPL(q.leads, q.cpl) + '</td><td>' + fmtBRL(f.invest) + '</td><td>' + fmtInt(f.leads) + '</td><td>' + fmtCPL(f.leads, f.cpl) + '</td></tr>';
    }).join('');
    var qTotal = agg(qAccRows), fTotal = agg(fAccRows);
    var totalRow = "<tr class='total-row'><td>TOTAL</td><td>" + fmtBRL(qTotal.invest) + '</td><td>' + fmtInt(qTotal.leads) + '</td><td>' + fmtCPL(qTotal.leads, qTotal.cpl) + '</td><td>' + fmtBRL(fTotal.invest) + '</td><td>' + fmtInt(fTotal.leads) + '</td><td>' + fmtCPL(fTotal.leads, fTotal.cpl) + '</td></tr>';
    var html = '<div class="section-title">Comparativo Diário — Público Quente vs Frio</div>' +
      '<div class="table-wrap"><table><thead><tr>' +
      '<th rowspan="2">Dia</th><th colspan="3" style="text-align:center; color:#ff5c7a">Quente (Engajamento 365D)</th><th colspan="3" style="text-align:center; color:#42a5f5">Frio (Nurse + Prof. Saúde + Profissões)</th>' +
      '</tr><tr><th>Invest.</th><th>Leads</th><th>CPL</th><th>Invest.</th><th>Leads</th><th>CPL</th></tr></thead><tbody>' +
      rowsHtml + totalRow + '</tbody></table></div>';
    document.getElementById('analise-diaria').innerHTML = html;
  }

  // ---------- LEADS ----------
  function renderLeads(leadsF) {
    var sorted = leadsF.slice().sort(function (a, b) { return b.dataISO.localeCompare(a.dataISO); });
    document.getElementById('leadsInfoNote').textContent =
      sorted.length + ' leads no período selecionado, ordenados do mais recente para o mais antigo. Registros de teste da planilha são excluídos automaticamente.';
    var tbody = document.querySelector('#leadsTable tbody');
    tbody.innerHTML = sorted.map(function (l) {
      var p = l.dateOnly.split('-');
      var dataFmt = p[2] + '/' + p[1] + '/' + p[0] + ' ' + l.hhmm;
      return '<tr><td>' + dataFmt + '</td><td>' + esc(l.nome) + '</td><td>' + esc(fmtPhone(l.telefone)) + '</td></tr>';
    }).join('');
    applyLeadSearch();
  }
  function applyLeadSearch() {
    var el = document.getElementById('leadSearch');
    if (!el) return;
    var q = el.value.trim().toLowerCase();
    document.querySelectorAll('#leadsTable tbody tr').forEach(function (tr) {
      tr.style.display = tr.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
    });
  }

  // ============================= FILTER UI =============================
  function applyPreset(preset) {
    if (!state.maxDate) return;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.preset === preset); });
    if (preset === 'all') {
      state.presetAll = true;
      state.filterFrom = state.minDate;
      state.filterTo = state.maxDate;
    } else {
      state.presetAll = false;
      var days = parseInt(preset, 10);
      // "7 dias" / "30 dias" contam sempre até ontem (data real do aparelho), nunca o dia de hoje
      // (que costuma ter dados parciais) — limitado ao intervalo real disponível na planilha.
      var yesterdayISO = isoAddDays(todayLocalISO(), -1);
      var toISO = yesterdayISO < state.maxDate ? yesterdayISO : state.maxDate;
      if (toISO < state.minDate) toISO = state.maxDate;
      var fromISO = isoAddDays(toISO, -(days - 1));
      state.filterFrom = fromISO < state.minDate ? state.minDate : fromISO;
      state.filterTo = toISO;
    }
    document.getElementById('dateFrom').value = state.filterFrom;
    document.getElementById('dateTo').value = state.filterTo;
    render();
  }

  document.querySelectorAll('.preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { applyPreset(btn.dataset.preset); });
  });
  document.getElementById('dateFrom').addEventListener('change', function (e) {
    state.presetAll = false;
    state.filterFrom = e.target.value || state.minDate;
    if (state.filterFrom > state.filterTo) state.filterTo = state.filterFrom;
    document.getElementById('dateTo').value = state.filterTo;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.remove('active'); });
    render();
  });
  document.getElementById('dateTo').addEventListener('change', function (e) {
    state.presetAll = false;
    state.filterTo = e.target.value || state.maxDate;
    if (state.filterTo < state.filterFrom) state.filterFrom = state.filterTo;
    document.getElementById('dateFrom').value = state.filterFrom;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.remove('active'); });
    render();
  });
  document.getElementById('btnRefresh').addEventListener('click', function () { loadData(); });

  // ============================= INIT =============================
  state.presetAll = true;
  loadData();
  setInterval(loadData, REFRESH_MS);
})();
</script>
</body>
</html>
