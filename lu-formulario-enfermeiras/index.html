<style>
/* ===== BASE — perpétuo v2 sobre preto puro (identidade-jamelli-gt) ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e8e6f0;font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#141414}::-webkit-scrollbar-thumb{background:#ff6b2b55;border-radius:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px 60px}
.topbar{background:#141414;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
.brand{font-size:17px;font-weight:700;color:#ff6b2b}
.subtitle{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.logo-jgt{display:flex;align-items:center;gap:10px}
.logo-jgt svg{width:36px;height:36px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column}
.logo-text strong{font-size:13px;font-weight:700;color:#ff6b2b;letter-spacing:.3px}
.logo-text span{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.period-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period-bar label{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}
.date-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e8e6f0;padding:5px 10px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;min-width:118px;color-scheme:dark}
.date-input:focus{border-color:#ff6b2b}
.date-input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5;cursor:pointer}
.period-sep{color:rgba(255,255,255,.2);font-size:13px;padding:0 2px}
.preset-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap}
.preset-btn:hover,.preset-btn.active{background:rgba(255,107,43,.2);border-color:#ff6b2b;color:#ff6b2b;font-weight:600}
.range-info{font-size:11px;color:rgba(255,107,43,.75);font-family:'DM Mono',monospace;white-space:nowrap;padding-left:4px}
.live-cluster{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.4);margin-top:4px;justify-content:flex-end}
.live-dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;box-shadow:0 0 5px #2ecc71;flex-shrink:0}
.live-dot.loading{background:#f1c40f;box-shadow:0 0 5px #f1c40f;animation:pulse 1s infinite}
.live-dot.err{background:#e74c3c;box-shadow:0 0 5px #e74c3c;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn-refresh{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e8e6f0;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif}
.btn-refresh:hover{border-color:#ff6b2b;color:#ff6b2b}
.btn-refresh:disabled{opacity:.5;cursor:default}
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.07);background:#141414;padding:0 28px;overflow-x:auto}
.tab{padding:12px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.5);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:#e8e6f0}.tab.active{color:#ff6b2b;border-bottom-color:#ff6b2b;font-weight:600}
.content{padding:24px 0;display:none}.content.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:#141414;border:1px solid #444;border-top:3px solid #ff6b2b;border-radius:10px;padding:16px 18px}
.kpi-label{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kpi-value{font-size:20px;font-weight:700;font-family:'DM Mono',monospace}
.kpi-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px;font-family:'DM Mono',monospace}
.orange{color:#ff6b2b}.green{color:#2ecc71}.red{color:#e74c3c}.yellow{color:#f1c40f}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#141414;color:rgba(255,255,255,.45);padding:8px 10px;text-align:right;font-weight:500;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
th:first-child{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);font-family:'DM Mono',monospace;font-size:11px;color:#e8e6f0}
td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-size:12px}
tr:nth-child(even) td{background:rgba(255,255,255,.035)}
tr:hover td{background:rgba(255,255,255,.07)}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.07)}
.chart-card{background:#141414;border:1px solid #444;border-top:3px solid #ff6b2b;border-radius:10px;padding:16px;margin-top:16px}
.chart-card h4{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-card canvas{max-height:260px}
.sec-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.65);margin:20px 0 10px;border-left:3px solid #ff6b2b;padding-left:10px}
.sec-title:first-child{margin-top:0}

/* ===== CAPTAÇÃO — mesma linguagem visual ===== */
.temp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.temp-card{border-radius:10px;padding:18px;border:2px solid}
.temp-card.quente{border-color:#e74c3c;background:rgba(231,76,60,.08)}
.temp-card.frio{border-color:#42a5f5;background:rgba(66,165,245,.08)}
.temp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.temp-card.quente .temp-title{color:#e74c3c}
.temp-card.frio .temp-title{color:#42a5f5}
.temp-sub{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:14px}
.temp-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.temp-metric{background:rgba(255,255,255,.04);border-radius:6px;padding:8px 6px;text-align:center}
.temp-metric-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:#e8e6f0}
.temp-metric-lbl{font-size:9px;color:rgba(255,255,255,.35);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.temp-detail{font-size:11px;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace;line-height:1.7}
.comp-card{background:#141414;border:1px solid #444;border-top:3px solid #ff6b2b;border-radius:10px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.comp-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.7);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.comp-row:last-child{border-bottom:none}
.comp-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:600;color:#ff6b2b}
.comp-bar-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin:0 10px}
.comp-bar-fill{height:100%;border-radius:5px}
.comp-text{font-size:11.5px;color:rgba(255,255,255,.55);line-height:1.5}
.comp-text b{color:#ff6b2b}

.funil-wrap{display:flex;gap:16px;align-items:stretch;margin-bottom:20px;flex-wrap:wrap}
.funnel-svg-wrap{flex:0 0 52%;max-width:52%;background:#141414;border:1px solid #444;border-top:3px solid #ff6b2b;border-radius:10px;padding:12px}
.funnel-svg-wrap svg{width:100%;height:auto;display:block}
.funnel-metrics-row{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.metric-card{--c:#ff6b2b;position:relative;overflow:hidden;flex:1;background:#141414;border:1px solid #444;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.metric-card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.metric-card .kpi-value{font-size:26px;color:var(--c)}

tr.total td{background:rgba(255,107,43,.12);color:#ff6b2b;font-weight:700;border-top:1px solid #ff6b2b}
a.link-ad{color:rgba(255,107,43,.8);text-decoration:none}
a.link-ad:hover{color:#ff6b2b;text-decoration:underline}

.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.profile-card{background:#141414;border:1px solid #444;border-top:3px solid #ff6b2b;border-radius:10px;padding:16px}
.profile-card h4{margin:0 0 12px;font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.profile-item{margin-bottom:10px}
.profile-item .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:rgba(255,255,255,.7)}
.profile-item .top b{color:#e8e6f0;font-family:'DM Mono',monospace}
.profile-bar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.profile-bar span{display:block;height:100%;background:#ff6b2b}

.search-box{margin-bottom:14px}
.search-box input{width:100%;max-width:340px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e8e6f0;padding:9px 14px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif}
.search-box input::placeholder{color:rgba(255,255,255,.35)}
.search-box input:focus{outline:none;border-color:#ff6b2b}

.skeleton{color:rgba(255,255,255,.4);font-size:13px;padding:30px;text-align:center}

@media(max-width:1150px){.profile-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.temp-grid{grid-template-columns:1fr}.funil-wrap{flex-direction:column}.funnel-svg-wrap{flex:none;max-width:100%}.kpi-grid{grid-template-columns:repeat(2,1fr)}.profile-grid{grid-template-columns:1fr}.live-cluster{justify-content:flex-start}}
</style>
</head>
<body>

      <rect width="36" height="36" rx="8" fill="#ff6b2b" fill-opacity="0.9"/>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================= CONFIG =============================
  var SHEET_ID = '17zfdmip3LQ7PT_t-yhpBFq8Vbw-YmTQk93vGlySGp8Y';
  var REFRESH_MS = 60 * 60 * 1000; // 1 hora

  var P1_ORDER = [
    { v: '8_anos_ou_mais', label: '8 anos ou mais' },
    { v: '3_a_7_anos', label: '3 a 7 anos' },
    { v: 'menos_de_3_anos', label: 'Menos de 3 anos' }
  ];
  var P2_ORDER = [
    { v: 'só_por_plantão/clt', label: 'Só plantão / CLT' },
    { v: 'atendo_avulso,_mas_sem_estrutura_de_negócio', label: 'Atende avulso, sem estrutura' },
    { v: 'já_tenho_algo_estruturado,_mas_quero_crescer', label: 'Já estruturado, quer crescer' }
  ];
  var P3_ORDER = [
    { v: 'tenho_disponível_e_pronta_pra_decidir_agora', label: 'Pronta pra decidir agora' },
    { v: 'estou_me_organizando,_mas_é_questão_de_tempo_curto', label: 'Se organizando (curto prazo)' },
    { v: 'ainda_não_tenho_previsão', label: 'Ainda sem previsão' }
  ];
  // Pergunta nova do formulário reestruturado (aba "LD COMPLETO REVISÃO", a partir de 16/09/2026) —
  // substituiu a antiga pergunta de "Prontidão para Investir" (P3), que não existe mais.
  var P4_ORDER = [
    { v: 'até_r$_3.000', label: 'Até R$ 3.000' },
    { v: 'de_r$_3.001_a_r$_6.000', label: 'R$ 3.001 a R$ 6.000' },
    { v: 'de_r$_6.001_a_r$_10.000', label: 'R$ 6.001 a R$ 10.000' },
    { v: 'acima_de_r$_10.000', label: 'Acima de R$ 10.000' }
  ];

  // ============================= STATE =============================
  var state = {
    metaRows: [],
    leadRows: [],
    minDate: null,
    maxDate: null,
    filterFrom: null,
    filterTo: null,
    dailyChart: null,
    loading: false
  };

  // ============================= HELPERS =============================
  function fmtBRL(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    var neg = v < 0; v = Math.abs(v);
    var fixed = v.toFixed(2);
    var parts = fixed.split('.');
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + 'R$ ' + intPart + ',' + parts[1];
  }
  function fmtInt(v) {
    return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function fmtPct(v, dec) {
    if (dec === undefined) dec = 2;
    if (v === null || v === undefined || isNaN(v)) return '—';
    return v.toFixed(dec).replace('.', ',') + '%';
  }
  function fmtCPL(leads, cpl) { return leads > 0 ? fmtBRL(cpl) : '—'; }
  function fmtCPC(clicks, cpc) { return clicks > 0 ? fmtBRL(cpc) : '—'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ============================= GVIZ TABLE -> STRING ROWS =============================
  // Each cell becomes the same kind of plain string our parsers already expect
  // (the sheet's own formatted display, e.g. "R$ 1.435,81", "13/07/2026", "31").
  function cellStr(cell) {
    if (!cell) return '';
    if (cell.f !== undefined && cell.f !== null) return cell.f;
    if (cell.v === undefined || cell.v === null) return '';
    return String(cell.v);
  }
  function tableToRows(json) {
    var rows = (json && json.table && json.table.rows) || [];
    return rows.map(function (row) {
      var cells = (row && row.c) || [];
      var out = [];
      for (var i = 0; i < cells.length; i++) out.push(cellStr(cells[i]));
      return out;
    });
  }

  function parseCurrencyBR(s) {
    if (!s) return 0;
    var t = String(s).replace('R$', '').trim();
    if (t === '') return 0;
    t = t.replace(/\./g, '').replace(',', '.');
    var v = parseFloat(t);
    return isNaN(v) ? 0 : v;
  }
  function parseIntSafe(s) {
    if (!s) return 0;
    var v = parseInt(String(s).trim(), 10);
    return isNaN(v) ? 0 : v;
  }
  function brDateToISO(s) {
    var m = String(s).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    return m[3] + '-' + m[2] + '-' + m[1];
  }
  function isoToBR(iso) {
    var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
  }
  function isoToDM(iso) {
    var p = iso.split('-'); return p[2] + '/' + p[1];
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function localISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayLocalISO() { return localISO(new Date()); }
  function isoAddDays(iso, days) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + days);
    return localISO(d);
  }

  function parseMetaRows(csvRows) {
    var out = [];
    for (var i = 0; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (!r || !r[0]) continue;
      var dateISO = brDateToISO(r[0]);
      if (!dateISO) continue;
      out.push({
        dateISO: dateISO,
        adset: (r[2] || '').trim(),
        ad: (r[3] || '').trim(),
        link: r[4] || '',
        spend: parseCurrencyBR(r[5]),
        clicks: parseIntSafe(r[6]),
        impr: parseIntSafe(r[8]),
        leads: parseIntSafe(r[9])
      });
    }
    return out;
  }
  function classifyTemp(adsetName) { return /engajamento/i.test(adsetName) ? 'quente' : 'frio'; }

  function parseLeadRows(csvRows) {
    var out = [];
    for (var i = 0; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (!r || !r[0]) continue;
      var nome = (r[1] || '').trim();
      if (nome.toLowerCase().indexOf('<test lead') === 0) continue;
      var dataISO = r[0];
      var dateOnly = dataISO.slice(0, 10);
      var hhmm = dataISO.length >= 16 ? dataISO.slice(11, 16) : '';
      out.push({
        dataISO: dataISO, dateOnly: dateOnly, hhmm: hhmm, nome: nome,
        telefone: (r[2] || '').trim(),
        p1: (r[3] || '').trim(), p2: (r[4] || '').trim(), p3: (r[5] || '').trim(), p4: ''
      });
    }
    return out;
  }
  // Aba "LD COMPLETO REVISÃO" — o formulário foi reestruturado em 16/09/2026 (a aba "LD COMPLETO"
  // parou de receber respostas nesse dia e esta passou a ser a fonte real dos leads). As 2 primeiras
  // perguntas (tempo de atuação / situação de trabalho) continuam com os mesmos valores de P1/P2.
  // A antiga pergunta "Prontidão para Investir" (P3) não existe mais nesse novo formulário — foi
  // substituída pela pergunta "Qual o seu faturamento atual como enfermeira?" (P4), que não é
  // equivalente — por isso leads desta aba ficam sem p3 (não entram no card "Prontidão para
  // Investir") e passam a alimentar o novo card "Faturamento Atual" (p4) em vez disso.
  function parseLeadRowsRevisao(csvRows) {
    var out = [];
    for (var i = 0; i < csvRows.length; i++) {
      var r = csvRows[i];
      if (!r || !r[0]) continue;
      var nome = (r[1] || '').trim();
      if (nome.toLowerCase().indexOf('<test lead') === 0) continue;
      var dataISO = r[0];
      var dateOnly = dataISO.slice(0, 10);
      var hhmm = dataISO.length >= 16 ? dataISO.slice(11, 16) : '';
      out.push({
        dataISO: dataISO, dateOnly: dateOnly, hhmm: hhmm, nome: nome,
        telefone: (r[2] || '').trim(),
        p1: (r[3] || '').trim(), p2: (r[4] || '').trim(), p3: '', p4: (r[5] || '').trim()
      });
    }
    return out;
  }
  // Junta as duas abas de leads num único array, removendo qualquer duplicata (mesma
  // data/hora + telefone) para o caso de uma linha acabar presente nas duas abas.
  function mergeLeadRows(a, b) {
    var seen = {}, out = [];
    var all = a.concat(b);
    for (var i = 0; i < all.length; i++) {
      var k = all[i].dataISO + '|' + all[i].telefone;
      if (seen[k]) continue;
      seen[k] = true;
      out.push(all[i]);
    }
    return out;
  }
  function fmtPhone(telRaw) {
    var t = String(telRaw || '').replace(/\D/g, '');
    if (t.length === 13 && t.indexOf('55') === 0) return '+55 (' + t.slice(2,4) + ') ' + t.slice(4,9) + '-' + t.slice(9,13);
    if (t.length === 12 && t.indexOf('55') === 0) return '+55 (' + t.slice(2,4) + ') ' + t.slice(4,8) + '-' + t.slice(8,12);
    if (t.length === 11) return '+55 (' + t.slice(0,2) + ') ' + t.slice(2,7) + '-' + t.slice(7,11);
    if (t.length === 10) return '+55 (' + t.slice(0,2) + ') ' + t.slice(2,6) + '-' + t.slice(6,10);
    return telRaw || '—';
  }

  // ============================= AGGREGATION =============================
  function agg(rows) {
    var inv = 0, clk = 0, imp = 0, lds = 0;
    for (var i = 0; i < rows.length; i++) { inv += rows[i].spend; clk += rows[i].clicks; imp += rows[i].impr; lds += rows[i].leads; }
    var ctr = imp ? (clk / imp * 100) : 0;
    var cpc = clk ? (inv / clk) : 0;
    var cpm = imp ? (inv / imp * 1000) : 0;
    var cpl = lds ? (inv / lds) : 0;
    var txconv = clk ? (lds / clk * 100) : 0;
    return { invest: inv, clicks: clk, impr: imp, leads: lds, ctr: ctr, cpc: cpc, cpm: cpm, cpl: cpl, txconv: txconv };
  }
  function groupBy(rows, keyFn) {
    var m = {}, order = [];
    for (var i = 0; i < rows.length; i++) {
      var k = keyFn(rows[i]);
      if (!m[k]) { m[k] = []; order.push(k); }
      m[k].push(rows[i]);
    }
    return { map: m, keys: order };
  }
  function cplSortAsc(a, b) {
    var av = a.leads > 0 ? a.cpl : Infinity;
    var bv = b.leads > 0 ? b.cpl : Infinity;
    return av - bv;
  }
  // ============================= DATA FETCH (JSONP — não sofre bloqueio de CORS) =============================
  var jsonpSeq = 0;
  function fetchJSONP(url) {
    return new Promise(function (resolve, reject) {
      jsonpSeq++;
      var cbName = '__gvizCb_' + Date.now() + '_' + jsonpSeq;
      var script = document.createElement('script');
      var done = false;
      var timeoutId = setTimeout(function () {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('tempo esgotado ao carregar a planilha'));
      }, 20000);
      function cleanup() {
        clearTimeout(timeoutId);
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function (data) {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };
      script.onerror = function () {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('falha de rede ao carregar a planilha'));
      };
      var full = url + (url.indexOf('?') === -1 ? '?' : '&') + 'tqx=out:json;responseHandler:' + cbName + '&_=' + Date.now();
      script.src = full;
      document.head.appendChild(script);
    });
  }
  function loadTable(sheetName) {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(sheetName);
    return fetchJSONP(url).then(function (json) {
      if (!json || json.status === 'error') {
        var msg = (json && json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || 'erro ao ler a aba ' + sheetName;
        throw new Error(msg);
      }
      return tableToRows(json);
    });
  }

  function loadData() {
    setLive('loading', 'atualizando…');
    document.getElementById('btnRefresh').disabled = true;
    return Promise.all([loadTable('Meta_Ads'), loadTable('LD COMPLETO'), loadTable('LD COMPLETO REVISÃO')]).then(function (r) {
      var metaRows = parseMetaRows(r[0]);
      var leadRows = mergeLeadRows(parseLeadRows(r[1]), parseLeadRowsRevisao(r[2]));
      if (metaRows.length === 0) throw new Error('planilha vazia');
      state.metaRows = metaRows;
      state.leadRows = leadRows;
      var dates = metaRows.map(function (r) { return r.dateISO; }).sort();
      state.minDate = dates[0];
      state.maxDate = dates[dates.length - 1];
      if (!state.filterFrom || !state.filterTo || state.presetAll) {
        state.filterFrom = state.minDate;
        state.filterTo = state.maxDate;
      } else {
        if (state.filterTo > state.maxDate) state.filterTo = state.maxDate;
      }
      document.getElementById('dateFrom').min = state.minDate;
      document.getElementById('dateFrom').max = state.maxDate;
      document.getElementById('dateTo').min = state.minDate;
      document.getElementById('dateTo').max = state.maxDate;
      document.getElementById('dateFrom').value = state.filterFrom;
      document.getElementById('dateTo').value = state.filterTo;
      setLive('ok', 'ao vivo');
      var now = new Date();
      document.getElementById('liveUpdated').textContent = 'Última atualização: ' + now.toLocaleTimeString('pt-BR');
      render();
    }).catch(function (err) {
      console.error(err);
      var reason = (err && err.message) ? err.message : 'erro desconhecido';
      var hasData = state.metaRows.length > 0;
      setLive('err', 'falha ao atualizar: ' + reason + (hasData ? ' (dados anteriores mantidos)' : ''));
    }).finally(function () {
      document.getElementById('btnRefresh').disabled = false;
    });
  }

  function setLive(kind, text) {
    var dot = document.getElementById('liveDot');
    dot.className = 'live-dot' + (kind === 'loading' ? ' loading' : kind === 'err' ? ' err' : '');
    document.getElementById('liveStatus').textContent = text;
  }

  // ============================= RENDER =============================
  function getFiltered() {
    var f = state.filterFrom, t = state.filterTo;
    var meta = state.metaRows.filter(function (r) { return r.dateISO >= f && r.dateISO <= t; });
    var leads = state.leadRows.filter(function (r) { return r.dateOnly >= f && r.dateOnly <= t; });
    return { meta: meta, leads: leads };
  }

  function render() {
    var filt = getFiltered();
    var meta = filt.meta, leadsF = filt.leads;

    document.getElementById('filterRangeLabel').textContent =
      isoToBR(state.filterFrom) + ' → ' + isoToBR(state.filterTo) +
      ' · ' + meta.length + ' linhas de mídia · ' + leadsF.length + ' leads';

    var root = document.getElementById('appRoot');
    if (!root.querySelector('.content')) {
      root.innerHTML = buildSkeleton();
      bindTabs();
      document.getElementById('leadSearch').addEventListener('input', applyLeadSearch);
    }

    renderVisaoGeral(meta, leadsF);
    renderCriativos(meta);
    renderPublicos(meta);
    renderAnaliseDiaria(meta);
    renderLeads(leadsF);
  }

      '<div class="comp-text">' + compareStatText(quente, frio, cplDiff) + '</div></div>';

  function detailBreakdown(rows, keyFn) {
    var g = groupBy(rows, keyFn);
    var out = [];
    for (var i = 0; i < g.keys.length; i++) {
      var k = g.keys[i], a = agg(g.map[k]);
      if (a.leads > 0) out.push({ key: k, a: a });
    }
    out.sort(function (a, b) { return b.a.leads - a.a.leads; });
    return out;
  }
  function compareStatText(quente, frio, cplDiff) {
    var winner = null, diffTxt = '';
    if (cplDiff !== null) {
      if (cplDiff > 0) { winner = 'Frio'; diffTxt = fmtPct(Math.abs(cplDiff)) + ' menor'; }
      else if (cplDiff < 0) { winner = 'Quente'; diffTxt = fmtPct(Math.abs(cplDiff)) + ' menor'; }
    }
    var totalLeads = quente.leads + frio.leads;
    var pctF = totalLeads ? (frio.leads / totalLeads * 100) : 0;
    if (!winner) return 'Dados insuficientes para comparar CPL no período selecionado.';
    return 'O público <b>' + winner + '</b> converte a um CPL <b>' + diffTxt + '</b> que o outro grupo, e o Frio responde por <b>' + fmtPct(pctF) + '</b> dos leads do período.';
  }
  function kpiCard(label, value, sub, colorClass) {

  function metricCard(lbl, val, color) {

  }
  function profileCard(title, leadsF, field, order) {
    var total = leadsF.length;

    var items = order.map(function (o) {
      var c = counts[o.v] || 0;
      var pct = total ? (c / total * 100) : 0;
      return '<div class="profile-item"><div class="top"><span>' + esc(o.label) + '</span><b>' + fmtPct(pct, 1) + '</b></div><div class="profile-bar"><span style="width:' + pct.toFixed(2) + '%"></span></div></div>';
    }).join('');

  }

        scales: {
          x: { ticks: { color: 'rgba(255,255,255,.45)', font: { family: 'DM Mono', size: 10 }, maxRotation: 90, minRotation: 90, autoSkip: true, maxTicksLimit: 32 }, grid: { color: 'rgba(255,255,255,0.06)' } },
          y: { position: 'left', ticks: { color: 'rgba(255,255,255,.45)', font: { family: 'DM Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' }, title: { display: true, text: 'Leads', color: 'rgba(255,255,255,.45)' } },
          y1: { position: 'right', ticks: { color: 'rgba(255,255,255,.45)', font: { family: 'DM Mono', size: 10 } }, grid: { display: false }, title: { display: true, text: 'CPL (R$)', color: 'rgba(255,255,255,.45)' } }
        }
      }
    });
  }

  // ---------- CRIATIVOS ----------
  function renderCriativos(meta) {
    var g = groupBy(meta, function (r) { return r.ad; });
    var creatives = g.keys.map(function (k) {
      var rows = g.map[k], a = agg(rows);
      // link: use the one from the most recent dated row for this creative
      var latest = rows.reduce(function (best, r) { return (!best || r.dateISO > best.dateISO) ? r : best; }, null);
      return { ad: k, link: latest ? latest.link : '', a: a };
    });
    creatives.sort(function (x, y) { return cplSortAsc(x.a, y.a); });
    var n = creatives.length;
    var html = '<div class="sec-title">Ranking de Criativos (melhor → pior CPL)</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Criativo</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th><th>Link</th></tr></thead><tbody>' +
      creatives.map(function (c, i) {
        var a = c.a;
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(c.ad) + '</td><td>' + fmtBRL(a.invest) + '</td><td>' + fmtInt(a.impr) + '</td><td>' + fmtInt(a.clicks) + '</td><td>' + fmtInt(a.leads) + '</td><td>' + fmtPct(a.ctr) + '</td><td>' + fmtCPC(a.clicks, a.cpc) + '</td><td>' + fmtCPL(a.leads, a.cpl) + '</td><td>' + (c.link ? "<a class='link-ad' href='" + esc(c.link) + "' target='_blank' rel='noopener'>ver anúncio</a>" : '—') + '</td></tr>';
      }).join('') +
      '</tbody></table></div>';
    document.getElementById('criativos').innerHTML = html;
  }

  // ---------- PUBLICOS ----------
  function renderPublicos(meta) {
    var g = groupBy(meta, function (r) { return r.adset; });
    var publicos = g.keys.map(function (k) {
      var rows = g.map[k], a = agg(rows);
      return { adset: k, temp: classifyTemp(k), a: a };
    });
    publicos.sort(function (x, y) { return cplSortAsc(x.a, y.a); });
    var n = publicos.length;
    var html = '<div class="sec-title">Ranking de Públicos (melhor → pior CPL)</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Conjunto</th><th>Temp.</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>Leads</th><th>CTR</th><th>CPC</th><th>CPL</th></tr></thead><tbody>' +
      publicos.map(function (p, i) {
        var a = p.a;
        var tempColor = p.temp === 'quente' ? '#e74c3c' : '#42a5f5';
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.adset) + "</td><td><span style='color:" + tempColor + ";font-weight:700;font-size:11px;font-family:\"DM Mono\",monospace'>" + (p.temp === 'quente' ? 'QUENTE' : 'FRIO') + '</span></td><td>' + fmtBRL(a.invest) + '</td><td>' + fmtInt(a.impr) + '</td><td>' + fmtInt(a.clicks) + '</td><td>' + fmtInt(a.leads) + '</td><td>' + fmtPct(a.ctr) + '</td><td>' + fmtCPC(a.clicks, a.cpc) + '</td><td>' + fmtCPL(a.leads, a.cpl) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>';
    document.getElementById('publicos').innerHTML = html;
  }

  // ---------- ANALISE DIARIA ----------
  function renderAnaliseDiaria(meta) {
    var g = groupBy(meta, function (r) { return r.dateISO; });
    var keys = g.keys.slice().sort();
    var qAccRows = [], fAccRows = [];
    var rowsHtml = keys.map(function (k) {
      var rows = g.map[k];
      var qRows = rows.filter(function (r) { return classifyTemp(r.adset) === 'quente'; });
      var fRows = rows.filter(function (r) { return classifyTemp(r.adset) === 'frio'; });
      qAccRows = qAccRows.concat(qRows); fAccRows = fAccRows.concat(fRows);
      var q = agg(qRows), f = agg(fRows);
      return '<tr><td>' + isoToDM(k) + '</td><td>' + fmtBRL(q.invest) + '</td><td>' + fmtInt(q.leads) + '</td><td>' + fmtCPL(q.leads, q.cpl) + '</td><td>' + fmtBRL(f.invest) + '</td><td>' + fmtInt(f.leads) + '</td><td>' + fmtCPL(f.leads, f.cpl) + '</td></tr>';
    }).join('');
    var qTotal = agg(qAccRows), fTotal = agg(fAccRows);
    var totalRow = "<tr class='total'><td>TOTAL</td><td>" + fmtBRL(qTotal.invest) + '</td><td>' + fmtInt(qTotal.leads) + '</td><td>' + fmtCPL(qTotal.leads, qTotal.cpl) + '</td><td>' + fmtBRL(fTotal.invest) + '</td><td>' + fmtInt(fTotal.leads) + '</td><td>' + fmtCPL(fTotal.leads, fTotal.cpl) + '</td></tr>';
    var html = '<div class="sec-title">Comparativo Diário — Público Quente vs Frio</div>' +
      '<div class="tbl-wrap"><table><thead><tr>' +
      '<th rowspan="2">Dia</th><th colspan="3" style="text-align:center;color:#e74c3c">Quente (Engajamento 365D)</th><th colspan="3" style="text-align:center;color:#42a5f5">Frio (Nurse + Prof. Saúde + Profissões)</th>' +
      '</tr><tr><th>Invest.</th><th>Leads</th><th>CPL</th><th>Invest.</th><th>Leads</th><th>CPL</th></tr></thead><tbody>' +
      rowsHtml + totalRow + '</tbody></table></div>';
    document.getElementById('analise-diaria').innerHTML = html;
  }

  // ---------- LEADS ----------
  function renderLeads(leadsF) {
    var sorted = leadsF.slice().sort(function (a, b) { return b.dataISO.localeCompare(a.dataISO); });
    var tbody = document.querySelector('#leadsTable tbody');
    tbody.innerHTML = sorted.map(function (l) {
      var p = l.dateOnly.split('-');
      var dataFmt = p[2] + '/' + p[1] + '/' + p[0] + ' ' + l.hhmm;
      return '<tr><td>' + dataFmt + '</td><td>' + esc(l.nome) + '</td><td>' + esc(fmtPhone(l.telefone)) + '</td></tr>';
    }).join('');
    applyLeadSearch();
  }
  function applyLeadSearch() {
    var el = document.getElementById('leadSearch');
    if (!el) return;
    var q = el.value.trim().toLowerCase();
    document.querySelectorAll('#leadsTable tbody tr').forEach(function (tr) {
      tr.style.display = tr.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
    });
  }

  // ============================= FILTER UI =============================
  function applyPreset(preset) {
    if (!state.maxDate) return;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.preset === preset); });
    if (preset === 'all') {
      state.presetAll = true;
      state.filterFrom = state.minDate;
      state.filterTo = state.maxDate;
    } else {
      state.presetAll = false;
      var days = parseInt(preset, 10);
      // "7d" / "30d" contam sempre até ontem (data real do aparelho), nunca o dia de hoje
      // (que costuma ter dados parciais) — limitado ao intervalo real disponível na planilha.
      var yesterdayISO = isoAddDays(todayLocalISO(), -1);
      var toISO = yesterdayISO < state.maxDate ? yesterdayISO : state.maxDate;
      if (toISO < state.minDate) toISO = state.maxDate;
      var fromISO = isoAddDays(toISO, -(days - 1));
      state.filterFrom = fromISO < state.minDate ? state.minDate : fromISO;
      state.filterTo = toISO;
    }
    document.getElementById('dateFrom').value = state.filterFrom;
    document.getElementById('dateTo').value = state.filterTo;
    render();
  }

  document.querySelectorAll('.preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { applyPreset(btn.dataset.preset); });
  });
  document.getElementById('dateFrom').addEventListener('change', function (e) {
    state.presetAll = false;
    state.filterFrom = e.target.value || state.minDate;
    if (state.filterFrom > state.filterTo) state.filterTo = state.filterFrom;
    document.getElementById('dateTo').value = state.filterTo;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.remove('active'); });
    render();
  });
  document.getElementById('dateTo').addEventListener('change', function (e) {
    state.presetAll = false;
    state.filterTo = e.target.value || state.maxDate;
    if (state.filterTo < state.filterFrom) state.filterFrom = state.filterTo;
    document.getElementById('dateFrom').value = state.filterFrom;
    document.querySelectorAll('.preset-btn').forEach(function (b) { b.classList.remove('active'); });
    render();
  });
  document.getElementById('btnRefresh').addEventListener('click', function () { loadData(); });

  // ============================= INIT =============================
  state.presetAll = true;
  loadData();
  setInterval(loadData, REFRESH_MS);
})();
</script>
</body>
</html>
