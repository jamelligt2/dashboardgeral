<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║           CONFIGURAÇÃO DO CLIENTE — EDITE APENAS AQUI           ║
// ╚══════════════════════════════════════════════════════════════════╝
const CONFIG = {
  CLIENTE: 'Elaine Dluhosch',
  PRODUTO: 'Desafio Corrimento Zero',
  ANO: '2026',

  // ── Planilha (cole aqui o ID da planilha: o trecho entre /d/ e /edit na URL) ──
  SHEET_ID: '1GXdEm9hQ7v-RJzWA8SJvN1kIbxNzz7LPEj_PWipLjOI',
  GERENCIADOR_SHEET: 'Gerenciador',
  WEBHOOK_SHEET: 'Webhook',
  DATA_MINIMA: '',            // 'AAAA-MM-DD' (vazio = sem corte; usar a data de início das campanhas quando souber)

  // ── Produto ───────────────────────────────────────────────────────
  PRODUTO_KEYWORDS: ['corrimento zero', 'desafio corrimento'],
  PRODUTO_PRECO_BASE: 35,     // ingresso. OB = Valor Inicial − 35
  IGNORAR_VALOR_ZERO: true,

  // ── Order bumps (valores do checkout) ─────────────────────────────
  ORDER_BUMPS: [
    { nome: 'Gravação vitalícia', valor: 97 },
    { nome: '120 receitas',       valor: 27 },
    { nome: 'Skincare',           valor: 19.9 }
  ],

  // ── Meta de custo por ingresso vendido ────────────────────────────
  META_VERDE: 30,             // até 30 = verde
  META_AMARELO: 35,           // até 35 = amarelo; acima = vermelho

  // ── Evento ────────────────────────────────────────────────────────
  DATA_EVENTO: '2026-11-24',  // encerra o desafio
  IMPOSTO_PCT: 0,             // imposto fora por enquanto

  // ── Tráfego pago: valores de UTM Source aceitos ───────────────────
  TRAFEGO_SOURCES: ['metaads'],   // normalizado (minúsculas, sem espaço/_/-)

  // ── Colunas do Webhook (por nome de cabeçalho) — schema flat ──────
  W: {
    evento: 'currentStatus|Evento', data: 'sale.paid_at|Data', data2: 'sale.created_at', fatura: 'sale.id|Fatura',
    cliente: 'client.name|Cliente', email: 'client.email|Email', produto: 'product.name|Produto',
    fatTotal: 'sale.total|Valor Total', fatAlt: 'sale.amount', fatInicial: 'Valor Inicial',
    utmSource: 'UTM Source', utmCampaign: 'UTM Campaign', utmMedium: 'UTM Medium', utmContent: 'UTM Content'
  },
  // ── Colunas do Gerenciador (por nome; índice 0-based como reserva) ─
  G: {
    date:['Date|Data',0], campaign:['Campaign Name|Campanha',1], adset:['Adset Name|Conjunto de anúncios',2], ad:['Ad Name|Anúncio',3], link:['Permalink|Link do anúncio',4],
    inv:['Spend|Investimento',5], reach:['Reach|Alcance',6], imp:['Impressions|Impressões',7], cliques:['Link Clicks|Clicks',8], pv:['Landing Page View|Page View',9], ck:['Initiate Checkout|checkout',-1],
    statusCampaign:['Campaign Status|Status_campanha',-1], statusAdset:['Adset Status|Status_conjunto',-1], statusAd:['Ad Status|Status_anúncio',-1]
  }
};

// ───────────────────────── utilitários ─────────────────────────
const $ = id => document.getElementById(id);
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const fmtBRL = v => (v == null || isNaN(v) || v === 0) ? '—' : 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtBRL0 = v => (v == null || isNaN(v)) ? '—' : 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtInt = v => (v == null || isNaN(v) || v === 0) ? '—' : Math.round(v).toLocaleString('pt-BR');
const fmtPct = v => (v == null || isNaN(v) || !isFinite(v) || v === 0) ? '—' : v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
const fmtX = v => (v == null || isNaN(v) || !isFinite(v) || v === 0) ? '—' : v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + 'x';
const div = (a, b) => b > 0 ? a / b : null;
const fmtDM = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function money(v) {
  let s = String(v == null ? '' : v).replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseDate(v) {
  const s = String(v == null ? '' : v).trim();
  if (/^\d{4}-\d{2}-\d{2}T.*(Z|[+-]\d{2}:?\d{2})$/.test(s)) {
    const t = Date.parse(s.replace(/\.\d+/, ''));
    if (!isNaN(t)) return new Date(t - 3 * 3600e3).toISOString().slice(0, 10);
  }
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return '';
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function findCol(hdr, name) {
  for (const alt of String(name).split('|')) {
    const n = norm(alt);
    let i = hdr.findIndex(h => norm(h) === n);
    if (i < 0) i = hdr.findIndex(h => norm(h).includes(n));
    if (i >= 0) return i;
  }
  return -1;
}
async function fetchSheetCSV(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const resp = await fetch(url, {signal: controller.signal});
    clearTimeout(timeout);
    if (!resp.ok) throw new Error(`Planilha "${sheetName}": HTTP ${resp.status}. Verifique se está pública.`);
    const text = await resp.text();
    if (text.includes('Signin') || text.includes('accounts.google')) throw new Error(`Planilha "${sheetName}" requer login. Defina como pública (qualquer pessoa com o link pode ver).`);
    return text;
  } catch (e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') throw new Error(`Timeout ao carregar "${sheetName}".`);
    throw e;
  }
}

// ───────────────────────── processamento ─────────────────────────
let GROWS = [], SALES = [], DIAS = [], DIAG = {};
const isTrafego = s => CONFIG.TRAFEGO_SOURCES.includes((s.utmSource || '').toLowerCase().replace(/[\s_-]/g, ''));
const isPaused = s => String(s || '').toUpperCase().includes('PAUSED');

function processGerenciador(rows) {
  if (rows.length < 2) return [];
  const hdr = rows[0], idx = {};
  for (const [k, [name, fb]] of Object.entries(CONFIG.G)) { const i = findCol(hdr, name); idx[k] = i >= 0 ? i : fb; }
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (!r.some(x => String(x).trim())) continue;
    const g = k => r[idx[k]] == null ? '' : String(r[idx[k]]).trim();
    const data = parseDate(g('date')); if (!data) continue;
    if (CONFIG.DATA_MINIMA && data < CONFIG.DATA_MINIMA) continue;
    out.push({
      data, campanha: g('campaign'), adset: g('adset'), ad: g('ad'), link: g('link'),
      inv: money(g('inv')), reach: money(g('reach')), imp: money(g('imp')), cliques: money(g('cliques')),
      pv: money(g('pv')), ck: money(g('ck')),
      sCamp: g('statusCampaign'), sSet: g('statusAdset'), sAd: g('statusAd')
    });
  }
  return out;
}

const RX_NEG = /reembols|refund|cancel|chargeback|chargedback|estorn|disput|refus|recusad/;
const RX_POS = /pago|paid|aprovad|approved|complete|confirmed/;
const RX_PEND = /pendente|pending|aguardando|aberta|waiting|unpaid|nao paga/;
const RX_IGN = /commission|contract|ping|test/;

function inferirBumps(fatOB) {
  if (fatOB <= 0.01) return [];
  const B = CONFIG.ORDER_BUMPS, n = B.length;
  for (let mask = 1; mask < (1 << n); mask++) {
    let sum = 0; for (let i = 0; i < n; i++) if (mask & (1 << i)) sum += B[i].valor;
    if (Math.abs(sum - fatOB) < 0.06) return B.filter((_, i) => mask & (1 << i)).map(b => b.nome);
  }
  return ['OB (R$ ' + fatOB.toFixed(2).replace('.', ',') + ')'];
}

function processSales(rows) {
  const diag = {linhas: 0, vendas: 0, reembolsadas: 0, semProduto: 0, antesDataMin: 0, naoAprovadas: 0, semData: 0, valorZero: 0, ignoradas: 0, eventos: {}, produtos: {}, fontes: {}};
  if (!rows.length || rows.length < 2) return {sales: [], diag};
  const hdr = rows[0], W = {};
  for (const [k, n] of Object.entries(CONFIG.W)) W[k] = findCol(hdr, n);
  if (W.evento < 0 && W.data < 0) throw new Error(`Aba "${CONFIG.WEBHOOK_SHEET}": não encontrei as colunas Evento/Data. Confira o nome da aba e os cabeçalhos.`);
  const metaCols = [];
  hdr.forEach((h, i) => { const m = String(h).match(/^saleMetas\[(\d+)\]\.meta_key$/i); if (m) { const v = hdr.findIndex(x => String(x).toLowerCase() === 'salemetas[' + m[1] + '].meta_value'); if (v >= 0) metaCols.push([i, v]); } });
  const metaOf = r => { const o = {}; metaCols.forEach(([k, v]) => { const key = String(r[k] || '').trim().toLowerCase(); if (key) o[key] = String(r[v] == null ? '' : r[v]).trim(); }); return o; };
  const kwOk = p => !CONFIG.PRODUTO_KEYWORDS.length || CONFIG.PRODUTO_KEYWORDS.some(k => norm(p).includes(norm(k)));
  const tx = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (!r.some(x => String(x).trim())) continue;
    diag.linhas++;
    const g = k => W[k] >= 0 ? String(r[W[k]] == null ? '' : r[W[k]]).trim() : '';
    const evt = g('evento'), txt = norm(evt).replace(/[_.\-]+/g, ' ');
    diag.eventos[evt || '(vazio)'] = (diag.eventos[evt || '(vazio)'] || 0) + 1;
    if (RX_IGN.test(txt)) { diag.ignoradas++; continue; }
    const data = parseDate(g('data')) || parseDate(g('data2'));
    const key = g('fatura') || (norm(g('email')) + '|' + data);
    if (!tx.has(key)) tx.set(key, {rows: [], neg: false});
    const grp = tx.get(key);
    const neg = RX_NEG.test(txt);
    const pos = !neg && !RX_PEND.test(txt) && (RX_POS.test(txt) || (data && !txt));
    if (neg) grp.neg = true;
    if (pos) grp.rows.push({r, data});
  }
  const sales = [];
  for (const [key, grp] of tx) {
    if (grp.neg) { diag.reembolsadas++; continue; }
    if (!grp.rows.length) { diag.naoAprovadas++; continue; }
    const gOf = r => k => W[k] >= 0 ? String(r[W[k]] == null ? '' : r[W[k]]).trim() : '';
    const main = grp.rows.find(x => kwOk(gOf(x.r)('produto'))) || null;
    const first = main || grp.rows[0];
    const g = gOf(first.r), data = first.data;
    const produto = g('produto');
    if (produto) diag.produtos[produto] = (diag.produtos[produto] || 0) + 1;
    if (!data) { diag.semData++; continue; }
    if (CONFIG.DATA_MINIMA && data < CONFIG.DATA_MINIMA) { diag.antesDataMin++; continue; }
    if (!main && produto) { diag.semProduto++; continue; }
    const total = money(g('fatTotal') || g('fatAlt'));
    if (CONFIG.IGNORAR_VALOR_ZERO && total <= 0) { diag.valorZero++; continue; }
    const inicialRaw = g('fatInicial');
    const inicial = inicialRaw ? money(inicialRaw) : total;
    const fatOB = Math.max(0, inicial - CONFIG.PRODUTO_PRECO_BASE);
    const temOB = fatOB > 0.01;
    const s = {
      data, nome: g('cliente'), email: g('email'), fatura: g('fatura'),
      fatTotal: total, fatPrincipal: total - fatOB, fatOB, temOB, bumps: inferirBumps(fatOB),
      utmSource: g('utmSource'), utmMedium: g('utmMedium'), utmCampaign: g('utmCampaign'), utmContent: g('utmContent')
    };
    if (metaCols.length) { const mt = metaOf(first.r); s.utmSource = mt.utm_source || s.utmSource; s.utmMedium = mt.utm_medium || s.utmMedium; s.utmCampaign = mt.utm_campaign || s.utmCampaign; s.utmContent = mt.utm_content || s.utmContent; }
    s.trafego = isTrafego(s);
    diag.fontes[s.utmSource || '(vazio)'] = (diag.fontes[s.utmSource || '(vazio)'] || 0) + 1;
    diag.vendas++;
    sales.push(s);
  }
  return {sales, diag};
}

// ───────────────────────── agregações ─────────────────────────
const inRange = (d, from, to) => (!from || d >= from) && (!to || d <= to);
const cls = c => c == null ? '' : (c <= CONFIG.META_VERDE ? 'green' : c <= CONFIG.META_AMARELO ? 'yellow' : 'red');

function agg(from, to) {
  const g = GROWS.filter(r => inRange(r.data, from, to));
  const s = SALES.filter(x => inRange(x.data, from, to));
  const T = s.filter(x => x.trafego), O = s.filter(x => !x.trafego);
  const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
  const a = {
    inv: sum(g, r => r.inv), imp: sum(g, r => r.imp), cliques: sum(g, r => r.cliques), pv: sum(g, r => r.pv), ck: sum(g, r => r.ck),
    nT: T.length, nO: O.length, nTob: T.filter(x => x.temOB).length, nOob: O.filter(x => x.temOB).length,
    fatT: sum(T, x => x.fatTotal), fatO: sum(O, x => x.fatTotal), obT: sum(T, x => x.fatOB), obO: sum(O, x => x.fatOB)
  };
  a.fat = a.fatT + a.fatO; a.n = a.nT + a.nO;
  const liq = 1 - (CONFIG.IMPOSTO_PCT || 0) / 100;
  a.roas = div(a.fatT * liq, a.inv);
  a.roasTotal = div(a.fat * liq, a.inv);
  a.custoIng = div(a.inv, a.nT);
  a.custoIngTotal = div(a.inv, a.n);
  a.ticket = div(a.fatT, a.nT);
  a.cpc = div(a.inv, a.cliques); a.cpm = div(a.inv, a.imp) == null ? null : div(a.inv, a.imp) * 1000;
  a.ctr = div(a.cliques, a.imp) == null ? null : div(a.cliques, a.imp) * 100;
  return a;
}

function diasTable(from, to) {
  const m = new Map();
  const get = d => { if (!m.has(d)) m.set(d, {data: d, inv: 0, imp: 0, cliques: 0, pv: 0, ck: 0, nT: 0, nO: 0, fatT: 0, fatO: 0}); return m.get(d); };
  GROWS.filter(r => inRange(r.data, from, to)).forEach(r => { const o = get(r.data); o.inv += r.inv; o.imp += r.imp; o.cliques += r.cliques; o.pv += r.pv; o.ck += r.ck; });
  SALES.filter(x => inRange(x.data, from, to)).forEach(x => { const o = get(x.data); if (x.trafego) { o.nT++; o.fatT += x.fatTotal; } else { o.nO++; o.fatO += x.fatTotal; } });
  return [...m.values()].sort((a, b) => a.data.localeCompare(b.data));
}

function groupBy(from, to, rowKey, saleKey) {
  const gs = GROWS.filter(r => inRange(r.data, from, to));
  const ss = SALES.filter(x => inRange(x.data, from, to) && x.trafego);
  const m = new Map();
  gs.forEach(r => {
    const k = r[rowKey] || '(sem nome)';
    if (!m.has(k)) m.set(k, {nome: k, inv: 0, imp: 0, cliques: 0, pv: 0, ck: 0, link: '', ativo: false, ultima: '', nV: 0, fat: 0});
    const o = m.get(k);
    o.inv += r.inv; o.imp += r.imp; o.cliques += r.cliques; o.pv += r.pv; o.ck += r.ck;
    if (r.link && !o.link) o.link = r.link;
    if (r.data >= o.ultima) { o.ultima = r.data; o.ativo = !isPaused(r.sAd) && !isPaused(r.sSet) && !isPaused(r.sCamp) && (r.sAd || r.sSet || r.sCamp); }
  });
  const keys = [...m.keys()];
  let sem = 0;
  ss.forEach(x => {
    const u = norm(x[saleKey]);
    const hit = u ? keys.find(k => norm(k) === u) || keys.find(k => u.length >= 4 && (norm(k).includes(u) || u.includes(norm(k)))) : null;
    if (hit) { const o = m.get(hit); o.nV++; o.fat += x.fatTotal; } else sem++;
  });
  const arr = [...m.values()];
  arr.forEach(o => {
    o.ctr = div(o.cliques, o.imp) == null ? null : div(o.cliques, o.imp) * 100;
    o.cpc = div(o.inv, o.cliques); o.custo = div(o.inv, o.nV); o.roas = div(o.fat, o.inv);
  });
  return {arr, sem};
}

}

function diasAteEvento() {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const ev = new Date(CONFIG.DATA_EVENTO + 'T00:00:00');
  return Math.round((ev - hoje) / 86400000);
}

function renderTrafego(from, to) {

  const dias = diasAteEvento();

  let h = `<div class="meta-legend"><span class="countdown">🎟️ ${cd}</span><span><span class="dot g"></span>Custo por ingresso até ${fmtBRL0(CONFIG.META_VERDE)}</span><span><span class="dot y"></span>até ${fmtBRL0(CONFIG.META_AMARELO)}</span><span><span class="dot r"></span>acima de ${fmtBRL0(CONFIG.META_AMARELO)}</span></div>`;
  h += `<div class="kpi-grid">` +
    kpi('Investimento (Meta Ads)', fmtBRL(a.inv), 'orange') +

    kpi('ROAS Tráfego', fmtX(a.roas), a.roas >= 1 ? 'green' : (a.roas ? 'red' : '')) +
    kpi('Custo por ingresso', fmtBRL(a.custoIng), cls(a.custoIng), 'meta: verde ≤ 30 · amarelo ≤ 35') +
    kpi('Vendas Tráfego', fmtInt(a.nT) + (a.nTob ? ` <span style="font-size:12px;color:#f1c40f">+${a.nTob} OB</span>` : ''), 'orange', 'ingressos vendidos') +
    kpi('Vendas Orgânico', fmtInt(a.nO) + (a.nOob ? ` <span style="font-size:12px;color:#f1c40f">+${a.nOob} OB</span>` : ''), '') +
    kpi('Fat. OB Tráfego', fmtBRL(a.obT), 'yellow') +
    kpi('Fat. OB Orgânico', fmtBRL(a.obO), '') +
    kpi('Fat. Orgânico', fmtBRL(a.fatO), '') +
    kpi('Ticket Médio', fmtBRL(a.ticket), '', 'tráfego, com OB') +
    kpi('Cliques', fmtInt(a.cliques), '') + kpi('Impressões', fmtInt(a.imp), '') +
    kpi('CPC', fmtBRL(a.cpc), '') + kpi('CPM', fmtBRL(a.cpm), '') +
  `</div>`;

  // funil
  const etapas = [['Cliques', a.cliques], ['Page Views', a.pv], ['Checkouts', a.ck], ['Compras (tráfego)', a.nT]];
  const max = Math.max(a.cliques, 1);
  h += `<div class="sec-title">Funil de conversão</div><div class="funil-section"><div>` +
    etapas.map(([l, v]) => `<div class="funil-bar-wrap"><div class="funil-label"><span>${l}</span><span style="font-family:'DM Mono',monospace">${fmtInt(v)}</span></div><div class="funil-bar-bg"><div class="funil-bar-fill" style="width:${Math.max(v / max * 100, v > 0 ? 1.5 : 0)}%"></div></div></div>`).join('') +
    `</div><div class="taxa-grid">` +
    [['Clique → Page View', div(a.pv, a.cliques) == null ? null : div(a.pv, a.cliques) * 100],
     ['Page View → Checkout', div(a.ck, a.pv) == null ? null : div(a.ck, a.pv) * 100],
     ['Checkout → Compra', div(a.nT, a.ck) == null ? null : div(a.nT, a.ck) * 100],
     ['Page View → Compra', div(a.nT, a.pv) == null ? null : div(a.nT, a.pv) * 100]]
      .map(([l, v]) => `<div class="taxa-item"><span>${l}</span><span class="taxa-val">${fmtPct(v)}</span></div>`).join('') + `</div></div>`;

  // order bumps
  const T = SALES.filter(x => inRange(x.data, from, to) && x.trafego);
  const nIng = T.length;
  h += `<div class="sec-title">Order bumps (vendas de tráfego)</div><div class="tbl-wrap"><table><thead><tr><th>Order bump</th><th>Preço</th><th>Vendidos</th><th>Take rate</th><th>Faturamento</th></tr></thead><tbody>` +
    CONFIG.ORDER_BUMPS.map(b => { const n = T.filter(x => x.bumps.includes(b.nome)).length; return `<tr><td>${esc(b.nome)}</td><td>${fmtBRL(b.valor)}</td><td>${fmtInt(n)}</td><td>${nIng ? fmtPct(n / nIng * 100) : '—'}</td><td>${fmtBRL(n * b.valor)}</td></tr>`; }).join('') +
    `</tbody></table></div>`;

  // compradores
  const buy = SALES.filter(x => inRange(x.data, from, to)).sort((x, y) => y.data.localeCompare(x.data)).slice(0, 60);

    : `<div class="ob-info">Nenhuma venda registrada no período ainda.</div>`;

  h += `<button class="diag-btn" onclick="toggleDiag()">ⓘ Diagnóstico da leitura de vendas</button><div class="diag" id="diag-box">${esc(diagTexto())}</div>`;
  $('tab-trafego').innerHTML = h;
}

  if (!list.length) { $(tab).innerHTML = h + `<div class="ob-info">Sem dados no período.</div>`; return; }
  const cards = list.map(o => `<div class="${prefix === 'cri' ? 'cri-card' : 'pub-card'} ${o.ativo ? 'ativo' : ''}">` +
    `<div class="${prefix === 'cri' ? 'cri-card-header' : 'pub-card-header'}"><div class="${prefix === 'cri' ? 'cri-name' : 'pub-name'}">${esc(o.nome)}</div><span class="cri-badge ${o.ativo ? 'ativo' : 'inativo'}">${o.ativo ? 'Ativo' : 'Inativo'}</span></div>` +
    `<div class="cri-metrics">` +
    [['Invest.', fmtBRL(o.inv), ''], ['Vendas', fmtInt(o.nV), ''], ['Custo/ingresso', fmtBRL(o.custo), cls(o.custo)], ['ROAS', fmtX(o.roas), ''], ['CTR', fmtPct(o.ctr), ''], ['CPC', fmtBRL(o.cpc), '']]
      .map(([l, v, c]) => `<div class="cri-metric"><span class="cri-metric-label">${l}</span><span class="cri-metric-val ${c} ${l === 'Custo/ingresso' ? 'hl' : ''}">${v}</span></div>`).join('') + `</div>` +
    (o.link ? `<a class="cri-link" href="${esc(o.link)}" target="_blank" rel="noopener">Ver anúncio ↗</a>` : '') + `</div>`).join('');
  h += `<div class="${prefix === 'cri' ? 'cri-grid' : 'pub-grid'}">${cards}</div>`;
  h += `<div class="tbl-wrap"><table><thead><tr><th>${titulo}</th><th>Status</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>PV</th><th>Checkouts</th><th>Vendas</th><th>Fat.</th><th>Custo/ingresso</th><th>ROAS</th></tr></thead><tbody>` +
    list.map(o => `<tr><td>${esc(o.nome)}</td><td>${o.ativo ? 'Ativo' : 'Inativo'}</td><td>${fmtBRL(o.inv)}</td><td>${fmtInt(o.imp)}</td><td>${fmtInt(o.cliques)}</td><td>${fmtPct(o.ctr)}</td><td>${fmtBRL(o.cpc)}</td><td>${fmtInt(o.pv)}</td><td>${fmtInt(o.ck)}</td><td>${fmtInt(o.nV)}</td><td>${fmtBRL(o.fat)}</td><td class="${cls(o.custo)}">${fmtBRL(o.custo)}</td><td>${fmtX(o.roas)}</td></tr>`).join('') + `</tbody></table></div>`;
  $(tab).innerHTML = h;
}
function setGrp(prefix, k, v) { (prefix === 'cri' ? CRI : PUB)[k] = v; renderAll(); }

function periodoTabela(tab, key, titulo, from, to) {
  const dias = diasTable(from, to), m = new Map();
  dias.forEach(d => {
    let k;
    if (key === 'sem') { const dt = new Date(d.data + 'T00:00:00'); const dow = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - dow); k = dt.toISOString().slice(0, 10); }
    else k = d.data.slice(0, 7);
    if (!m.has(k)) m.set(k, {k, inv: 0, imp: 0, cliques: 0, pv: 0, ck: 0, nT: 0, nO: 0, fatT: 0, fatO: 0});
    const o = m.get(k); ['inv', 'imp', 'cliques', 'pv', 'ck', 'nT', 'nO', 'fatT', 'fatO'].forEach(f => o[f] += d[f]);
  });
  const arr = [...m.values()].sort((a, b) => a.k.localeCompare(b.k));
  const lab = k => key === 'sem' ? (() => { const e = new Date(k + 'T00:00:00'); e.setDate(e.getDate() + 6); return fmtDM(k) + ' – ' + fmtDM(e.toISOString().slice(0, 10)); })() : k.slice(5, 7) + '/' + k.slice(0, 4);
  let h = `<div class="sec-title">${titulo}</div><div class="tbl-wrap"><table><thead><tr><th>Período</th><th>Invest.</th><th>Fat. Tráfego</th><th>ROAS</th><th>Ingressos (tráfego)</th><th>Custo/ingresso</th><th>Orgânico</th><th>CTR</th><th>CPC</th></tr></thead><tbody>` +
    [...arr].reverse().map(o => { const c = div(o.inv, o.nT); return `<tr><td>${lab(o.k)}</td><td>${fmtBRL(o.inv)}</td><td>${fmtBRL(o.fatT)}</td><td>${fmtX(div(o.fatT, o.inv))}</td><td>${fmtInt(o.nT)}</td><td class="${cls(c)}">${fmtBRL(c)}</td><td>${fmtInt(o.nO)}</td><td>${fmtPct(div(o.cliques, o.imp) == null ? null : div(o.cliques, o.imp) * 100)}</td><td>${fmtBRL(div(o.inv, o.cliques))}</td></tr>`; }).join('') + `</tbody></table></div>`;
  h += `<div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento</h4><canvas id="ch-${key}1"></canvas></div><div class="chart-card"><h4>CTR (%)</h4><canvas id="ch-${key}2"></canvas></div></div>`;
  $(tab).innerHTML = h;
  const lb = arr.map(o => lab(o.k));
  chart(`ch-${key}1`, {type: 'bar', data: {labels: lb, datasets: [{label: 'Investimento', data: arr.map(o => o.inv), backgroundColor: COR1}]}, options: chartOpts});
  chart(`ch-${key}2`, {type: 'line', data: {labels: lb, datasets: [{label: 'CTR %', data: arr.map(o => (div(o.cliques, o.imp) || 0) * 100), borderColor: COR2, backgroundColor: COR2, tension: .3}]}, options: chartOpts});
}

// ───────────────────────── filtro de data / abas ─────────────────────────
function allDates() { return [...GROWS.map(r => r.data), ...SALES.map(s => s.data)].filter(Boolean).sort(); }
function setPreset(days, btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active');
  const ds = allDates(); if (!ds.length) { renderAll(); return; }
  const first = ds[0], last = ds[ds.length - 1];
  if (days === 'all') { $('dateFrom').value = first; $('dateTo').value = last; }
  else { const e = new Date(last + 'T00:00:00'); e.setDate(e.getDate() - (days - 1)); const f = e.toISOString().slice(0, 10); $('dateFrom').value = f < first ? first : f; $('dateTo').value = last; }
  renderAll();
}
function onDateChange() { document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active')); renderAll(); }
function showTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active');
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active')); $('tab-' + id).classList.add('active');
  renderAll();
}
function renderAll() {
  const from = $('dateFrom').value, to = $('dateTo').value;
  $('range-info').textContent = (from && to) ? fmtDM(from) + ' → ' + fmtDM(to) : '';
  renderTrafego(from, to); renderVisao(from, to);
  renderGrupo('tab-criativos', CRI, 'cri', 'ad', 'utmContent', 'Anúncio', from, to);
  renderGrupo('tab-publicos', PUB, 'pub', 'adset', 'utmMedium', 'Conjunto', from, to);
  periodoTabela('tab-semanal', 'sem', 'Semana a semana (segunda a domingo)', from, to);
  periodoTabela('tab-mensal', 'mes', 'Mês a mês', from, to);
}

async function loadData() {
  $('loading-overlay').style.display = 'flex'; $('erro-box').innerHTML = '';
  try {
    if (!CONFIG.SHEET_ID || CONFIG.SHEET_ID.startsWith('COLE_AQUI')) throw new Error('Falta configurar o ID da planilha (CONFIG.SHEET_ID).');
    $('loading-msg').textContent = 'Carregando Gerenciador...';
    const g = parseCSV(await fetchSheetCSV(CONFIG.GERENCIADOR_SHEET));
    $('loading-msg').textContent = 'Carregando vendas...';
    const w = parseCSV(await fetchSheetCSV(CONFIG.WEBHOOK_SHEET));
    GROWS = processGerenciador(g);
    const r = processSales(w); SALES = r.sales.sort((a, b) => b.data.localeCompare(a.data)); DIAG = r.diag;
    DIAS = diasTable('', '');
    const keep = $('dateFrom').value && $('dateTo').value && document.querySelector('.preset-btn.active') === null;
    if (!keep) setPreset('all', $('btn-all')); else renderAll();
    console.log('[Elaine] diag', DIAG);
  } catch (e) {
    $('erro-box').innerHTML = `<div class="erro"><b>Não foi possível carregar os dados.</b><br>${esc(e.message)}</div>`;
    GROWS = []; SALES = []; renderAll();
  } finally { $('loading-overlay').style.display = 'none'; }
}
document.addEventListener('DOMContentLoaded', () => { document.title = CONFIG.PRODUTO + ' · ' + CONFIG.CLIENTE + ' — Jamelli GT'; loadData(); });
</script>
