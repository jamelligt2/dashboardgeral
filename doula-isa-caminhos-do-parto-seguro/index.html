// ═══════════════ FORMATAÇÃO BR ═══════════════
const isNum=v=>typeof v==='number'&&isFinite(v);
const fBRL=(v,d=2)=>(!isNum(v)||v===0)?'—':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fN=v=>!isNum(v)?'—':Math.round(v).toLocaleString('pt-BR');
const fP=(v,d=2,keep0=false)=>(!isNum(v)||(v===0&&!keep0))?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const fX=(v,d=2)=>(!isNum(v)||v===0)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'x';
const fS=(v,d=1)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const div=(a,b)=>b>0?a/b:null;
const dBR=s=>s?s.split('-').reverse().join('/'):'—';
const dShort=s=>s?s.split('-').reverse().slice(0,2).join('/'):'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');

// ═══════════════ CSV / SHEETS ═══════════════
function parseCSV(text){
  const out=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur);cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; if(row.length>1||row[0]!=='')out.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  return out;
}
function parseNum(v){
  if(v==null)return 0; let s=String(v).replace(/R\$|\s|%/g,''); if(!s||s==='-')return 0;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function parseDateAny(v){
  if(!v)return '';
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/))) return `${m[3]}-${m[2]}-${m[1]}`;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s); if(isNaN(d)) return '';
  return d.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
}
async function fetchSheetCSV(sheetName){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(t);
    if(!r.ok) throw new Error(`Planilha "${sheetName}": HTTP ${r.status}. Verifique se está pública.`);
    const text=await r.text();
    if(text.includes('Signin')||text.includes('accounts.google')) throw new Error(`Planilha "${sheetName}" requer login. Defina como pública.`);
    return text;
  }catch(e){ clearTimeout(t); if(e.name==='AbortError') throw new Error(`Timeout ao carregar "${sheetName}".`); throw e; }
}
function colFinder(headers){
  const H=headers.map(h=>String(h||'').trim().toLowerCase());
  return (...pats)=>{ for(const p of pats){ const i=H.findIndex(h=>h===p); if(i>=0)return i; } for(const p of pats){ const i=H.findIndex(h=>h.includes(p)); if(i>=0)return i; } return -1; };
}
function parseGerenciador(csv){
  const t=parseCSV(csv); if(t.length<2) return [];
  const f=colFinder(t[0]);
  const c={date:f('date','data'),spend:f('spend','investimento','amount spent'),link:f('action link clicks','link clicks','cliques no link'),lpv:f('action landing page view','landing page view','page view'),
    ic:f('action omni initiated checkout','initiated checkout','checkout'),buy:f('action omni purchase','omni purchase','purchase'),campaign:f('campaign name','campanha'),adset:f('adset name','conjunto'),
    ad:f('ad name','anúncio','anuncio'),reach:f('reach','alcance'),imp:f('impressions','impressões','impressoes'),permalink:f('instagram permalink url','permalink','link do anúncio')};
  if(c.date<0||c.spend<0||c.ad<0) throw new Error('Cabeçalho do Gerenciador não reconhecido.');
  const g=(r,i)=>i>=0?r[i]:'';
  return t.slice(1).map(r=>({date:parseDateAny(g(r,c.date)),spend:parseNum(g(r,c.spend)),link:parseNum(g(r,c.link)),lpv:parseNum(g(r,c.lpv)),ic:parseNum(g(r,c.ic)),buy:parseNum(g(r,c.buy)),
    campaign:g(r,c.campaign),adset:g(r,c.adset),ad:g(r,c.ad),reach:parseNum(g(r,c.reach)),imp:parseNum(g(r,c.imp)),permalink:g(r,c.permalink)})).filter(r=>r.date&&r.date>=CONFIG.DATA_MINIMA);
}
function parseWebhook(csv){
  const t=parseCSV(csv); if(t.length<2) return [];
  const H=t[0].map(h=>String(h||'').trim().toLowerCase());
  const ix=n=>H.indexOf(n), pick=(...ns)=>{for(const n of ns){const i=ix(n);if(i>=0)return i;}return -1;};
  const iId=pick('data.id','data.transaction.id','id'), iSt=pick('data.status'), iDt=pick('data.paidat','data.createdat','sentdate'),
        iNm=pick('data.buyer.name','data.student.name'), iEm=pick('data.buyer.email','data.student.email'),
        iVal=pick('data.price.paid.value','data.paid.value','data.price.value'),
        uS=pick('data.utm.source'),uM=pick('data.utm.medium'),uC=pick('data.utm.campaign'),uT=pick('data.utm.content');
  const bumpIdx=[], nameIdx=[];
  H.forEach((h,i)=>{ let m=h.match(/^data\.items\[(\d+)\]\.isbump$/); if(m){ bumpIdx.push([i,H.indexOf(`data.items[${m[1]}].price.value`)]); }
                     m=h.match(/^data\.items\[(\d+)\]\.name$/); if(m) nameIdx.push(i); });
  const g=(r,i)=>i>=0?(r[i]||''):'';
  const truthy=v=>['true','1','sim','verdadeiro'].includes(String(v).trim().toLowerCase());
  const map=new Map(); let aprovadasTotal=0;
  t.slice(1).forEach((r,k)=>{
    const st=String(g(r,iSt)).trim().toLowerCase(); if(!CONFIG.STATUS_APROVADO.includes(st)) return;
    const data=parseDateAny(g(r,iDt)); if(!data||data<CONFIG.DATA_MINIMA) return;
    aprovadasTotal++;
    const key=g(r,iId)||(g(r,iEm)+data+k);
    const nomes=nameIdx.map(i=>String(r[i]||'').toLowerCase()).join(' | ');
    map.set(key,{data,nome:g(r,iNm),email:g(r,iEm),val:parseNum(g(r,iVal)),
      ob:bumpIdx.reduce((s,[b,p])=>truthy(r[b])?s+parseNum(g(r,p)):s,0),
      utmSource:g(r,uS),utmMedium:g(r,uM),utmCampaign:g(r,uC),utmContent:g(r,uT),_nomes:nomes});
  });
  let list=[...map.values()];
  const cents = CONFIG.VALORES_EM_CENTAVOS!==null ? CONFIG.VALORES_EM_CENTAVOS : (list.length && [...list].map(s=>s.val).sort((a,b)=>a-b)[Math.floor(list.length/2)]>=1000);
  const filtrado=list.filter(s=>s._nomes.includes(CONFIG.PRODUTO_NOME));
  if(!filtrado.length && list.length){ SALES_WARN=`Nenhuma venda casou com o produto "${CONFIG.PRODUTO_NOME}" — exibindo todas as vendas aprovadas.`; } else list=filtrado;
  return list.map(s=>{ const k=cents?100:1; const fatTotal=s.val/k, fatOB=s.ob/k; return {data:s.data,nome:s.nome,email:s.email,fatTotal,fatOB,fatPrincipal:fatTotal-fatOB,utmSource:s.utmSource,utmMedium:s.utmMedium,utmCampaign:s.utmCampaign,utmContent:s.utmContent}; })
    .sort((a,b)=>b.data.localeCompare(a.data));
}
const isTrafego=s=>CONFIG.SOURCES_TRAFEGO.includes(String(s.utmSource||'').toLowerCase().replace(/[\s_-]/g,''));

// ═══════════════ CARGA ═══════════════
async function loadData(){
  const ov=document.getElementById('loading-overlay'); ov.style.display='flex';
  document.getElementById('loading-msg').textContent='Conectando com a planilha...';
  SALES_WARN='';
  try{
    const gcsv=await fetchSheetCSV(G_SHEET);
    ROWS=parseGerenciador(gcsv); if(!ROWS.length) throw new Error('Aba Gerenciador sem linhas após a data mínima.');
    document.getElementById('loading-msg').textContent='Lendo vendas...';
    try{ SALES=parseWebhook(await fetchSheetCSV(W_SHEET)); }catch(e){ SALES=[]; SALES_WARN='Aba Webhook indisponível: '+e.message; }
    MODE='live'; MODE_NOTE='';
  }catch(e){
    ROWS=SNAPSHOT.rows.map(r=>({...r})); SALES=[]; MODE='snapshot'; MODE_NOTE=e.message;
  }
  const last=ROWS.reduce((m,r)=>r.date>m?r.date:m,''); ACTIVE_ADS=new Set(); ACTIVE_ADSETS=new Set();
  ROWS.forEach(r=>{ if(r.date===last&&r.imp>0){ACTIVE_ADS.add(r.ad);ACTIVE_ADSETS.add(r.adset);} });
  const chipEl=document.getElementById('src-chip');
  if(MODE==='live'){ chipEl.className='src-chip live'; chipEl.textContent='● Ao vivo · planilha'; chipEl.title='Dados lidos direto da planilha do Google'; }
  else { chipEl.className='src-chip snap'; chipEl.textContent='● Snapshot Meta Ads · '+SNAPSHOT.geradoEm; chipEl.title='Planilha privada — exibindo dados extraídos da API do Meta Ads. '+MODE_NOTE; }
  document.getElementById('foot').innerHTML=`Jamelli GT · Tráfego Pago · ${esc(CONFIG.CLIENTE)} · Cliques = cliques no link · Visitas = visualizações da página de destino (Pixel) · Faturamento sempre do Webhook (Kiwify) · ${MODE==='live'?'Fonte: planilha ao vivo':'Fonte: snapshot da API do Meta Ads ('+SNAPSHOT.geradoEm+'); nenhuma venda registrada no Webhook até essa data'}`;
  const ds=[...ROWS.map(r=>r.date),...SALES.map(s=>s.data)].filter(Boolean).sort();
  const di=document.getElementById('dateFrom'), dt=document.getElementById('dateTo');
  di.min=dt.min=ds[0]; di.max=dt.max=ds[ds.length-1];
  setPreset('all',document.getElementById('btn-all'));
  ov.style.display='none';
}

// ═══════════════ FILTRO DE DATA ═══════════════
function inRange(d){ return (!FROM||d>=FROM)&&(!TO||d<=TO); }
const fRows=()=>ROWS.filter(r=>inRange(r.date));
const fSales=()=>SALES.filter(s=>inRange(s.data));
function setPreset(days,btn){
  const all=[...ROWS.map(r=>r.date),...SALES.map(s=>s.data)].filter(Boolean).sort();
  const first=all[0]||'', last=all[all.length-1]||'';
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active');
  if(days==='all'||!last){ FROM=first; TO=last; }
  else { const d=new Date(last+'T12:00:00'); d.setDate(d.getDate()-(days-1)); const s=d.toISOString().slice(0,10); FROM=s<first?first:s; TO=last; }
  document.getElementById('dateFrom').value=FROM; document.getElementById('dateTo').value=TO;
  updateRangeInfo(); renderAll();
}
function onDateChange(){
  FROM=document.getElementById('dateFrom').value; TO=document.getElementById('dateTo').value;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  updateRangeInfo(); renderAll();
}
function updateRangeInfo(){
  const n=new Set(fRows().map(r=>r.date)).size;
  document.getElementById('range-info').textContent=`${n} dia${n===1?'':'s'} com dados`;
}

// ═══════════════ AGREGAÇÕES ═══════════════
function agg(rows){
  const a={spend:0,imp:0,link:0,lpv:0,ic:0,buy:0,reach:0};
  rows.forEach(r=>{a.spend+=r.spend;a.imp+=r.imp;a.link+=r.link;a.lpv+=r.lpv;a.ic+=r.ic;a.buy+=r.buy;a.reach+=r.reach;});
  a.ctr=div(a.link,a.imp)!=null?a.link/a.imp*100:null; a.cpc=div(a.spend,a.link); a.cpm=a.imp>0?a.spend/a.imp*1000:null;
  a.connect=a.link>0?a.lpv/a.link*100:null; a.cpv=div(a.spend,a.lpv);
  return a;
}
function salesAgg(sales){
  const tr=sales.filter(isTrafego), org=sales.filter(s=>!isTrafego(s));
  const sum=(l,k)=>l.reduce((s,x)=>s+x[k],0);
  return {tr,org,fatTr:sum(tr,'fatTotal'),fatOrg:sum(org,'fatTotal'),obTr:sum(tr,'fatOB'),obOrg:sum(org,'fatOB'),nObTr:tr.filter(s=>s.fatOB>0).length,nObOrg:org.filter(s=>s.fatOB>0).length,fat:sum(sales,'fatTotal'),n:sales.length};
}
function dayMap(){
  const m={};
  fRows().forEach(r=>{ const d=m[r.date]||(m[r.date]={data:r.date,spend:0,imp:0,link:0,lpv:0,ic:0}); d.spend+=r.spend;d.imp+=r.imp;d.link+=r.link;d.lpv+=r.lpv;d.ic+=r.ic; });
  fSales().forEach(s=>{ const d=m[s.data]||(m[s.data]={data:s.data,spend:0,imp:0,link:0,lpv:0,ic:0}); });
  return Object.values(m).sort((a,b)=>a.data.localeCompare(b.data)).map(d=>{
    const ss=fSales().filter(s=>s.data===d.data), sa=salesAgg(ss);
    return {...d,fat:sa.fat,fatTr:sa.fatTr,nTr:sa.tr.length,nOrg:sa.org.length,n:ss.length,roas:d.spend>0?sa.fatTr/d.spend:null,tkt:ss.length?sa.fat/ss.length:null,cac:sa.tr.length?d.spend/sa.tr.length:null,connect:d.link>0?d.lpv/d.link*100:null};
  });
}
function weekStart(s){ const d=new Date(s+'T12:00:00'); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d.toISOString().slice(0,10); }
function groupBy(keyFn,labelFn){
  const g={};
  fRows().forEach(r=>{ const k=keyFn(r.date); const o=g[k]||(g[k]={k,rows:[],sales:[]}); o.rows.push(r); });
  fSales().forEach(s=>{ const k=keyFn(s.data); const o=g[k]||(g[k]={k,rows:[],sales:[]}); o.sales.push(s); });
  return Object.values(g).sort((a,b)=>a.k.localeCompare(b.k)).map(o=>{ const a=agg(o.rows), sa=salesAgg(o.sales);
    return {label:labelFn(o.k),a,sa,roas:a.spend>0?sa.fatTr/a.spend:null,cac:sa.tr.length?a.spend/sa.tr.length:null}; });
}
function buildCriPubMaps(from,to){
  const rows=ROWS.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)), sales=SALES.filter(s=>(!from||s.data>=from)&&(!to||s.data<=to));
  const cri={},pub={};
  const add=(o,r)=>{o.spend+=r.spend;o.imp+=r.imp;o.link+=r.link;o.lpv+=r.lpv;o.ic+=r.ic;o.buy+=r.buy;};
  rows.forEach(r=>{
    const c=cri[r.ad]||(cri[r.ad]={name:r.ad,adset:r.adset,permalink:r.permalink,spend:0,imp:0,link:0,lpv:0,ic:0,buy:0,vendas:0,fat:0,cl:0,cv:0,ativo:ACTIVE_ADS.has(r.ad)}); add(c,r); if(r.date>=CONFIG.PIXEL_ONLINE_DESDE){c.cl+=r.link;c.cv+=r.lpv;} if(r.permalink)c.permalink=r.permalink;
    const p=pub[r.adset]||(pub[r.adset]={name:r.adset,ads:new Set(),spend:0,imp:0,link:0,lpv:0,ic:0,buy:0,vendas:0,fat:0,cl:0,cv:0,ativo:ACTIVE_ADSETS.has(r.adset)}); add(p,r); p.ads.add(r.ad); if(r.date>=CONFIG.PIXEL_ONLINE_DESDE){p.cl+=r.link;p.cv+=r.lpv;}
  });
  const find=(map,u)=>{ const nu=norm(u); if(!nu)return null; for(const k of Object.keys(map)){ const nk=norm(k); if(nk===nu||(nu.length>4&&(nk.includes(nu)||nu.includes(nk))))return map[k]; } return null; };
  sales.filter(isTrafego).forEach(s=>{ const c=find(cri,s.utmContent); if(c){c.vendas++;c.fat+=s.fatTotal;} const p=find(pub,s.utmMedium); if(p){p.vendas++;p.fat+=s.fatTotal;} });
  const fin=o=>{ o.ctr=o.imp>0?o.link/o.imp*100:null; o.cpc=div(o.spend,o.link); o.connect=o.cl>0?o.cv/o.cl*100:(o.link>0&&o.lpv>0?o.lpv/o.link*100:null); o.roas=o.spend>0?o.fat/o.spend:null; o.cac=div(o.spend,o.vendas); return o; };
  return {cri:Object.values(cri).map(fin),pub:Object.values(pub).map(fin)};
}

    ${kpi('Cliques (link)',fN(A.link))}${kpi('Impressões',fN(A.imp))}
    ${kpi('CPC (link)',fBRL(A.cpc),'','teto '+fBRL(CONFIG.PRECO*CONFIG.BENCH.CPC_MAX_PCT/100))}${kpi('CPM',fBRL(A.cpm))}
    ${kpi('Visitas à página',fN(A.lpv),'',fBRL(A.cpv)+' por visita')}

    `<div class="empty-card">Nenhuma venda registrada ainda no período.<br>Assim que a primeira venda entrar no Webhook (Kiwify), ela aparece aqui com criativo, público e origem.</div>`;
  const stC=[['Cliques no link',A.link],['Visitas',A.lpv],['Checkouts',A.ic],['Compras',S.tr.length]];
  const fun=`<div class="funil-section"><div>${stC.map(([l,v])=>`<div class="funil-bar-wrap"><div class="funil-label"><span>${l}</span><span>${fN(v)}</span></div><div class="funil-bar-bg"><div class="funil-bar-fill" style="width:${A.link>0?Math.max(v>0?1.5:0,v/A.link*100):0}%"></div></div></div>`).join('')}</div>
    <div class="taxa-grid">
      <div class="taxa-item"><span>Clique → Visita (connect)</span><span class="taxa-val">${fP(A.connect,1,true)}</span></div>
      <div class="taxa-item"><span>Visita → Checkout</span><span class="taxa-val">${A.lpv>0?fP(A.ic/A.lpv*100,1,true):'—'}</span></div>
      <div class="taxa-item"><span>Checkout → Compra</span><span class="taxa-val">${A.ic>0?fP(S.tr.length/A.ic*100,1,true):'—'}</span></div>
      <div class="taxa-item"><span>Clique → Compra</span><span class="taxa-val">${A.link>0&&S.tr.length?fP(S.tr.length/A.link*100,2):'—'}</span></div>
    </div></div>`;
  document.getElementById('tab-trafego').innerHTML=(SALES_WARN?`<div class="ob-info">⚠ ${esc(SALES_WARN)}</div>`:'')+kp+ttl('Painel de vendas')+cards+ttl('Funil')+fun
    +`<div class="chart-grid-2x2">${chartBox('ch-t1','Investimento por dia')}${chartBox('ch-t2','Cliques no link × Visitas por dia')}${chartBox('ch-t3','Connect rate por dia (meta 75%)')}${chartBox('ch-t4','Faturamento × Investimento por dia')}</div>
    <div class="ob-info">Fonte dos números: Meta Ads (investimento, cliques, visitas, checkouts) e Webhook (faturamento e vendas). Tráfego = utm_source “meta_ads”; qualquer outra origem conta como orgânico.</div>`;
  const lb=dias.map(d=>dShort(d.data));
  mkChart('ch-t1',{type:'bar',data:{labels:lb,datasets:[{label:'Investimento (R$)',data:dias.map(d=>+d.spend.toFixed(2)),backgroundColor:ORANGE}]},options:opts({scales:yFmt(v=>'R$'+fS(v,0))})});
  mkChart('ch-t2',{type:'bar',data:{labels:lb,datasets:[{label:'Cliques no link',data:dias.map(d=>d.link),backgroundColor:ORANGE},{label:'Visitas',data:dias.map(d=>d.lpv),backgroundColor:AMBER}]},options:opts()});
  mkChart('ch-t3',{type:'line',data:{labels:lb,datasets:[{label:'Connect rate (%)',data:dias.map(d=>d.connect==null?null:+d.connect.toFixed(1)),borderColor:ORANGE,backgroundColor:ORANGE,tension:.25,pointRadius:4},{label:'Meta 75%',data:dias.map(()=>CONFIG.BENCH.CONNECT_MIN),borderColor:AMBER,borderDash:[5,4],pointRadius:0}]},options:opts({scales:{...yFmt(v=>v+'%'),y:{ticks:{color:TXT,font:{size:10},callback:v=>v+'%'},grid:{color:GRID},beginAtZero:true,max:100}}})});
  mkChart('ch-t4',{type:'bar',data:{labels:lb,datasets:[{label:'Investimento',data:dias.map(d=>+d.spend.toFixed(2)),backgroundColor:ORANGE},{label:'Faturamento tráfego',data:dias.map(d=>+d.fatTr.toFixed(2)),backgroundColor:AMBER}]},options:opts({scales:yFmt(v=>'R$'+fS(v,0))})});
};

// ─────────── VISÃO GERAL ───────────
TAB_RENDER.visao=function(){
  const A=agg(fRows()), S=salesAgg(fSales()), dias=dayMap();
  const roas=A.spend>0?S.fat/A.spend:null, tkt=S.n?S.fat/S.n:null, cac=S.n?A.spend/S.n:null;
  const kp=`<div class="kpi-grid">${kpi('Investimento',fBRL(A.spend),'orange')}${kpi('Fat. Total',fBRL(S.fat),'green')}${kpi('ROAS Total',fX(roas),roas!=null&&roas>=CONFIG.ROAS_ALVO?'green':'orange')}${kpi('Vendas Total',fN(S.n))}${kpi('Tráfego',fN(S.tr.length),'green')}${kpi('Orgânicas',fN(S.org.length))}${kpi('Ticket Médio',fBRL(tkt))}${kpi('CAC Total',fBRL(cac),'orange')}</div>`;
  const body=dias.map(d=>`<tr><td>${dBR(d.data)}</td><td>${fBRL(d.spend)}</td><td>${fN(d.link)}</td><td>${fN(d.lpv)}</td><td>${fP(d.connect,0,d.link>0)}</td><td>${fN(d.ic)}</td><td>${fBRL(d.fat)}</td><td>${fX(d.spend>0?d.fat/d.spend:null)}</td><td>${fN(d.n)}</td><td>${fN(d.nTr)}</td><td>${fN(d.nOrg)}</td><td>${fBRL(d.tkt)}</td><td>${fBRL(d.n?d.spend/d.n:null)}</td></tr>`).join('');
  const tot=`<tr class="total"><td>TOTAL</td><td>${fBRL(A.spend)}</td><td>${fN(A.link)}</td><td>${fN(A.lpv)}</td><td>${fP(A.connect,0,true)}</td><td>${fN(A.ic)}</td><td>${fBRL(S.fat)}</td><td>${fX(roas)}</td><td>${fN(S.n)}</td><td>${fN(S.tr.length)}</td><td>${fN(S.org.length)}</td><td>${fBRL(tkt)}</td><td>${fBRL(cac)}</td></tr>`;
  document.getElementById('tab-visao').innerHTML=kp+ttl('Dia a dia')+`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Invest.</th><th>Cliques</th><th>Visitas</th><th>Connect</th><th>Checkouts</th><th>Fat. Total</th><th>ROAS</th><th>Compras Total</th><th>Tráfego</th><th>Orgânicas</th><th>Ticket Médio</th><th>CAC</th></tr></thead><tbody>${body}${tot}</tbody></table></div>
  ${dias.some(d=>d.data<CONFIG.PIXEL_ONLINE_DESDE&&d.link>0&&d.lpv===0)?`<div class="ob-info" style="margin-top:14px">ℹ Dias anteriores a ${dBR(CONFIG.PIXEL_ONLINE_DESDE)} têm cliques mas 0 visitas: o Pixel da página só passou a registrar visitas na noite de 21/09. Não representa queda real de conexão.</div>`:''}${MODE==='snapshot'?`<div class="ob-info" style="margin-top:10px">ℹ ${dBR(ROWS.reduce((m,r)=>r.date>m?r.date:m,''))} é um dia parcial (dados até ${SNAPSHOT.geradoEm.split('·')[1].trim()}).</div>`:''}`;
};

// ─────────── CRIATIVOS ───────────
function sortList(list,key){ const asc=key==='cpc'||key==='cac'; return [...list].sort((a,b)=>{const x=a[key],y=b[key]; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return asc?x-y:y-x;}); }
function setCriFilter(v){CRI_FILTER=v;TAB_RENDER.criativos();} function setCriSort(v){CRI_SORT=v;TAB_RENDER.criativos();}
function setPubFilter(v){PUB_FILTER=v;TAB_RENDER.publicos();} function setPubSort(v){PUB_SORT=v;TAB_RENDER.publicos();}
const connCls=v=>v==null?'':v>=CONFIG.BENCH.CONNECT_MIN?'green':v>=60?'yellow':'red';
TAB_RENDER.criativos=function(){
  let {cri}=buildCriPubMaps(FROM,TO);
  cri=cri.filter(c=>CRI_FILTER==='todos'||(CRI_FILTER==='ativos'?c.ativo:!c.ativo)); cri=sortList(cri,CRI_SORT);
  const tot=cri.reduce((s,c)=>s+c.spend,0);
  const bar=`<div class="cri-filterbar">${['todos','ativos','inativos'].map(f=>`<button class="cri-filter-btn ${CRI_FILTER===f?'active':''}" onclick="setCriFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}<span class="cri-sort-label" style="margin-left:12px">Ordenar por:</span>${[['spend','Investimento'],['ctr','CTR'],['cpc','CPC'],['roas','ROAS'],['vendas','Vendas']].map(([k,l])=>`<button class="cri-sort-btn ${CRI_SORT===k?'active':''}" onclick="setCriSort('${k}')">${l}</button>`).join('')}</div>`;
  const cards=cri.length?`<div class="cri-grid">${cri.map(c=>`<div class="cri-card ${c.ativo?'ativo':''}"><div class="cri-card-header"><div class="cri-name">${esc(c.name)}</div><span class="cri-badge ${c.ativo?'ativo':'inativo'}">${c.ativo?'● Ativo':'Inativo'}</span></div>
    <div class="cri-metrics">
      <div class="cri-metric"><span class="cri-metric-label">Investimento</span><span class="cri-metric-val hl">${fBRL(c.spend)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">% da verba</span><span class="cri-metric-val">${fP(tot>0?c.spend/tot*100:null,0)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">CTR (link)</span><span class="cri-metric-val">${fP(c.ctr)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">CPC (link)</span><span class="cri-metric-val">${fBRL(c.cpc)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">Cliques → Visitas</span><span class="cri-metric-val">${fN(c.link)} → ${fN(c.lpv)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">Connect (Pixel ativo)</span><span class="cri-metric-val ${connCls(c.connect)}">${fP(c.connect,0,c.connect!=null)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">Checkouts</span><span class="cri-metric-val">${fN(c.ic)}</span></div>
      <div class="cri-metric"><span class="cri-metric-label">Vendas · ROAS</span><span class="cri-metric-val">${fN(c.vendas)} · ${fX(c.roas)}</span></div>
    </div>${c.permalink?`<a class="cri-link" href="${esc(c.permalink)}" target="_blank" rel="noopener">↗ ${esc(c.permalink)}</a>`:''}</div>`).join('')}</div>`:`<div class="empty-card">Nenhum criativo neste filtro/período.</div>`;
  const tb=cri.map(c=>`<tr><td class="l" style="max-width:340px;white-space:normal">${esc(c.name)}</td><td>${fBRL(c.spend)}</td><td>${fN(c.imp)}</td><td>${fN(c.link)}</td><td>${fP(c.ctr)}</td><td>${fBRL(c.cpc)}</td><td>${fN(c.lpv)}</td><td>${fP(c.connect,0,c.connect!=null)}</td><td>${fN(c.ic)}</td><td>${fN(c.vendas)}</td><td>${fBRL(c.fat)}</td><td>${fX(c.roas)}</td><td>${fBRL(c.cac)}</td></tr>`).join('');
  document.getElementById('tab-criativos').innerHTML=bar+cards+ttl('Tabela')+`<div class="tbl-wrap"><table><thead><tr><th class="l">Criativo</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Visitas</th><th>Connect*</th><th>Checkouts</th><th>Vendas</th><th>Fat.</th><th>ROAS</th><th>CAC</th></tr></thead><tbody>${tb}</tbody></table></div>
  <div class="ob-info" style="margin-top:14px">${cri.length?'Leitura: o menor CTR entre os criativos é '+fP(Math.min(...cri.map(c=>c.ctr==null?Infinity:c.ctr)))+' (bom ≥ '+CONFIG.BENCH.CTR_BOM+'%). ':''}*Connect = visitas ÷ cliques nos dias com Pixel ativo (a partir de ${dShort(CONFIG.PIXEL_ONLINE_DESDE)}). Amostra ainda pequena — acompanhar mais alguns dias antes de comparar criativos por esse indicador.</div>`;
};

// ─────────── PÚBLICOS ───────────
TAB_RENDER.publicos=function(){
  let {pub}=buildCriPubMaps(FROM,TO);
  pub=pub.filter(p=>PUB_FILTER==='todos'||(PUB_FILTER==='ativos'?p.ativo:!p.ativo)); pub=sortList(pub,PUB_SORT);
  const bar=`<div class="cri-filterbar">${['todos','ativos','inativos'].map(f=>`<button class="pub-filter-btn ${PUB_FILTER===f?'active':''}" onclick="setPubFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}<span class="cri-sort-label" style="margin-left:12px">Ordenar por:</span>${[['spend','Investimento'],['ctr','CTR'],['cpc','CPC'],['roas','ROAS'],['vendas','Vendas']].map(([k,l])=>`<button class="pub-sort-btn ${PUB_SORT===k?'active':''}" onclick="setPubSort('${k}')">${l}</button>`).join('')}</div>`;
  const info=SNAPSHOT.adsetInfo;
  const cards=pub.length?`<div class="pub-grid">${pub.map(p=>`<div class="pub-card ${p.ativo?'ativo':''}"><div class="pub-card-header"><div class="pub-name">${esc(p.name)}<div style="font-size:10px;color:rgba(255,255,255,.35);font-weight:400;margin-top:3px">${p.ads.size} criativo${p.ads.size===1?'':'s'}</div></div><span class="cri-badge ${p.ativo?'ativo':'inativo'}">${p.ativo?'● Ativo':'Inativo'}</span></div>
    <div class="pub-metrics"><div class="pub-metric"><div class="pub-metric-val">${fBRL(p.spend)}</div><div class="pub-metric-lbl">Investimento</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fP(p.ctr)}</div><div class="pub-metric-lbl">CTR (link)</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fBRL(p.cpc)}</div><div class="pub-metric-lbl">CPC (link)</div></div>
    <div class="pub-metric"><div class="pub-metric-val neutral">${fN(p.link)} → ${fN(p.lpv)}</div><div class="pub-metric-lbl">Cliques → Visitas</div></div><div class="pub-metric"><div class="pub-metric-val ${connCls(p.connect)}">${fP(p.connect,0,p.connect!=null)}</div><div class="pub-metric-lbl">Connect (Pixel ativo)</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fN(p.vendas)} · ${fX(p.roas)}</div><div class="pub-metric-lbl">Vendas · ROAS</div></div></div>
    ${MODE==='snapshot'&&p.name===info.nome?`<div style="font-size:11px;color:rgba(255,255,255,.5);line-height:1.7"><b>${esc(info.publico)}</b><br>${esc(info.segmentacao)}<br>Orçamento ${esc(info.orcamento)} · Otimização: ${esc(info.otimizacao)}<br>Posicionamentos: ${esc(info.posicionamentos)}<br>${esc(info.dispositivo)}</div>`:''}</div>`).join('')}</div>`:`<div class="empty-card">Nenhum público neste filtro/período.</div>`;
  document.getElementById('tab-publicos').innerHTML=bar+cards;
};

// ─────────── SEMANA / MÊS ───────────
function pixelNote(){
  const has=fRows().some(r=>r.date<CONFIG.PIXEL_ONLINE_DESDE&&r.link>0&&r.lpv===0);
  return has?`<div class="ob-info" style="margin-top:14px">ℹ O connect rate dos períodos que incluem dias anteriores a ${dBR(CONFIG.PIXEL_ONLINE_DESDE)} está subestimado: nesses dias o Pixel ainda não registrava visitas.</div>`:'';
}
function periodTable(list){
  const body=list.map(g=>`<tr><td>${g.label}</td><td>${fBRL(g.a.spend)}</td><td>${fN(g.a.imp)}</td><td>${fN(g.a.link)}</td><td>${fP(g.a.ctr)}</td><td>${fBRL(g.a.cpc)}</td><td>${fBRL(g.a.cpm)}</td><td>${fN(g.a.lpv)}</td><td>${fP(g.a.connect,0,g.a.link>0)}</td><td>${fN(g.a.ic)}</td><td>${fN(g.sa.n)}</td><td>${fBRL(g.sa.fat)}</td><td>${fX(g.roas)}</td><td>${fBRL(g.cac)}</td></tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr><th>Período</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>CPM</th><th>Visitas</th><th>Connect</th><th>Checkouts</th><th>Vendas</th><th>Fat.</th><th>ROAS</th><th>CAC</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function periodCharts(id,list){
  return `<div class="chart-grid-2x2">${chartBox(id+'-a','Investimento por período')}${chartBox(id+'-b','CTR (link) por período')}</div>`;
}
function drawPeriodCharts(id,list){
  const lb=list.map(g=>g.label);
  mkChart(id+'-a',{type:'bar',data:{labels:lb,datasets:[{label:'Investimento (R$)',data:list.map(g=>+g.a.spend.toFixed(2)),backgroundColor:ORANGE}]},options:opts({scales:yFmt(v=>'R$'+fS(v,0))})});
  mkChart(id+'-b',{type:'line',data:{labels:lb,datasets:[{label:'CTR (%)',data:list.map(g=>g.a.ctr==null?null:+g.a.ctr.toFixed(2)),borderColor:AMBER,backgroundColor:AMBER,tension:.25,pointRadius:4}]},options:opts({scales:yFmt(v=>v+'%')})});
}
TAB_RENDER.semanal=function(){
  const list=groupBy(weekStart,k=>{const d=new Date(k+'T12:00:00'),e=new Date(d);e.setDate(e.getDate()+6);const f=x=>x.toISOString().slice(0,10).split('-').reverse().slice(0,2).join('/');return `${f(d)} – ${f(e)}`;});
  document.getElementById('tab-semanal').innerHTML=ttl('Semana a semana (segunda a domingo)')+periodTable(list)+periodCharts('ch-s',list)+pixelNote()+(list.length<2?`<div class="ob-info">Ainda há apenas ${list.length} semana com dados — a comparação semana a semana aparece conforme a campanha roda.</div>`:'');
  drawPeriodCharts('ch-s',list);
};
TAB_RENDER.mensal=function(){
  const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const list=groupBy(d=>d.slice(0,7),k=>{const[y,m]=k.split('-');return `${M[+m-1]} de ${y}`;});
  document.getElementById('tab-mensal').innerHTML=ttl('Mês a mês')+periodTable(list)+periodCharts('ch-m',list)+pixelNote()+(list.length<2?`<div class="ob-info">Ainda há apenas ${list.length} mês com dados — o comparativo mensal aparece conforme a campanha roda.</div>`:'');
  drawPeriodCharts('ch-m',list);
};

loadData();
</script>
</body>
</html>
