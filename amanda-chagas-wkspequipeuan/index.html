const $ = id => document.getElementById(id);
const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const p2 = n => String(n).padStart(2,'0');
const fmtBRL = n => (n&&isFinite(n)) ? 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
const fmtInt = n => (n&&isFinite(n)) ? Math.round(n).toLocaleString('pt-BR') : '—';
const fmtNum0 = n => isFinite(n) ? Math.round(n).toLocaleString('pt-BR') : '—';
const fmtPct = n => (n&&isFinite(n)) ? n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%' : '—';
const fmtX = n => (n&&isFinite(n)) ? n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x' : '—';
const fmtDec = n => (n&&isFinite(n)) ? n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
const div = (a,b) => b>0 ? a/b : 0;
const brDate = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7) : '';
const hoje = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function weekStart(iso){ const d=new Date(iso+'T12:00:00'); const wd=(d.getDay()+6)%7; return addDays(iso,-wd); }

function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function findCol(hdr,name){
  const n=norm(name); let i=hdr.findIndex(h=>norm(h)===n);
  if(i<0) i=hdr.findIndex(h=>norm(h)&&norm(h).includes(n));
  return i;
}
function money(v){
  let s=String(v==null?'':v).replace(/R\$/g,'').replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function parseDate(v){
  const s=String(v||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  return '';
}
const isTrafego = s => [s.src,s.utmSource].some(x=>norm(x).replace(/[\s_-]/g,'')==='metaads');
const isPaused = s => String(s||'').toUpperCase().includes('PAUSED');

async function fetchSheetCSV(sheetName){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error(`Planilha "${sheetName}": HTTP ${r.status}. Verifique se está pública.`);
    const t=await r.text();
    if(t.includes('Signin')||t.includes('accounts.google')) throw new Error(`Planilha "${sheetName}" requer login. Defina como pública.`);
    return t;
  }catch(e){ clearTimeout(to); if(e.name==='AbortError') throw new Error(`Timeout ao carregar "${sheetName}".`); throw e; }
}

function processGerenciador(rows){
  if(rows.length<2) return [];
  const hdr=rows[0], G={}; for(const [k,n] of Object.entries(CONFIG.G)) G[k]=findCol(hdr,n);
  if(G.date<0||G.inv<0) throw new Error('Aba Gerenciador: não encontrei as colunas Data/Investimento.');
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const d=parseDate(r[G.date]); if(!d) continue;
    const g=k=>G[k]>=0?r[G[k]]:'';
    out.push({date:d, campaign:g('campaign'), adset:String(g('adset')).trim(), ad:String(g('ad')).trim(), status:g('status'), link:g('link'),
      inv:money(g('inv')), imp:money(g('imp')), cli:money(g('cli')), ck:money(g('ck')), buy:money(g('buy')),
      pub:String(g('pub')).trim().toUpperCase()||(/QUENTE/i.test(g('campaign'))?'QUENTE':'FRIO')});
  }
  return out;
}
function processSales(rows){
  if(rows.length<2) return [];
  const hdr=rows[0], W={}; for(const [k,n] of Object.entries(CONFIG.W)) W[k]=findCol(hdr,n);
  if(W.data<0) throw new Error('Aba Webhook: não encontrei a coluna "Data de Venda".');
  const RX_NEG=/reembols|refund|cancel|chargeback|estorn|disput|recus/;
  const out=[], seen=new Set();
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r.some(x=>String(x).trim())) continue;
    const g=k=>W[k]>=0?String(r[W[k]]==null?'':r[W[k]]).trim():'';
    const data=parseDate(g('data')); if(!data) continue;
    if(data<CONFIG.DATA_MINIMA) continue;
    const st=norm(g('status'));
    if(!st.includes('aprov')||RX_NEG.test(st)) continue;
    const cod=g('cod'); if(cod){ if(seen.has(cod)) continue; seen.add(cod); }
    const s={data, hora:g('data').slice(11,16), cod, nome:g('cliente'), email:g('email'), pgto:g('pgto'), valor:money(g('preco')),
      src:g('src'), utmSource:g('utmSource'), utmMedium:g('utmMedium'), utmCampaign:g('utmCampaign'), utmContent:g('utmContent')};
    s.trafego=isTrafego(s); out.push(s);
  }
  return out;
}

    const ontem=addDays(hoje(),-1);
    DATA_MAX = ontem<CONFIG.DATA_FIM ? ontem : CONFIG.DATA_FIM;
    const gAll=processGerenciador(parseCSV(g)), sAll=processSales(parseCSV(w));
    GROWS=gAll.filter(r=>r.date<=DATA_MAX);
    SALES=sAll.filter(s=>s.data<=DATA_MAX).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
    SALES_PENDENTES=sAll.filter(s=>s.data>DATA_MAX).length;
    const all=[...GROWS.map(r=>r.date),...SALES.map(s=>s.data)].sort();
    const min=all[0]||CONFIG.DATA_MINIMA, max=all[all.length-1]||DATA_MAX;
    $('dateFrom').min=$('dateTo').min=min; $('dateFrom').max=$('dateTo').max=max;
    if(!FROM||!TO){ FROM=CONFIG.DATA_INICIO_TRAFEGO>min?CONFIG.DATA_INICIO_TRAFEGO:min; TO=max; }
    $('dateFrom').value=FROM; $('dateTo').value=TO;
    $('loading-overlay').style.display='none';
    renderAll();
  }catch(e){
    $('loading-msg').innerHTML='<span style="color:#e74c3c">'+e.message+'</span><br><br><button class="preset-btn" onclick="loadData()">Tentar de novo</button>';
  }
}

function allDates(){ return [...GROWS.map(r=>r.date),...SALES.map(s=>s.data)].filter(Boolean).sort(); }
function setPreset(days,btn){

}

const inR=(d,f,t)=>(!f||d>=f)&&(!t||d<=t);
function aggregate(from,to){
  const rs=GROWS.filter(r=>inR(r.date,from,to)), ss=SALES.filter(s=>inR(s.data,from,to));
  const a={inv:0,imp:0,cli:0,ck:0,buy:0,fat:0,vendas:ss.length,vTraf:0,fTraf:0};
  rs.forEach(r=>{a.inv+=r.inv;a.imp+=r.imp;a.cli+=r.cli;a.ck+=r.ck;a.buy+=r.buy;});
  ss.forEach(s=>{a.fat+=s.valor; if(s.trafego){a.vTraf++;a.fTraf+=s.valor;}});
  a.lpv=0; dayList(from,to).forEach(d=>{ const md=META.diario[d]; if(md) Object.values(md).forEach(c=>a.lpv+=(c.lpv||0)); });
  a.vSem=a.vendas-a.vTraf; a.fSem=a.fat-a.fTraf;
  a.roas=div(a.fat,a.inv); a.cac=div(a.inv,a.vendas); a.ticket=div(a.fat,a.vendas); a.cpc=div(a.inv,a.cli); a.cpm=div(a.inv,a.imp)*1000; a.ctr=div(a.cli,a.imp)*100;
  return a;
}
function dayList(from,to){ const o=[]; if(!from||!to) return o; for(let d=from; d<=to; d=addDays(d,1)) o.push(d); return o; }
function dayRows(from,to){
  return dayList(from,to).map(d=>{ const a=aggregate(d,d); a.data=d;
    const md=META.diario[d]; a.reach=md?Object.values(md).reduce((x,c)=>x+c.reach,0):0; return a; });
}

let criFilter='todos', criSort='inv', pubFilter='todos', pubSort='inv';
function buildCriPubMaps(from,to){
  const cri=new Map(), pub=new Map(), adset=new Map();
  const latest={}; GROWS.forEach(r=>{ const k=r.pub+'|'+r.ad; if(!latest[k]||r.date>=latest[k].date) latest[k]=r; });
  const latestAs={}; GROWS.forEach(r=>{ const k=r.pub+'|'+r.adset; if(!latestAs[k]||r.date>=latestAs[k].date) latestAs[k]=r; });
  const add=(m,key,base,r)=>{ if(!m.has(key)) m.set(key,Object.assign({inv:0,imp:0,cli:0,ck:0,buy:0},base)); const o=m.get(key); o.inv+=r.inv;o.imp+=r.imp;o.cli+=r.cli;o.ck+=r.ck;o.buy+=r.buy; };
  GROWS.filter(r=>inR(r.date,from,to)).forEach(r=>{
    const l=latest[r.pub+'|'+r.ad];
    add(cri,r.pub+'|'+r.ad,{ad:r.ad,pub:r.pub,ativo:!isPaused(l.status),link:l.link,adset:l.adset},r);
    add(pub,r.pub,{pub:r.pub,ativo:true},r);
    const la=latestAs[r.pub+'|'+r.adset];
    add(adset,r.pub+'|'+r.adset,{adset:r.adset,pub:r.pub,ativo:!isPaused(la.status)},r);
  });
  [cri,pub,adset].forEach(m=>m.forEach(o=>{o.ctr=div(o.cli,o.imp)*100;o.cpc=div(o.inv,o.cli);o.cpm=div(o.inv,o.imp)*1000;o.cck=div(o.inv,o.ck);}));
  const invFull={}; GROWS.filter(r=>inR(r.date,META.since,META.asOf)).forEach(r=>{ const k=r.pub+'|'+r.ad; invFull[k]=(invFull[k]||0)+r.inv; });
  const codeOf=s=>norm(s).replace(/[^a-z0-9]/g,'');
  const salesTraf=SALES.filter(s=>s.trafego&&inR(s.data,from,to));
  cri.forEach((o,k)=>{ const m=META.anuncios[k]; o.reach=m?m.reach:0; o.freq=m?m.freq:0;
    o.roasMeta=m&&invFull[k]?div(m.purchVal||0,invFull[k]):0;   // Meta*: período completo, não acompanha o filtro de datas
    const code=codeOf(o.ad.replace(/_WKSP_UAN$/i,'')), full=codeOf(o.ad);
    const mine=salesTraf.filter(s=>{ const c=codeOf(s.utmContent); if(!c||!(c.includes(full)||c.includes(code))) return false;
      const t=norm(s.utmMedium+' '+s.utmCampaign); const pubT=t.includes('quente')?'QUENTE':(t.includes('frio')?'FRIO':''); return !pubT||pubT===o.pub; });
    o.vTraf=mine.length; o.fTraf=mine.reduce((x,s)=>x+s.valor,0); o.roasReal=mine.length?div(o.fTraf,o.inv):null; });
  pub.forEach((o,k)=>{ const m=META.campanhas[k]; o.reach=m?m.reach:0; o.freq=m?m.freq:0; });
  adset.forEach(o=>{ const m=META.conjuntos[o.adset]; o.reach=m?m.reach:0; o.freq=m?m.freq:0; });
  return {cri:[...cri.values()],pub:[...pub.values()],adset:[...adset.values()]};
}
const SORTS={inv:'Investimento',ctr:'CTR',cpc:'CPC',ck:'Checkouts',buy:'Compras Meta*'};
function sortFn(k){ return (a,b)=> k==='cpc' ? ((a.cpc||1e9)-(b.cpc||1e9)) : (b[k]-a[k]); }
function setCriFilter(v){criFilter=v;renderCriativos();} function setCriSort(v){criSort=v;renderCriativos();}
function setPubFilter(v){pubFilter=v;renderPublicos();} function setPubSort(v){pubSort=v;renderPublicos();}

  <div class="cri-grid">${list.map(o=>`<div class="cri-card ${o.ativo?'ativo':''}"><div class="cri-card-header"><div class="cri-name">${o.ad}<br><span style="color:rgba(255,255,255,.4);font-weight:400">${o.pub}</span></div><span class="cri-badge ${o.ativo?'ativo':'inativo'}">${o.ativo?'Ativo':'Inativo'}</span></div>
    <div class="cri-metrics">

    ${o.link?`<a class="cri-link" href="${o.link}" target="_blank" rel="noopener">${o.link}</a>`:''}</div>`).join('')||'<div class="kpi-sub">Nada no período.</div>'}</div>
  <div class="sec-title">Tabela</div><div class="tbl-wrap"><table><thead><tr><th>Anúncio</th><th>Público</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>CPM</th><th>Checkouts</th><th>Custo/Checkout</th><th>Compras Meta*</th><th>ROAS Meta*</th><th>Vendas rastreadas</th><th>ROAS rastreado</th></tr></thead><tbody>
  ${list.map(o=>`<tr><td>${o.ad}</td><td>${o.pub}</td><td>${fmtBRL(o.inv)}</td><td>${fmtInt(o.imp)}</td><td>${fmtInt(o.cli)}</td><td>${fmtPct(o.ctr)}</td><td>${fmtBRL(o.cpc)}</td><td>${fmtBRL(o.cpm)}</td><td>${fmtInt(o.ck)}</td><td>${fmtBRL(o.cck)}</td><td>${fmtInt(o.buy)}</td><td>${fmtX(o.roasMeta)}</td><td>${fmtNum0(o.vTraf)}</td><td>${fmtX(o.roasReal)}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderPublicos(){
  const {pub,adset}=buildCriPubMaps(FROM,TO);
  const lp=pub.filter(o=>pubFilter==='todos'||o.pub===pubFilter).sort(sortFn(pubSort)), la=adset.filter(o=>pubFilter==='todos'||o.pub===pubFilter).sort(sortFn(pubSort));
  const b=(v,l)=>`<button class="pub-filter-btn ${pubFilter===v?'active':''}" onclick="setPubFilter('${v}')">${l}</button>`;
  const card=(nome,o)=>`<div class="pub-card ${o.ativo?'ativo':''}"><div class="pub-card-header"><div class="pub-name">${nome}</div><span class="cri-badge ${o.ativo?'ativo':'inativo'}">${o.pub}</span></div>
    <div class="pub-metrics"><div class="pub-metric"><div class="pub-metric-val">${fmtBRL(o.inv)}</div><div class="pub-metric-lbl">Invest.</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fmtPct(o.ctr)}</div><div class="pub-metric-lbl">CTR</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fmtBRL(o.cpc)}</div><div class="pub-metric-lbl">CPC</div></div>
    <div class="pub-metric"><div class="pub-metric-val neutral">${fmtInt(o.ck)}</div><div class="pub-metric-lbl">Checkouts</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fmtInt(o.buy)}</div><div class="pub-metric-lbl">Compras Meta*</div></div><div class="pub-metric"><div class="pub-metric-val neutral">${fmtInt(o.reach)}</div><div class="pub-metric-lbl">Alcance · ${fmtDec(o.freq)}x</div></div></div></div>`;
  $('tab-publicos').innerHTML=note+`<div class="cri-filterbar">${b('todos','Todos')}${b('FRIO','Frio')}${b('QUENTE','Quente')}<span class="cri-sort-label" style="margin-left:12px">Ordenar:</span>${Object.entries(SORTS).map(([k,l])=>`<button class="pub-sort-btn ${pubSort===k?'active':''}" onclick="setPubSort('${k}')">${l}</button>`).join('')}</div>
  <div class="sec-title">Campanhas por público</div><div class="pub-grid">${lp.map(o=>card('Campanha '+o.pub,o)).join('')}</div>
  <div class="sec-title">Conjuntos de anúncios</div><div class="pub-grid">${la.map(o=>card(o.adset,o)).join('')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Conjunto</th><th>Público</th><th>Invest.</th><th>Impr.</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>CPM</th><th>Checkouts</th><th>Compras Meta*</th><th>Alcance</th><th>Freq.</th></tr></thead><tbody>
  ${la.map(o=>`<tr><td>${o.adset}</td><td>${o.pub}</td><td>${fmtBRL(o.inv)}</td><td>${fmtInt(o.imp)}</td><td>${fmtInt(o.cli)}</td><td>${fmtPct(o.ctr)}</td><td>${fmtBRL(o.cpc)}</td><td>${fmtBRL(o.cpm)}</td><td>${fmtInt(o.ck)}</td><td>${fmtInt(o.buy)}</td><td>${fmtInt(o.reach)}</td><td>${fmtDec(o.freq)}</td></tr>`).join('')}</tbody></table></div>`;
}

// ───────────── Semana / Mês ─────────────
function groupBy(keyFn,labelFn){
  const days=dayRows(FROM,TO), m=new Map();
  days.forEach(d=>{ const k=keyFn(d.data); if(!m.has(k)) m.set(k,{k,label:labelFn(k,d.data),from:d.data,to:d.data}); const g=m.get(k); g.to=d.data; });
  return [...m.values()].map(g=>Object.assign(g,aggregate(g.from,g.to)));
}
function periodTable(rows){
  return `<div class="tbl-wrap"><table><thead><tr><th>Período</th><th>Invest.</th><th>Fat. Total</th><th>ROAS</th><th>Vendas</th><th>meta_ads</th><th>Ticket</th><th>CAC</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Checkouts</th><th>Compras Meta*</th></tr></thead><tbody>
  ${rows.map(g=>`<tr><td>${g.label}</td><td>${fmtBRL(g.inv)}</td><td>${fmtBRL(g.fat)}</td><td>${fmtX(g.roas)}</td><td>${fmtNum0(g.vendas)}</td><td>${fmtNum0(g.vTraf)}</td><td>${fmtBRL(g.ticket)}</td><td>${fmtBRL(g.cac)}</td><td>${fmtInt(g.cli)}</td><td>${fmtPct(g.ctr)}</td><td>${fmtBRL(g.cpc)}</td><td>${fmtInt(g.ck)}</td><td>${fmtInt(g.buy)}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderSemanal(){
  const rows=groupBy(weekStart,(k,d)=>'Sem. '+brDate(k)+' →'); rows.forEach(g=>g.label='Sem. '+brDate(g.from)+'–'+brDate(g.to));
  $('tab-semanal').innerHTML=avisos()+`<div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento por semana</h4><canvas id="ch-s1"></canvas></div><div class="chart-card"><h4>CTR por semana</h4><canvas id="ch-s2"></canvas></div></div>`+periodTable(rows);
  mkChart('ch-s1',{type:'bar',data:{labels:rows.map(g=>g.label),datasets:[{label:'Investimento',data:rows.map(g=>g.inv),backgroundColor:OR},{label:'Faturamento',data:rows.map(g=>g.fat),backgroundColor:AM}]}});
  mkChart('ch-s2',{type:'line',data:{labels:rows.map(g=>g.label),datasets:[{label:'CTR %',data:rows.map(g=>g.ctr),borderColor:OR,backgroundColor:'rgba(255,107,43,.15)',fill:true,tension:.3}]}});
}
function renderMensal(){
  const mn=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const rows=groupBy(d=>d.slice(0,7),k=>mn[+k.slice(5,7)-1]+'/'+k.slice(0,4));
  $('tab-mensal').innerHTML=avisos()+`<div class="chart-grid-2x2"><div class="chart-card"><h4>Investimento × Faturamento por mês</h4><canvas id="ch-m1"></canvas></div><div class="chart-card"><h4>CTR por mês</h4><canvas id="ch-m2"></canvas></div></div>`+periodTable(rows);
  mkChart('ch-m1',{type:'bar',data:{labels:rows.map(g=>g.label),datasets:[{label:'Investimento',data:rows.map(g=>g.inv),backgroundColor:OR},{label:'Faturamento',data:rows.map(g=>g.fat),backgroundColor:AM}]}});
  mkChart('ch-m2',{type:'line',data:{labels:rows.map(g=>g.label),datasets:[{label:'CTR %',data:rows.map(g=>g.ctr),borderColor:OR,backgroundColor:'rgba(255,107,43,.15)',fill:true,tension:.3}]}});
}

function renderAll(){
  document.title=CONFIG.PRODUTO+' · '+CONFIG.CLIENTE+' — Jamelli GT';
  $('range-info').textContent=FROM&&TO?(brDate(FROM)+' → '+brDate(TO)+' · dados até '+brDate(DATA_MAX)):'';
  const act=document.querySelector('.content.active'); const id=act?act.id.replace('tab-',''):'trafego';
  ({trafego:renderTrafego,visao:renderVisao,criativos:renderCriativos,publicos:renderPublicos,semanal:renderSemanal,mensal:renderMensal})[id]();
}
loadData();
</script>
